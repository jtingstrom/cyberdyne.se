<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fingerfärd</title>
<meta name="description" content="Lär dig skriva på tangentbordet med rätt finger på rätt tangent. Korta lektioner från grundraden till hela meningar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 7' shape-rendering='crispEdges'%3E%3Cpath fill='%230b0a10' d='M2 0h4v1h1v1h1v2H7v1H6v1H5v1H3V6H2V5H1V4H0V2h1V1h1z'/%3E%3Cpath fill='%236ec6ff' d='M2 1h4v1h1v2H6v1H5v1H3V5H2V4H1V2h1z'/%3E%3Cpath fill='%23fff' d='M2 1h1v1H2zM1 2h1v1H1z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../stil.css">
<style>
  /* Fingerfärd: egna delar, prefix ff- så inget krockar med stil.css. Fingerfärger: lillfinger korall, ringfinger guld, långfinger grön, pekfinger blå, tumme lila. */
  :root { --f-p: #ff9f8a; --f-r: #ffd166; --f-m: #7ccf5a; --f-i: #6ec6ff; --f-t: #b58cff; --bad: #e0675a; }
  #app { max-width: 820px; }
  .ff-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ff-head h1 { font-size: clamp(2rem, 7vw, 2.8rem); }
  .ff-head h1 span { color: var(--f-i); }
  .ff-head .btn { font-size: .95rem; padding: 7px 12px; }
  .ff-headbtns { display: flex; gap: 8px; }

  /* tangentbord: 60 kolumner = 15 tangentbredder à 4 */
  .ff-kb { display: flex; flex-direction: column; gap: 4px; background: var(--well); border: 3px solid var(--edge); border-radius: 4px; padding: 8px; user-select: none; }
  .ff-kr { display: grid; grid-template-columns: repeat(60, 1fr); gap: 4px; }
  .ff-k { grid-column: span 4; height: clamp(26px, 6.2vw, 44px); display: grid; place-items: center; position: relative; font: 700 clamp(.62rem, 2.6vw, 1.05rem) var(--f-body); color: var(--fg); background: var(--rock-2); border: 2px solid var(--edge); border-radius: 4px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); transition: transform .08s, background .08s; overflow: hidden; }
  .ff-k.sp0 { visibility: hidden; }
  .ff-k.fx { font-size: clamp(.5rem, 1.9vw, .78rem); color: var(--muted); }
  .ff-kb.tint .ff-k[data-f$="p"] { background: color-mix(in srgb, var(--f-p) 26%, var(--rock-2)); }
  .ff-kb.tint .ff-k[data-f$="r"] { background: color-mix(in srgb, var(--f-r) 26%, var(--rock-2)); }
  .ff-kb.tint .ff-k[data-f$="m"] { background: color-mix(in srgb, var(--f-m) 26%, var(--rock-2)); }
  .ff-kb.tint .ff-k[data-f$="i"] { background: color-mix(in srgb, var(--f-i) 26%, var(--rock-2)); }
  .ff-kb.tint .ff-k[data-f$="t"] { background: color-mix(in srgb, var(--f-t) 26%, var(--rock-2)); }
  /* fingerfärg som variabel, används av diamanter och teman */
  .ff-k[data-f$="p"] { --fc: var(--f-p); } .ff-k[data-f$="r"] { --fc: var(--f-r); } .ff-k[data-f$="m"] { --fc: var(--f-m); }
  .ff-k[data-f$="i"] { --fc: var(--f-i); } .ff-k[data-f$="t"] { --fc: var(--f-t); }
  .ff-k .kl { position: relative; z-index: 2; white-space: nowrap; }
  .ff-k::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  /* diamanttangenter: fasetterad diamant i fingrets färg */
  .ff-kb .ff-k.dia, .ff-kb.tint .ff-k.dia { color: var(--edge); border-color: #f4fdff;
    background: linear-gradient(135deg, color-mix(in srgb, var(--fc, #9fe3ff) 45%, #fff) 0%, color-mix(in srgb, var(--fc, #9fe3ff) 80%, #fff) 28%, #ffffff 42%, color-mix(in srgb, var(--fc, #9fe3ff) 60%, #fff) 58%, color-mix(in srgb, var(--fc, #9fe3ff) 90%, #222) 100%);
    box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--fc, #9fe3ff) 70%, #000), 0 0 8px color-mix(in srgb, var(--fc, #9fe3ff) 60%, transparent); }
  .ff-kb .ff-k.dia::before { background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.95) 45%, transparent 60%); background-size: 300% 100%; background-position: 150% 0; animation: ffshine 3.4s ease-in-out infinite; animation-delay: var(--sd, 0s); mix-blend-mode: soft-light; }
  .ff-kb .ff-k.dia .kl { color: var(--edge); }
  @keyframes ffshine { 0%, 60% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
  /* tangentmaterial */
  .ff-kb.skin-guld { background: #1c1405; }
  .ff-kb.skin-guld .ff-k:not(.dia) { border-color: #c9971f; }
  .ff-kb.skin-guld .ff-k:not(.dia)::before { background: linear-gradient(160deg, rgba(255,232,160,.45), rgba(255,209,102,.08) 45%, rgba(110,70,0,.35)); }
  .ff-kb.skin-is { background: #0b1820; }
  .ff-kb.skin-is .ff-k:not(.dia) { border-color: #8fd8f5; }
  .ff-kb.skin-is .ff-k:not(.dia)::before { background: linear-gradient(160deg, rgba(225,248,255,.5), transparent 45%, rgba(110,198,255,.25)); }
  .ff-kb.skin-lava { background: #1d0906; }
  .ff-kb.skin-lava .ff-k:not(.dia) { border-color: #3a0f06; }
  .ff-kb.skin-lava .ff-k:not(.dia)::before { background: radial-gradient(120% 70% at 50% 120%, rgba(255,110,40,.75), rgba(255,60,20,.15) 60%, transparent 75%); animation: fflava 2.6s ease-in-out infinite alternate; animation-delay: var(--sd, 0s); }
  @keyframes fflava { to { opacity: .45; } }
  .ff-kb.skin-neon { background: #06060c; }
  .ff-kb.skin-neon .ff-k:not(.dia) { background: #0b0b16; border-color: var(--fc, var(--f-t)); box-shadow: 0 0 6px color-mix(in srgb, var(--fc, var(--f-t)) 70%, transparent), inset 0 0 6px color-mix(in srgb, var(--fc, var(--f-t)) 40%, transparent); }
  .ff-kb.skin-neon .ff-k:not(.dia) .kl { color: color-mix(in srgb, var(--fc, #fff) 60%, #fff); text-shadow: 0 0 6px var(--fc, #fff); }
  .ff-kb.skin-regnbage .ff-k:not(.dia)::before { background: linear-gradient(120deg, rgba(255,70,70,.32), rgba(255,200,40,.32), rgba(60,210,110,.32), rgba(60,160,255,.32), rgba(190,80,255,.32), rgba(255,70,70,.32)); background-size: 400% 100%; animation: ffrain 6s linear infinite; }
  @keyframes ffrain { to { background-position: 400% 0; } }
  /* ramar */
  .ff-kb.frame-tra { border: 7px solid #7a4a25; background-color: #2a1a0e; box-shadow: inset 0 0 0 2px #a46a3a, 0 0 0 3px var(--edge); }
  .ff-kb.frame-metall { border: 7px solid #8c93a3; box-shadow: inset 0 2px 0 #cfd4de, 0 0 0 3px var(--edge), inset 0 0 0 2px #5d6372; }
  .ff-kb.frame-neon { border: 3px solid var(--f-t); box-shadow: 0 0 10px var(--f-t), 0 0 22px color-mix(in srgb, var(--f-i) 70%, transparent), inset 0 0 10px color-mix(in srgb, var(--f-t) 50%, transparent); }
  .ff-kb.frame-guld { border: 7px solid #d9a52b; box-shadow: inset 0 2px 0 #ffe7a0, 0 0 0 3px var(--edge), 0 0 14px rgba(255,209,102,.35); }
  .ff-kb { position: relative; }
  .ff-spname { font: 700 clamp(.6rem, 2.2vw, .95rem) var(--f-display); color: var(--fg); letter-spacing: .06em; opacity: .9; }
  /* tryckeffekter */
  .ff-pt { position: absolute; pointer-events: none; z-index: 5; font: 700 14px var(--f-body); line-height: 1; animation: ffpt .65s ease-out forwards; }
  @keyframes ffpt { from { transform: translate(-50%, -50%) scale(1); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4) rotate(var(--rot, 0deg)); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ff-kb .ff-k::before { animation: none !important; } .ff-pt { display: none; } }
  .ff-k.bump::after { content: ""; position: absolute; bottom: 18%; left: 35%; right: 35%; height: 2px; background: currentColor; border-radius: 2px; opacity: .8; }
  .ff-kb .ff-k.next { color: var(--edge); transform: translateY(-2px); box-shadow: 0 0 0 3px var(--fg), 0 4px 0 var(--edge); z-index: 1; overflow: visible; }
  .ff-kb .ff-k.next[data-f$="p"] { background: var(--f-p); } .ff-kb .ff-k.next[data-f$="r"] { background: var(--f-r); }
  .ff-kb .ff-k.next[data-f$="m"] { background: var(--f-m); } .ff-kb .ff-k.next[data-f$="i"] { background: var(--f-i); }
  .ff-kb .ff-k.next[data-f$="t"] { background: var(--f-t); }
  .ff-k.wrong { background: var(--bad) !important; color: var(--edge); }
  .ff-k.hit { transform: translateY(2px); }

  /* händer */
  .ff-hands { width: 100%; max-width: 520px; margin: 0 auto; display: block; }
  .ff-hands .fg rect, .ff-hands .fg path { stroke: var(--edge); stroke-width: 3; }
  .ff-hands .palm { fill: var(--rock-3); stroke: var(--edge); stroke-width: 3; }
  .ff-hands .fg { transition: opacity .12s; }
  .ff-hands.focus .fg { opacity: .28; }
  .ff-hands.focus .fg.on { opacity: 1; }
  .ff-hands .fg.on rect { stroke: var(--fg); }
  .ff-hands.pick .fg { cursor: pointer; }
  .ff-hands.pick .fg:hover rect { stroke: var(--fg); }
  .ff-hands .fg.ans-ok rect { stroke: var(--fg) !important; stroke-width: 6; }
  .ff-hands .fg.ans-bad rect { stroke: var(--bad) !important; stroke-width: 6; }
  .ff-kb .ff-k.qk { background: var(--fg); color: var(--edge); transform: translateY(-2px); box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--edge); }
  .ff-hands text { font: 700 13px var(--f-body); fill: var(--muted); text-anchor: middle; }

  .ff-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .9rem; color: var(--muted); }
  .ff-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .ff-dot { width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--edge); display: inline-block; flex: none; }

  /* lektioner */
  .ff-lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .ff-les { text-align: left; font: inherit; color: var(--fg); background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 -4px 0 var(--rock), 0 4px 0 var(--edge); }
  .ff-les:hover { filter: brightness(1.12); }
  .ff-les:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--rock), 0 1px 0 var(--edge); }
  .ff-les.next { border-color: var(--f-i); }
  .ff-les-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .ff-les-n { font: 700 .85rem var(--f-display); color: var(--muted); }
  .ff-les-name { font-weight: 800; line-height: 1.2; }
  .ff-caps { display: flex; flex-wrap: wrap; gap: 4px; }
  .ff-cap { min-width: 26px; height: 26px; padding: 0 5px; display: inline-grid; place-items: center; font: 800 .85rem var(--f-body); color: var(--edge); border: 2px solid var(--edge); border-radius: 4px; }
  .ff-stars { color: var(--gold); letter-spacing: 2px; font-size: 1rem; white-space: nowrap; }
  .ff-stars i { color: var(--rock-3); font-style: normal; }
  .ff-tag { font: 700 .72rem var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--edge); background: var(--f-i); border-radius: 999px; padding: 1px 8px; }

  /* spelvy */
  .ff-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ff-bar h2 { font-size: 1.3rem; }
  .ff-live { display: flex; gap: 14px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ff-live b { color: var(--fg); font-family: var(--f-display); font-size: 1.05rem; }
  .ff-prog { height: 10px; background: var(--well); border: 2px solid var(--edge); border-radius: 3px; overflow: hidden; }
  .ff-prog i { display: block; height: 100%; width: 0; background: var(--f-i); transition: width .15s; }
  .ff-text { font: 800 clamp(1.35rem, 4.6vw, 2rem) var(--f-body); line-height: 1.75; letter-spacing: .03em; background: var(--well); border: 3px solid var(--edge); border-radius: 4px; padding: 14px 18px; min-height: 5.6em; position: relative; word-break: normal; }
  .ff-w { white-space: nowrap; }
  .ff-c { color: var(--muted); border-radius: 3px; padding: 0 1px; }
  .ff-c.done { color: var(--moss); }
  .ff-c.miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 6px; }
  .ff-c.cur { color: var(--edge); background: var(--fg); box-shadow: 0 3px 0 var(--f-i); }
  .ff-c.cur.oops { background: var(--bad); animation: ffshake .25s; }
  @keyframes ffshake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .ff-c.cur.space { display: inline-block; min-width: .6em; }
  .ff-start { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(16,15,22,.93); padding: 14px; font: 700 1.05rem var(--f-body); line-height: 1.5; letter-spacing: 0; }
  .ff-start b { color: var(--gold); }
  .ff-hint { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; min-height: 1.6em; }
  .ff-hint.bad { color: var(--bad); }
  .ff-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .ff-tools label { display: inline-flex; gap: 8px; align-items: center; font-size: .95rem; color: var(--muted); cursor: pointer; }
  .ff-tools input { width: 20px; height: 20px; padding: 0; accent-color: var(--f-i); }
  .ff-blindmsg { text-align: center; color: var(--muted); padding: 10px; }

  /* resultat */
  .ff-res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ff-res div { background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 10px; text-align: center; }
  .ff-res b { display: block; font: 700 1.8rem var(--f-display); color: var(--gold); }
  .ff-res span { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .ff-bigstars { font-size: 2.6rem; letter-spacing: 6px; color: var(--gold); line-height: 1; }
  .ff-bigstars i { color: var(--rock-3); font-style: normal; }
  .ff-acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .ff-weak { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .ff-weak li { display: flex; align-items: center; gap: 10px; }

  /* fingerquiz */
  .ff-qkey { font: 800 3rem var(--f-body); width: 2em; height: 1.6em; display: grid; place-items: center; margin: 0 auto; background: var(--fg); color: var(--edge); border: 3px solid var(--edge); border-radius: 6px; box-shadow: 0 5px 0 var(--edge); }
  .ff-qkey.wide { width: 5em; font-size: 1.6rem; height: 2.6em; }
  .ff-center { text-align: center; }
  .ff-notice { border-color: var(--gold); }
  /* konto, diamanter, verkstad, topplista */
  .ff-acct { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .ff-acct form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; width: 100%; }
  .ff-acct .fld { flex: 1 1 140px; }
  .ff-acct .check { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
  .ff-gems { display: inline-flex; align-items: center; gap: 6px; font: 700 1.15rem var(--f-display); color: #bfefff; white-space: nowrap; }
  .ff-gems svg { flex: none; }
  .ff-cats { display: flex; flex-direction: column; gap: 18px; }
  .ff-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .ff-item { background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ff-item.on { border-color: var(--f-i); }
  .ff-item h3 { font-family: var(--f-body); font-weight: 800; font-size: 1.05rem; }
  .ff-item p { font-size: .9rem; color: var(--muted); }
  .ff-item .btn { align-self: flex-start; margin-top: auto; font-size: .95rem; padding: 7px 12px; }
  .ff-item .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .ff-sw { height: 34px; border: 3px solid var(--edge); border-radius: 4px; }
  .ff-earn { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; font-weight: 800; }
  .ff-earn .ff-gems { font-size: 1.3rem; }
  .ff-lock { color: var(--muted); font-size: .85rem; }

</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="assertive"></div>
<noscript><p style="padding:16px">Sidan behöver JavaScript.</p></noscript>
<script src="../konto/config.js"></script>
<script src="../konto/konto.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];

  /* ---------- fingrar ---------- */
  // id: hand (l/r) + finger (p lill, r ring, m lång, i pek, t tumme)
  const FINGERS = {
    lp: 'vänster lillfinger', lr: 'vänster ringfinger', lm: 'vänster långfinger', li: 'vänster pekfinger', lt: 'vänster tumme',
    rt: 'höger tumme', ri: 'höger pekfinger', rm: 'höger långfinger', rr: 'höger ringfinger', rp: 'höger lillfinger'
  };
  const COLOR = { p: 'var(--f-p)', r: 'var(--f-r)', m: 'var(--f-m)', i: 'var(--f-i)', t: 'var(--f-t)' };
  const GROUPS = {
    lp: '§1qa<z', lr: '2wsx', lm: '3edc', li: '45rtfgvb',
    ri: '67yuhjnm', rm: '8ik,', rr: '9ol.', rp: "0+´på¨öä'-", rt: ' '
  };
  const FINGER_OF = {};
  Object.entries(GROUPS).forEach(([f, keys]) => [...keys].forEach((k) => { FINGER_OF[k] = f; }));
  const fingerOf = (ch) => FINGER_OF[ch.toLowerCase()];
  const isUpper = (ch) => ch !== ch.toLowerCase();

  /* ---------- tangentbord (svensk layout) ---------- */
  const SPECIAL = { bs: ['⌫', 8, 'rp'], tab: ['Tab', 6, 'lp'], ent: ['Enter', 6, 'rp'], caps: ['Caps', 7, 'lp'], ent2: ['', 5, 'rp'], shl: ['Skift', 5, 'lp'], shr: ['Skift', 11, 'rp'], gap: ['', 16, ''], space: ['', 28, 'rt'] };
  const LAYOUT = [
    [...'§1234567890+´', 'bs'],
    ['tab', ...'qwertyuiopå¨', 'ent'],
    ['caps', ...'asdfghjklöä\'', 'ent2'],
    ['shl', ...'<zxcvbnm,.-', 'shr'],
    ['gap', 'space', 'gap']
  ];
  // look: { skin, frame, diaKeys:Set, name } – det inloggade kontots tangentbord
  function keyboardHTML(tint, look) {
    const L = look || {};
    const dk = L.diaKeys || new Set();
    const cls = ['ff-kb', tint ? 'tint' : '', L.skin ? 'skin-' + L.skin : '', L.frame ? 'frame-' + L.frame : ''].filter(Boolean).join(' ');
    let n = 0;
    const sd = () => `--sd:${((n++ * 0.37) % 3.4).toFixed(2)}s`;
    return `<div class="${cls}" id="kb" aria-hidden="true">${LAYOUT.map((row) => `<div class="ff-kr">${row.map((k) => {
      if (SPECIAL[k]) {
        const [label, span, f] = SPECIAL[k];
        const dia = k !== 'gap' && (dk.has('*') || dk.has(k));
        const lab = k === 'space' && L.name ? `<span class="kl ff-spname">${esc(L.name)}</span>` : `<span class="kl">${label}</span>`;
        return `<div class="ff-k fx${k === 'gap' ? ' sp0' : ''}${dia ? ' dia' : ''}" data-k="${k}" data-f="${f}" style="grid-column: span ${span};${sd()}">${lab}</div>`;
      }
      const dia = dk.has('*') || dk.has(k);
      return `<div class="ff-k${k === 'f' || k === 'j' ? ' bump' : ''}${dia ? ' dia' : ''}" data-k="${esc(k)}" data-f="${FINGER_OF[k]}" style="${sd()}"><span class="kl">${esc(k.toUpperCase())}</span></div>`;
    }).join('')}</div>`).join('')}</div>`;
  }
  const keyEl = (k) => document.querySelector(`#kb [data-k="${CSS.escape(k)}"]`);

  /* ---------- händer (SVG) ---------- */
  function handsHTML(opts) {
    // vänster hand: lill, ring, lång, pek + tumme; höger hand speglas
    const L = [['lp', 20, 40], ['lr', 52, 26], ['lm', 84, 18], ['li', 116, 26]];
    const W = 28, BASE = 78;
    const fingerRect = (id, x, top) => `<g class="fg" data-f="${id}"><rect x="${x}" y="${top}" width="${W}" height="${BASE - top + 6}" rx="9" fill="${COLOR[id[1]]}"/></g>`;
    const mirror = (x, w) => 420 - x - w;

  /* ---------- spela ---------- */
  let P = null;
  function stopPlay() { P = null; }

  function startLesson(li) {
    view = 'play';

    P = { li, text: makeText(li), pos: 0, errors: 0, missAt: new Set(), keyErr: {}, t0: 0, started: false, done: false };
    $('app').innerHTML = `${head()}
<section class="panel">

  <div class="ff-prog"><i id="prog"></i></div>
  <div class="ff-text" id="text">${textHTML(P.text)}

    $('blind').addEventListener('change', (e) => {
      save.blind = e.target.checked; store();
      $('kbwrap').innerHTML = save.blind ? '<p class="ff-blindmsg">Tangentbordet är dolt. Lita på fingrarna!</p>' : keyboardHTML(true, look()) + handsHTML({ focus: true });
      e.target.blur(); paint();
    });
    paint();
  }

  function textHTML(t) {
    let i = 0;
    return t.split(' ').map((w, wi, arr) => {
      const chars = [...w].map((c) => `<span class="ff-c" id="c${i++}">${esc(c)}</span>`).join('');
      const sp = wi < arr.length - 1 ? `<span class="ff-c" id="c${i++}">&nbsp;</span>` : '';
      return `<span class="ff-w">${chars}${sp}</span>`;
    }).join('<wbr>');
  }

  function needFor(ch) {
    const f = fingerOf(ch);
    if (ch === ' ') return { keys: ['space'], fingers: ['lt', 'rt'], text: 'Mellanslag: <b>tummen</b>' };
    if (isUpper(ch)) {
      const left = f[0] === 'l';
      return { keys: [ch.toLowerCase(), left ? 'shr' : 'shl'], fingers: [f, left ? 'rp' : 'lp'],
        text: `${esc(ch)}: håll in <b>${left ? 'höger' : 'vänster'} Skift</b> med lillfingret och tryck med <b>${FINGERS[f]}</b>` };
    }
    return { keys: [ch], fingers: [f], text: `${esc(ch.toUpperCase())}: <b>${FINGERS[f]}</b>` };
  }

  function paint(bad) {
    if (!P) return;
    const ch = P.text[P.pos];
    document.querySelectorAll('.ff-c.cur').forEach((e) => e.classList.remove('cur', 'oops', 'space'));
    const cur = $('c' + P.pos);
    if (cur) { cur.classList.add('cur'); if (ch === ' ') cur.classList.add('space'); if (bad) { void cur.offsetWidth; cur.classList.add('oops'); } }
    $('prog').style.width = (100 * P.pos / P.text.length) + '%';
    document.querySelectorAll('#kb .next').forEach((e) => e.classList.remove('next'));
    if (ch === undefined) return;
    const need = needFor(ch);
    need.keys.forEach((k) => { const e = keyEl(k); if (e) e.classList.add('next'); });
    if ($('hands')) lightFingers(need.fingers);
    const finger = fingerOf(ch);
    $('hint').className = 'ff-hint' + (bad ? ' bad' : '');
    $('hint').innerHTML = `<i class="ff-dot" style="background:${COLOR[finger[1]]}"></i><span>${bad ? 'Hoppsan! ' : ''}${need.text}</span>`;
  }

  function flashKey(k, cls) {
    const e = keyEl(k); if (!e) return;
    e.classList.add(cls); setTimeout(() => e.classList.remove(cls), cls === 'wrong' ? 320 : 110);
  }

  function liveStats() {
    const typed = P.pos + P.errors;
    $('lAcc').textContent = typed ? Math.round(100 * P.pos / typed) + '%' : '–';
    const min = (performance.now() - P.t0) / 60000;
    $('lCpm').textContent = P.t0 && min > 0.05 ? Math.round(P.pos / min) : '–';
  }

  function onPlayKey(e) {
    if (e.key === ' ' || e.key === 'Spacebar') e.preventDefault();
    if (!P.started) {
      if (e.key === ' ') { P.started = true; const s = $('start'); if (s) s.remove(); }
      return;
    }
    if (P.done || e.key.length !== 1) return;
    if (e.getModifierState && e.getModifierState('CapsLock') && /\p{L}/u.test(e.key)) toast('<b>Caps Lock</b> är på. Stäng av den och använd Skift i stället.');
    if (!P.t0) P.t0 = performance.now();
    const want = P.text[P.pos];
    const pressed = e.key === ' ' ? 'space' : e.key.toLowerCase();
    if (e.key === want) {
      flashKey(pressed, 'hit'); burst(pressed);
      const c = $('c' + P.pos); c.classList.add(P.missAt.has(P.pos) ? 'miss' : 'done');
      P.pos++;
      if (P.pos >= P.text.length) return finish();
      paint();
    } else {
      P.errors++; P.missAt.add(P.pos);
      P.keyErr[want] = (P.keyErr[want] || 0) + 1;
      flashKey(pressed, 'wrong');
      paint(true);
    }
    liveStats();
  }

  function finish() {
    P.done = true;
    const ms = performance.now() - P.t0;
    const acc = Math.round(100 * P.text.length / (P.text.length + P.errors));
    const cpm = Math.round(P.text.length / (ms / 60000));
    const stars = acc >= 98 ? 3 : acc >= 93 ? 2 : acc >= 85 ? 1 : 0;
    const prev = save.les[P.li] || { stars: 0, cpm: 0, acc: 0 };
    const rec = cpm > prev.cpm && stars > 0;
    save.les[P.li] = { stars: Math.max(prev.stars, stars), cpm: stars ? Math.max(prev.cpm, cpm) : prev.cpm, acc: Math.max(prev.acc, acc) };
    // belöning (bara inloggad): en diamant per stjärna, 5 extra per ny stjärna på lektionen
    const newStars = Math.max(0, stars - prev.stars);
    const gemsWon = sess ? stars + 5 * newStars : 0;
    const pts = sess ? Math.round(P.text.length * (0.25 + 0.25 * stars)) : 0;
    save.dia += gemsWon;
    store(pts, stars >= 2 && cpm <= 1200 ? cpm : 0); // över 1200 tecken/min är inte rimligt för ett barn
    const weak = Object.entries(P.keyErr).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const li = P.li;
    view = 'result';
    const msg = stars === 3 ? 'Perfekt fingerföring!' : stars === 2 ? 'Riktigt bra!' : stars === 1 ? 'Klarat! Öva igen för fler stjärnor.' : 'Nästan! Ta det lite lugnare och försök igen.';
    $('app').innerHTML = `${head()}
<section class="panel ff-center">
  <p class="eyebrow">${li + 1}. ${esc(LESSONS[li].n)}</p>
  <div class="ff-bigstars">${starStr(stars)}</div>
  <h2>${msg}</h2>
  <div class="ff-res">
    <div><b>${acc}%</b><span>Rätt</span></div>
    <div><b>${cpm}</b><span>Tecken/min</span></div>
    <div><b>${P.errors}</b><span>Fel</span></div>
  </div>
  ${sess ? `<div class="ff-earn"><span>+${pts} poäng</span>${gemsWon ? `<span>+${gems(gemsWon)}${newStars ? ` <span class="small muted">(varav ${5 * newStars} för ${newStars === 1 ? 'ny stjärna' : 'nya stjärnor'})</span>` : ''}</span>` : ''}</div>` : (K ? '<p class="muted small">Logga in för att få poäng på topplistan och diamanter till ditt tangentbord.</p>' : '')}
  ${rec && prev.cpm ? '<p><b>Nytt fartrekord</b> på den här lektionen!</p>' : ''}
  ${weak.length ? `<div style="text-align:left"><h3>Öva lite extra på</h3><ul class="ff-weak">${weak.map(([k, n]) => `<li><span class="ff-cap" style="background:${COLOR[fingerOf(k)[1]]}">${k === ' ' ? '␣' : esc(k.toUpperCase())}</span> ${k === ' ' ? 'mellanslag med tummen' : FINGERS[fingerOf(k)]} <span class="muted small">(${n} fel)</span></li>`).join('')}</ul></div>` : ''}
  <div class="ff-acts" style="justify-content:center">
    <button class="btn" data-a="again">Igen</button>
    ${stars && li < LESSONS.length - 1 ? `<button class="btn" data-a="next">Nästa lektion</button>` : ''}
    <button class="btn ghost" data-a="home">Alla lektioner</button>
    ${sess ? '<button class="btn ghost" data-a="shop">Tangentverkstan</button>' : ''}
  </div>
  <p class="muted small">Tryck <b>Enter</b> för att köra igen.</p>
</section>`;
    P = { li, done: true };
  }

  /* ---------- quiz: vilket finger? ---------- */
  let Q = null;
  const QKEYS = [...'abcdefghijklmnopqrstuvwxyzåäö,. '];
  function startQuiz() {
    view = 'quiz';

    else if (a === 'restart') startLesson(P.li);
    else if (a === 'again') startLesson(P.li);
    else if (a === 'next') startLesson(P.li + 1);
    else if (a === 'reset') {
      if (b.dataset.sure) { save = norm({ blind: save.blind }); store(); showHome(); toast('Allt är nollställt.'); }

  document.addEventListener('keydown', (e) => {

      if (e.key.length === 1 || e.key === ' ') { e.preventDefault(); onPlayKey(e); }
    } else if (view === 'result' && e.key === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')) {

  showHome();
  (async () => {
    if (!K || !K.session()) return;
    const s = await K.info();
    await useAccount(s);
    if (view === 'home') showHome();
  })();
  window.addEventListener('pagehide', () => { if (sess && saveT) { clearTimeout(saveT); store(0, 0, true); } });
})();
</script>
<script src="/statistik.js"></script>
</body>
