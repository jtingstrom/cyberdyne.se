/* Samma grottstil som Kristallgruvan: mörk sten, pixeltypsnitt, block med kant och skugga. */
:root {
  color-scheme: dark;
  --bg: #15131c; --rock: #221f2c; --rock-2: #2b2738; --rock-3: #3a3449; --edge: #0b0a10; --well: #100f16;
  --fg: #f1ecf8; --muted: #aaa2bf;
  --moss: #7ccf5a; --moss-d: #3f8a2a; --moss-ink: #10200a;
  --gold: #ffd166; --gold-d: #c9971f; --gold-ink: #2a1f04;
  --miss: #4a4358; --miss-d: #332e3e;
  --amethyst: #b58cff;
  --good: var(--moss); --close: var(--gold);
  --f-display: "KG Siffror", "Pixelify Sans", "Courier New", monospace;
  --f-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px;
  background-image: radial-gradient(var(--rock) 1.2px, transparent 1.6px), radial-gradient(var(--rock-2) 1px, transparent 1.4px);
  background-size: 28px 28px, 44px 44px; background-position: 0 0, 13px 19px;
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
@media (min-width: 360px) { body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.app { flex: 1; display: flex; flex-direction: column; max-width: 540px; width: 100%; margin: 0 auto; min-height: 0; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 14px 12px; border-bottom: 3px solid var(--rock-2); }
.hl { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.5rem, 6.5vw, 2rem); margin: 0; line-height: 1; letter-spacing: .01em; }
h1 span { color: var(--gold); }
.hbtns { display: flex; gap: 6px; }
.hbtn {
  font: 700 .95rem var(--f-display); color: var(--fg); background: var(--rock-3);
  border: 3px solid var(--edge); border-radius: 4px; padding: 6px 10px; cursor: pointer;
  box-shadow: inset 0 -3px 0 var(--rock-2), 0 3px 0 var(--edge); text-decoration: none; line-height: 1.2;
}
.hbtn:hover { filter: brightness(1.12); }
.hbtn:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--rock-2), 0 1px 0 var(--edge); }
.hbtn.hard { background: #c9524a; box-shadow: inset 0 -3px 0 #8f3530, 0 3px 0 var(--edge); }
.home { display: grid; place-items: center; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding-block: 12px; }
.board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; width: min(100%, 440px); }
.row { display: grid; grid-template-columns: repeat(var(--cols, 8), 1fr); gap: 5px; }
.board.wide { width: min(100%, 500px); }
.board.wide .tile { font-size: clamp(.95rem, 4.6vw, 1.5rem); }
.tile {
  aspect-ratio: 1; max-width: 100%; display: grid; place-items: center;
  font: 700 clamp(1.05rem, 5.4vw, 1.65rem) var(--f-display); border-radius: 4px;
  background: var(--well); border: 3px solid var(--edge); color: var(--fg);
  box-shadow: inset 0 3px 0 rgba(0,0,0,.35);
}
.tile.filled { background: var(--well); border-color: var(--amethyst); box-shadow: none; }
.tile.good, .tile.close, .tile.miss { border-color: var(--edge); }
.tile.good  { background: var(--good);  color: var(--moss-ink); box-shadow: inset 0 -4px 0 var(--moss-d); }
.tile.close { background: var(--close); color: var(--gold-ink); box-shadow: inset 0 -4px 0 var(--gold-d); }
.tile.miss  { background: var(--miss);  color: var(--fg);       box-shadow: inset 0 -4px 0 var(--miss-d); }
.tile.flip { animation: flip .4s ease both; }
@keyframes flip { 0% { transform: rotateX(0) } 50% { transform: rotateX(90deg) } 100% { transform: rotateX(0) } }
.row.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }
@media (prefers-reduced-motion: reduce) { .tile.flip, .row.shake { animation: none; } }

.keys { display: flex; flex-direction: column; gap: 8px; padding-block: 8px max(14px, env(safe-area-inset-bottom, 0px)); }
.krow { display: grid; gap: 5px; }
.krow.digits { grid-template-columns: repeat(10, 1fr); }
.krow.ops { grid-template-columns: repeat(5, 1fr) 1.6fr 1.6fr; }
.key {
  height: 52px; border: 3px solid var(--edge); border-radius: 4px; background: var(--rock-3); color: var(--fg);
  font: 700 1.2rem var(--f-display); cursor: pointer; touch-action: manipulation; padding: 0;
  box-shadow: inset 0 -4px 0 var(--rock-2), 0 3px 0 var(--edge);
}
.key:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 var(--rock-2), 0 1px 0 var(--edge); }
.key.wide { font: 700 .8rem var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.key.enter { background: var(--moss); color: var(--moss-ink); box-shadow: inset 0 -4px 0 var(--moss-d), 0 3px 0 var(--edge); }
.key.good  { background: var(--good);  color: var(--moss-ink); box-shadow: inset 0 -4px 0 var(--moss-d), 0 3px 0 var(--edge); }
.key.close { background: var(--close); color: var(--gold-ink); box-shadow: inset 0 -4px 0 var(--gold-d), 0 3px 0 var(--edge); }
.key.miss  { background: var(--well);  color: #6b6380; box-shadow: none; }

.toast {
  position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--rock-2); color: var(--fg); border: 3px solid var(--edge); border-radius: 4px; box-shadow: 0 5px 0 var(--edge);
  padding: 12px 18px; font-weight: 800; font-size: 1.05rem; max-width: calc(100% - 32px); text-align: center; z-index: 20;
}
.overlay { position: fixed; inset: 0; background: rgba(8,7,12,.78); display: grid; place-items: center; z-index: 30;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal {
  background: var(--rock); border: 3px solid var(--edge); border-radius: 4px; box-shadow: inset 0 3px 0 var(--rock-3), 0 6px 0 var(--edge);
  padding: 22px; max-width: 500px; width: 100%; max-height: 100%; overflow-y: auto; line-height: 1.55; font-size: 17px;
}
.modal h2 { font-family: var(--f-display); margin: 0 0 12px; font-size: 1.5rem; line-height: 1.15; text-wrap: balance; }
.modal p { margin: 0 0 12px; }
.modal ul { margin: 0 0 16px; padding-left: 22px; color: #cfc4dd; }
.modal li { margin-bottom: 4px; }
.modal li::marker { color: var(--gold); }
.legend { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.legend div { display: flex; align-items: center; gap: 10px; }
.sw { width: 36px; height: 36px; border-radius: 4px; border: 3px solid var(--edge); flex: none; display: grid; place-items: center; font: 700 1.15rem var(--f-display); }
.sw.good { background: var(--good); color: var(--moss-ink); box-shadow: inset 0 -3px 0 var(--moss-d); }
.sw.close { background: var(--close); color: var(--gold-ink); box-shadow: inset 0 -3px 0 var(--gold-d); }
.sw.miss { background: var(--miss); box-shadow: inset 0 -3px 0 var(--miss-d); }
.answer { font: 700 1.7rem var(--f-display); letter-spacing: .08em; margin: 6px 0 14px; color: var(--gold); }
.mbtns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.mbtn {
  flex: 1; padding: 12px 16px; font: 700 1.15rem var(--f-display); color: var(--moss-ink); background: var(--moss);
  border: 3px solid var(--edge); border-radius: 4px; box-shadow: inset 0 -4px 0 var(--moss-d), 0 4px 0 var(--edge); cursor: pointer;
}
.mbtn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--moss-d), 0 1px 0 var(--edge); }
.mbtn.ghost { background: var(--rock-3); color: var(--fg); box-shadow: inset 0 -4px 0 var(--rock-2), 0 4px 0 var(--edge); }
.stats { display: flex; gap: 10px; margin: 4px 0 16px; font-variant-numeric: tabular-nums; }
.stats div { flex: 1; background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 8px 10px; text-align: center; }
.stats b { display: block; font: 700 1.6rem var(--f-display); color: var(--gold); }
.stats span { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
</style>

<body>

<div class="app">
  <header>
    <div class="hl"><a class="hbtn home" href="../" aria-label="Till alla spel">←</a><h1>Nörd<span>lig</span></h1></div>
    <div class="hbtns">
      <button class="hbtn" id="helpBtn" aria-label="Så här spelar du">?</button>
      <button class="hbtn" id="levelBtn" aria-label="Byt svårighetsgrad">Normal</button>
      <button class="hbtn" id="newBtn">Nytt</button>
    </div>
  </header>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="keys" id="keys">
    <div class="krow digits"></div>
    <div class="krow ops"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script>
const ROWS = 6, OPS = ['+','−','×','÷'];
const LEVELS = {
  normal: { len: 8,  ops: [1, 2],    max: [99, 30] },
  svar:   { len: 10, ops: [2, 3],    max: [99, 40] }
};
let level = 'normal';
try { if (LEVELS[localStorage.getItem('nordlig-level')]) level = localStorage.getItem('nordlig-level'); } catch (e) {}
let LEN = LEVELS[level].len;
let answer, guesses, cur, over, keyState, stats;
function loadStats() {
  stats = { played: 0, won: 0, streak: 0 };
  try { stats = JSON.parse(localStorage.getItem('nordlig-stats-' + level)) || stats; } catch (e) {}
}
const saveStats = () => { try { localStorage.setItem('nordlig-stats-' + level, JSON.stringify(stats)); } catch (e) {} };
loadStats();

/* ---------- equation logic ---------- */
function evaluate(expr) {
  // tokenize: numbers & ops; returns number or null if invalid
  const toks = expr.match(/\d+|[+−×÷]/g);
  if (!toks || toks.join('') !== expr) return null;
  for (let i = 0; i < toks.length; i++) {
    const isNum = /^\d+$/.test(toks[i]);
    if ((i % 2 === 0) !== isNum) return null;           // must alternate num/op, start with num
    if (isNum && toks[i].length > 1 && toks[i][0] === '0') return null; // no leading zeros
  }
  if (toks.length % 2 === 0) return null;                // must end with a number
  // × and ÷ first
  const st = [Number(toks[0])];
  const ops = [];
  for (let i = 1; i < toks.length; i += 2) {
    const op = toks[i], n = Number(toks[i + 1]);
    if (op === '×') st[st.length - 1] *= n;
    else if (op === '÷') { if (n === 0) return null; st[st.length - 1] /= n; }
    else { ops.push(op); st.push(n); }
  }
  let r = st[0];
  ops.forEach((op, i) => { r = op === '+' ? r + st[i + 1] : r - st[i + 1]; });
  return r;
}

function checkGuess(g) {
  if (g.length !== LEN) return 'Fyll i alla ' + LEN + ' brickor.';
  const parts = g.split('=');
  if (parts.length !== 2) return 'Uträkningen måste innehålla exakt ett "=".';
  const [left, right] = parts;
  if (!/^\d+$/.test(right)) return 'Efter "=" får det bara stå siffror.';
  if (right.length > 1 && right[0] === '0') return 'Svaret får inte börja med 0.';
  const v = evaluate(left);
  if (v === null) return 'Vänsterledet är inte en giltig uträkning.';
  if (Math.abs(v - Number(right)) > 1e-9) return 'Det räknar inte rätt: vänster blir ' + (Number.isInteger(v) ? v : v.toFixed(2)) + '.';
  return null;
}

function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function makeAnswer() {
  const L = LEVELS[level];
  for (let tries = 0; tries < 200000; tries++) {
    const oi = Math.random() < 0.5 ? 0 : 1;
    const nOps = L.ops[oi];
    const nums = [], ops = [];
    for (let i = 0; i <= nOps; i++) nums.push(rnd(1, L.max[oi]));
    for (let i = 0; i < nOps; i++) ops.push(OPS[rnd(0, 3)]);
    if (level === 'svar' && !ops.some(o => o === '×' || o === '÷')) continue; // svår: alltid minst ett × eller ÷
    // keep every division exact for nicer puzzles
    let ok = true, term = nums[0];
    for (let i = 0; i < nOps; i++) {
      const n = nums[i + 1];
      if (ops[i] === '×') term *= n;
      else if (ops[i] === '÷') { if (n === 1 || term % n !== 0) { ok = false; break; } term /= n; }
      else term = n;
    }
    if (!ok) continue;
    let expr = String(nums[0]);
    for (let i = 0; i < nOps; i++) expr += ops[i] + nums[i + 1];
    const v = evaluate(expr);
    if (v === null || v < 0 || !Number.isInteger(v)) continue;
    const eq = expr + '=' + v;
    if (eq.length === LEN && !checkGuess(eq)) return eq;
  }
  return level === 'svar' ? '12×6−18=54' : '9×20=180';
}

function score(g) {
  const res = Array(LEN).fill('miss'), left = {};
  for (let i = 0; i < LEN; i++) if (g[i] === answer[i]) res[i] = 'good'; else left[answer[i]] = (left[answer[i]] || 0) + 1;
  for (let i = 0; i < LEN; i++) if (res[i] !== 'good' && left[g[i]] > 0) { res[i] = 'close'; left[g[i]]--; }
  return res;
}

/* ---------- UI ---------- */
const board = document.getElementById('board');
function buildBoard() {
  board.innerHTML = '';
  board.style.setProperty('--cols', LEN);
  board.classList.toggle('wide', LEN > 8);
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div'); row.className = 'row';
    for (let c = 0; c < LEN; c++) { const t = document.createElement('div'); t.className = 'tile'; row.appendChild(t); }
    board.appendChild(row);
  }
}
function renderRow(r, text, res) {
  const tiles = board.children[r].children;
  for (let c = 0; c < LEN; c++) {
    const t = tiles[c]; t.textContent = text[c] || '';
    t.className = 'tile' + (text[c] ? ' filled' : '');
    if (res) { t.style.animationDelay = (c * 70) + 'ms'; t.classList.add('flip', res[c]); }
  }
}

const KEYS = {};
function buildKeys() {
  const d = document.querySelector('.digits'), o = document.querySelector('.ops');
  '1234567890'.split('').forEach(k => d.appendChild(mkKey(k)));
  [...OPS, '='].forEach(k => o.appendChild(mkKey(k)));
  o.appendChild(mkKey('⌫', 'Radera', 'wide'));
  o.appendChild(mkKey('↵', 'Gissa', 'wide enter'));
}
function mkKey(k, label, cls) {
  const b = document.createElement('button');
  b.className = 'key ' + (cls || ''); b.textContent = label || k; b.dataset.k = k;
  if (label) b.setAttribute('aria-label', label);
  b.addEventListener('click', () => press(k));
  if (!label) KEYS[k] = b;
  return b;
}
function paintKeys() {
  const rank = { miss: 1, close: 2, good: 3 };
  Object.entries(KEYS).forEach(([k, b]) => { b.className = 'key ' + (keyState[k] || ''); });
}

let toastT;
function toast(msg, ms = 1800) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms);
}

function press(k) {
  if (over) return;
  if (k === '⌫') cur = cur.slice(0, -1);
  else if (k === '↵') return submit();
  else if (cur.length < LEN) cur += k;
  renderRow(guesses.length, cur);
}

function submit() {
  const err = checkGuess(cur);
  if (err) {
    toast(err);
    const row = board.children[guesses.length];
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    return;
  }
  const res = score(cur);
  renderRow(guesses.length, cur, res);
  const rank = { miss: 1, close: 2, good: 3 };
  for (let i = 0; i < LEN; i++) if (!keyState[cur[i]] || rank[res[i]] > rank[keyState[cur[i]]]) keyState[cur[i]] = res[i];
  guesses.push(cur);
  const won = cur === answer;
  cur = '';
  setTimeout(paintKeys, LEN * 70 + 300);
  if (won || guesses.length === ROWS) {
    over = true;
    stats.played++;
    if (won) { stats.won++; stats.streak++; } else stats.streak = 0;
    saveStats();
    setTimeout(() => endModal(won), LEN * 70 + 700);
  }
}

function openModal(html) { document.getElementById('modal').innerHTML = html; document.getElementById('overlay').hidden = false; }
function closeModal() { document.getElementById('overlay').hidden = true; }
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });

function endModal(won) {
  const pct = stats.played ? Math.round(100 * stats.won / stats.played) : 0;
  openModal(`
    <h2>${won ? 'Rätt på ' + guesses.length + (guesses.length === 1 ? ' försök!' : ' försök!') : 'Slut på försök'}</h2>
    <p>${won ? 'Snyggt räknat.' : 'Rätt uträkning var:'}</p>
    ${won ? '' : `<div class="answer">${answer}</div>`}
    <div class="stats">
      <div><b>${stats.played}</b><span>Spelade</span></div>
      <div><b>${pct}%</b><span>Vunna</span></div>
      <div><b>${stats.streak}</b><span>Svit</span></div>
    </div>
    <div class="mbtns"><button class="mbtn" id="againBtn">Nytt spel</button><button class="mbtn ghost" id="closeBtn">Stäng</button></div>`);
  document.getElementById('againBtn').onclick = () => { closeModal(); newGame(); };
  document.getElementById('closeBtn').onclick = closeModal;
}

function helpModal() {
  openModal(`
    <h2>Så här spelar du Nördlig</h2>
    <p>Gissa den dolda uträkningen på sex försök. Varje gissning måste vara en korrekt uträkning med ${LEN} tecken, till exempel <b>${level === 'svar' ? '12×6−18=54' : '9×20=180'}</b>.</p>
    <p><b>Normal:</b> 8 tecken. <b>Svår:</b> 10 tecken, 2–3 räknesätt och alltid minst ett × eller ÷. Byt nivå med knappen uppe till höger.</p>
    <div class="legend">
      <div><span class="sw good">9</span> Rätt tecken på rätt plats.</div>
      <div><span class="sw close">2</span> Finns med, men på fel plats.</div>
      <div><span class="sw miss">8</span> Finns inte med alls.</div>
    </div>
    <ul>
      <li>Du kan använda 0–9, + − × ÷ och =.</li>
      <li>Efter "=" får det bara stå siffror.</li>
      <li>× och ÷ räknas före + och −: 3+2×5=13, inte 25.</li>
      <li>Du kan också skriva på tangentbordet: * för ×, / för ÷.</li>
    </ul>
    <div class="mbtns"><button class="mbtn" id="closeBtn">Spela</button></div>`);
  document.getElementById('closeBtn').onclick = closeModal;
}

function newGame() {
  if (guesses && guesses.length && !over) { stats.played++; stats.streak = 0; saveStats(); }
  LEN = LEVELS[level].len;
  const lb = document.getElementById('levelBtn');
  lb.textContent = level === 'svar' ? 'Svår' : 'Normal'; lb.classList.toggle('hard', level === 'svar');
  answer = makeAnswer(); guesses = []; cur = ''; over = false; keyState = {};
  buildBoard(); paintKeys();
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!document.getElementById('overlay').hidden) { if (e.key === 'Escape' || e.key === 'Enter') closeModal(); return; }
  const map = { '*': '×', 'x': '×', '/': '÷', '-': '−', 'Enter': '↵', 'Backspace': '⌫' };
  const k = map[e.key] || e.key;
  if (/^[0-9+=×÷−↵⌫]$/.test(k)) { e.preventDefault(); press(k); }
});
document.getElementById('newBtn').onclick = () => newGame();
document.getElementById('levelBtn').onclick = () => {
  if (guesses && guesses.length && !over) { stats.played++; stats.streak = 0; saveStats(); guesses = []; }
  level = level === 'svar' ? 'normal' : 'svar';
  try { localStorage.setItem('nordlig-level', level); } catch (e) {}
  loadStats(); newGame();
  toast(level === 'svar' ? 'Svår nivå: 10 tecken' : 'Normal nivå: 8 tecken', 1400);
};
document.getElementById('helpBtn').onclick = helpModal;

buildKeys();
newGame();
let seen = false; try { seen = localStorage.getItem('nordlig-seen'); localStorage.setItem('nordlig-seen', '1'); } catch (e) {}
if (!seen) helpModal();
</script>
