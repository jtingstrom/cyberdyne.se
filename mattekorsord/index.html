<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mattekorsord</title>
<meta name="robots" content="noindex">
<meta name="description" content="Ett korsord där ledtrådarna är uträkningar och svaren är tal. För mellanstadiet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 7' shape-rendering='crispEdges'%3E%3Cpath fill='%230b0a10' d='M2 0h4v1h1v1h1v2H7v1H6v1H5v1H3V6H2V5H1V4H0V2h1V1h1z'/%3E%3Cpath fill='%237ccf5a' d='M2 1h4v1h1v2H6v1H5v1H3V5H2V4H1V2h1z'/%3E%3Cpath fill='%23fff' d='M2 1h1v1H2zM1 2h1v1H1z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../stil.css">
<style>
  /* Mattekorsord: egna delar har prefix mk- så inget krockar med stil.css */
  #app { max-width: 820px; }
  .mk-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .mk-head h1 { font-size: clamp(2rem, 7vw, 2.8rem); }
  .mk-head h1 span { color: var(--moss); }
  .mk-head .btn { font-size: .95rem; padding: 7px 12px; }
  .mk-headbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .mk-coins { display: inline-flex; align-items: center; gap: 6px; font: 700 1.15rem var(--f-display); color: var(--gold); white-space: nowrap; }
  .mk-coins svg { flex: none; }

  /* nivåval */
  .mk-levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .mk-lv { text-align: left; font: inherit; color: var(--fg); background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 -4px 0 var(--rock), 0 4px 0 var(--edge); }
  .mk-lv:hover { filter: brightness(1.12); }
  .mk-lv:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--rock), 0 1px 0 var(--edge); }
  .mk-lv h3 { font-family: var(--f-display); font-size: 1.4rem; }
  .mk-lv p { color: var(--muted); font-size: .95rem; }
  .mk-lv .mk-mini { font: 700 .95rem var(--f-display); color: var(--moss); letter-spacing: .04em; }
  .mk-lv .small { margin-top: auto; }
  .mk-daily { display: flex; flex-wrap: wrap; gap: 10px; }
  .mk-daily .btn { font-size: 1rem; }
  .mk-done { color: var(--moss); font-weight: 800; }

  /* spelplan */
  .mk-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mk-bar h2 { font-size: 1.3rem; }
  .mk-live { display: flex; gap: 14px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .mk-live b { color: var(--fg); font-family: var(--f-display); font-size: 1.05rem; }
  .mk-wrap { display: grid; place-items: center; }
  /* korsordet */
  .kx-board { --cs: min(54px, calc((100vw - 104px - (var(--S) - 1) * 3px) / var(--S))); position: relative; display: grid; grid-template-columns: repeat(var(--S), var(--cs)); grid-auto-rows: var(--cs); gap: 3px; padding: 8px; background: var(--edge); border: 3px solid var(--edge); border-radius: 4px; user-select: none; -webkit-user-select: none; }
  .kc { position: relative; border-radius: 3px; }
  .kc.b { background: #07060b; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 4px, transparent 4px 8px); }
  .kc.w { --ink: var(--gold); background: var(--rock-2); box-shadow: inset 0 0 0 2px var(--rock-3); cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
  .kc .kd { font: 700 calc(var(--cs) * .56) var(--f-display); color: var(--ink); line-height: 1; padding-top: calc(var(--cs) * .08); }
  .kc .kn { position: absolute; top: 2px; left: 3px; font: 800 max(9px, calc(var(--cs) * .22)) var(--f-body); color: var(--muted); line-height: 1; }
  .kc.w.run { background: color-mix(in srgb, var(--moss) 20%, var(--rock-2)); }
  .kc.w.sel { box-shadow: inset 0 0 0 3px var(--gold); background: color-mix(in srgb, var(--gold) 22%, var(--rock-2)); }
  .kc.w.ok { box-shadow: inset 0 0 0 2px var(--moss); }
  .kc.w.ok.sel { box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 0 5px var(--moss); }
  .kc.w.hint .kd { color: var(--amethyst); }
  .kc.w.hint { box-shadow: inset 0 0 0 2px var(--amethyst); }
  .kc.w.bad { box-shadow: inset 0 0 0 3px #e0675a; animation: mkshake .3s; }
  .kc.w.bad .kd { color: #ffb3a8; }
  @keyframes mkshake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .kx-cur { display: flex; align-items: center; gap: 8px; background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 6px; min-height: 3.2em; }
  .kx-curtxt { flex: 1; text-align: center; font-size: clamp(1.05rem, 4vw, 1.35rem); font-weight: 800; line-height: 1.3; }
  .kx-curtxt b { font: 700 .85em var(--f-display); color: var(--moss); margin-right: 4px; white-space: nowrap; }
  .kx-nav { font: 700 1.4rem var(--f-display); color: var(--fg); background: var(--rock-3); border: 3px solid var(--edge); border-radius: 4px; width: 40px; height: 40px; cursor: pointer; flex: none; box-shadow: 0 3px 0 var(--edge); }
  .kx-nav:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
  .kx-pad { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 520px; width: 100%; margin: 0 auto; }
  .kx-key { height: 46px; font: 700 1.3rem var(--f-display); color: var(--fg); background: var(--rock-3); border: 3px solid var(--edge); border-radius: 4px; cursor: pointer; padding: 0; touch-action: manipulation; box-shadow: inset 0 -3px 0 var(--rock-2), 0 3px 0 var(--edge); }
  .kx-key:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 var(--rock-2), 0 1px 0 var(--edge); }
  .kx-key.wide { grid-column: span 5; font-size: 1.1rem; }
  .kx-key small { font: 700 .75rem var(--f-body); color: var(--muted); }
  .kx-clues { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 600px) { .kx-clues { grid-template-columns: 1fr; } }
  .kx-clues h3 { font-family: var(--f-display); font-size: 1.15rem; margin-bottom: 6px; }
  .kx-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .kx-list li { display: flex; gap: 10px; padding: 6px 8px; border-radius: 4px; cursor: pointer; line-height: 1.35; border: 2px solid transparent; }
  .kx-list li b { font: 700 1rem var(--f-display); color: var(--moss); min-width: 1.6em; }
  .kx-list li:hover { background: var(--rock-2); }
  .kx-list li.on { background: var(--rock-2); border-color: var(--gold); }
  .kx-list li.done span { text-decoration: line-through; color: var(--muted); }
  .mk-acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .mk-msg { text-align: center; min-height: 1.5em; font-weight: 800; }
  .mk-msg.bad { color: #ffb3a8; } .mk-msg.good { color: var(--moss); }
  .mk-res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mk-res div { background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 10px; text-align: center; }
  .mk-res b { display: block; font: 700 1.7rem var(--f-display); color: var(--gold); }
  .mk-res span { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .mk-center { text-align: center; }
  .mk-badge { display: inline-block; font: 700 1rem var(--f-display); color: var(--edge); background: var(--moss); border: 3px solid var(--edge); border-radius: 4px; padding: 4px 12px; }

  /* teman */
  .kx-board.tema-tidning { background: #111; border-color: #111; }
  .kx-board.tema-tidning .kc.b { background: #111; background-image: none; }
  .kx-board.tema-tidning .kc.w { --ink: #1d2c5a; background: #fbfaf6; box-shadow: none; }
  .kx-board.tema-tidning .kc .kn { color: #333; }
  .kx-board.tema-tidning .kc.w.run { background: #dfe9fb; }
  .kx-board.tema-tidning .kc.w.sel { background: #ffe9a8; box-shadow: inset 0 0 0 3px #1d4fb8; }
  .kx-board.tema-tidning .kc.w.ok { box-shadow: inset 0 0 0 2px #2e8a3d; }
  .kx-board.tema-tavla { background: #0d1a13; border-color: #0d1a13; }
  .kx-board.tema-tavla .kc.b { background: #0d1a13; background-image: none; }
  .kx-board.tema-tavla .kc.w { --ink: #fff4b8; background: #1f3b2d; box-shadow: inset 0 0 0 2px rgba(255,255,255,.28); }
  .kx-board.tema-tavla .kc .kn { color: #cfe0d4; }
  .kx-board.tema-tavla .kc.w.run { background: #2a5340; }
  .kx-board.tema-ritning { background: #0a2440; border-color: #0a2440; }
  .kx-board.tema-ritning .kc.b { background: #0a2440; background-image: none; }
  .kx-board.tema-ritning .kc.w { --ink: #ffffff; background-color: #133f6c; background-image: linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px); background-size: 8px 8px; box-shadow: inset 0 0 0 2px #9cc8f5; }
  .kx-board.tema-ritning .kc .kn { color: #cfe6ff; }
  .kx-board.tema-ritning .kc.w.run { background-color: #1d5592; }
  .kx-board.tema-rymd { background: #050409; border-color: #050409; }
  .kx-board.tema-rymd .kc.b { background: radial-gradient(1px 1px at 30% 40%, #fff, transparent), radial-gradient(1px 1px at 70% 70%, #b58cff, transparent), #07060f; }
  .kx-board.tema-rymd .kc.w { --ink: #e6dcff; background: rgba(90,60,170,.35); box-shadow: inset 0 0 0 2px rgba(181,140,255,.6), 0 0 8px rgba(181,140,255,.25); }
  .kx-board.tema-rymd .kc.w.run { background: rgba(110,198,255,.3); }
  .kx-board.tema-guld { background: #1c1405; border-color: #1c1405; }
  .kx-board.tema-guld .kc.b { background: #1c1405; background-image: none; }
  .kx-board.tema-guld .kc.w { --ink: #2a1f04; background: linear-gradient(160deg, #ffe8a0, #d9a52b 55%, #a87a14); box-shadow: inset 0 0 0 2px #6e4600; }
  .kx-board.tema-guld .kc .kn { color: #5a3e05; }
  .kx-board.tema-guld .kc.w.run { background: linear-gradient(160deg, #fff3c4, #f0c24a 55%, #c9971f); }
  /* pennor: färgen på siffrorna du skriver */
  .kx-board.penna-bla .kc.w { --ink: #6ec6ff; } .kx-board.penna-gron .kc.w { --ink: #9be07a; } .kx-board.penna-rosa .kc.w { --ink: #ff9fd0; }
  .kx-board.tema-tidning.penna-bla .kc.w { --ink: #1d4fb8; } .kx-board.tema-tidning.penna-gron .kc.w { --ink: #2e8a3d; } .kx-board.tema-tidning.penna-rosa .kc.w { --ink: #c2307a; }
  .kx-board.penna-guld .kc.w .kd { color: #ffd166; text-shadow: 0 1px 0 #8a6210, 0 0 6px rgba(255,209,102,.6); }
  .kx-board.penna-glod .kc.w .kd { color: #fff; text-shadow: 0 0 4px #fff, 0 0 10px #ff9f8a, 0 0 18px #ff6e28; }
  .kx-board.penna-regnbage .kc.w .kd { animation: mkrain 3s linear infinite; }
  @keyframes mkrain { 0% { color: #ff6b6b; } 20% { color: #ffd166; } 40% { color: #7ccf5a; } 60% { color: #6ec6ff; } 80% { color: #b58cff; } 100% { color: #ff6b6b; } }
  .kx-board .kc.w.hint .kd, .kx-board .kc.w.bad .kd { animation: none; text-shadow: none; }
  /* ramar */
  .kx-board.ram-tra { border: 8px solid #7a4a25; box-shadow: inset 0 0 0 2px #a46a3a, 0 0 0 3px var(--edge); }
  .kx-board.ram-metall { border: 8px solid #8c93a3; box-shadow: inset 0 2px 0 #cfd4de, 0 0 0 3px var(--edge), inset 0 0 0 2px #5d6372; }
  .kx-board.ram-neon { border: 3px solid var(--moss); box-shadow: 0 0 10px var(--moss), 0 0 24px color-mix(in srgb, #6ec6ff 70%, transparent); }
  .kx-board.ram-guld { border: 8px solid #d9a52b; box-shadow: inset 0 2px 0 #ffe7a0, 0 0 0 3px var(--edge), 0 0 16px rgba(255,209,102,.35); }
  /* firanden */
  .mk-fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
  .mk-p { position: absolute; display: block; pointer-events: none; animation: var(--anim) var(--dur, 1.6s) ease-out forwards; animation-delay: var(--del, 0s); opacity: 0; }
  @keyframes mkfall { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }
  @keyframes mkrise { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  @keyframes mkburst { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); } }
  @media (prefers-reduced-motion: reduce) { .mk-p { display: none; } .kx-board .kc, .kx-board .kd { animation: none !important; } }

  /* konto, topplista, verkstad (som Fingerfärd) */
  .mk-acct { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .mk-acct form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; width: 100%; }
  .mk-acct .fld { flex: 1 1 140px; }
  .mk-acct .check { display: inline-flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
  .mk-cats { display: flex; flex-direction: column; gap: 18px; }
  .mk-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .mk-item { background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .mk-item.on { border-color: var(--moss); }
  .mk-item h3 { font-family: var(--f-body); font-weight: 800; font-size: 1.05rem; }
  .mk-item p { font-size: .9rem; color: var(--muted); }
  .mk-item .btn { align-self: flex-start; margin-top: auto; font-size: .95rem; padding: 7px 12px; }
  .mk-item .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .mk-sw { height: 34px; border: 3px solid var(--edge); border-radius: 4px; display: grid; place-items: center; font: 700 1.2rem var(--f-display); }
  .mk-earn { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; font-weight: 800; }
  .mk-earn .mk-coins { font-size: 1.3rem; }
  .mk-lock { color: var(--muted); font-size: .85rem; }
  .mk-rules { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; line-height: 1.55; }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast" role="status" aria-live="assertive"></div>
<noscript><p style="padding:16px">Sidan behöver JavaScript.</p></noscript>
<script src="../konto/config.js"></script>
<script src="../konto/konto.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  /* ---------- korsordsgenerator ----------
     1. Rutnät: svarta rutor slumpas symmetriskt tills alla svar är 2–maxLen siffror långa,
        alla vita rutor hör till ett svar, rutnätet hänger ihop och de flesta rutor korsas.
     2. Tal: svaren fylls i ett i taget så att siffrorna stämmer där de korsas (inga inledande nollor).
     3. Ledtrådar: varje tal får en uträkning eller en enkel fråga vars svar är just det talet. */
  const LEVELS = {
    latt:  { id: 'latt',  n: 'Lätt',  size: 5, maxLen: 3, ent: [6, 12], max: { 2: 99, 3: 500 }, pts: 40, mynt: 3, ex: '23 + 15',
             d: 'Ett litet korsord med plus och minus. Svar upp till 500.' },
    medel: { id: 'medel', n: 'Medel', size: 6, maxLen: 3, ent: [9, 16], max: { 2: 99, 3: 999 }, pts: 80, mynt: 6, ex: '7 × 8',
             d: 'Alla fyra räknesätten och multiplikationstabellen. Svar upp till 999.' },
    svar:  { id: 'svar',  n: 'Svår',  size: 7, maxLen: 4, ent: [12, 22], max: { 2: 99, 3: 999, 4: 9999 }, pts: 150, mynt: 10, ex: '6 × 7 + 15',
             d: 'Ett större korsord med större tal, räkneordning och parenteser.' }
  };
  const LEVEL_RANK = { latt: 0, medel: 1, svar: 2 };
  // tal med en egen fråga. lv = lägsta nivå där frågan används.
  const FACTS = [
    [10, 'deciliter på en liter', 0], [11, 'spelare i ett fotbollslag på planen', 0], [12, 'månader på ett år', 0], [12, 'ett dussin', 1],
    [20, 'ett tjog', 1], [24, 'timmar på ett dygn', 0], [28, 'dagar i februari ett vanligt år', 0], [29, 'dagar i februari ett skottår', 1],
    [30, 'dagar i november', 0], [31, 'dagar i december', 0], [52, 'veckor på ett år', 0], [52, 'kort i en kortlek', 0],
    [60, 'minuter på en timme', 0], [60, 'sekunder på en minut', 0], [64, 'rutor på ett schackbräde', 1], [90, 'grader i en rät vinkel', 1],
    [100, 'centimeter på en meter', 0], [100, 'år i ett sekel', 1], [144, 'ett dussin dussin', 2], [168, 'timmar på en vecka', 1],
    [180, 'grader i ett halvt varv', 1], [360, 'grader i ett helt varv', 1], [365, 'dagar på ett vanligt år', 1], [366, 'dagar på ett skottår', 1],
    [500, 'gram på ett halvt kilo', 1], [1000, 'meter på en kilometer', 2], [1000, 'gram på ett kilo', 2], [1440, 'minuter på ett dygn', 2],
    [3600, 'sekunder på en timme', 2], [2000, 'år i två årtusenden', 2]
  ];

  function rng(seed) { // mulberry32
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  // --- 1. rutnät ---
  function runsOf(B, S) { // B[r][c] = true om svart
    const entries = [];
    for (const dir of ['a', 'd']) {
      for (let i = 0; i < S; i++) {
        let j = 0;
        while (j < S) {
          const blk = (k) => (dir === 'a' ? B[i][k] : B[k][i]);
          if (blk(j)) { j++; continue; }
          const start = j; while (j < S && !blk(j)) j++;
          const cells = []; for (let k = start; k < j; k++) cells.push(dir === 'a' ? i + ',' + k : k + ',' + i);
          entries.push({ dir, cells });
        }
      }
    }
    return entries;
  }
  // färdiga rutnät (alla symmetriska rutnät som uppfyller kraven, med rotationer och speglingar)
  const PATTERNS = {
    latt: ["##.../#..#./..#../.#..#/...##", "#...#/..#../.###./..#../#...#", ".###./..#../#...#/..#../.###.", "..#../#...#/##.##/#...#/..#..", "...##/.#..#/..#../#..#./##..."],
    medel: ["###.../...#../.#...#/#...#./..#.../...###", "##...#/#...#./..#.../...#../.#...#/#...##", "#.##../..#.../#...#./.#...#/...#../..##.#", "#.#..#/...#../.#...#/#...#./..#.../#..#.#", "#.#.../...#../##...#/#...##/..#.../...#.#", "#..#.#/..#.../#...#./.#...#/...#../#.#..#", "#..#../#.#.../#...#./.#...#/...#.#/..#..#", "#...##/.#...#/...#../..#.../#...#./##...#", ".###../...#../.#...#/#...#./..#.../..###.", ".##.../...#../##...#/#...##/..#.../...##.", ".##.../...#../.#...#/#...#./..#.../...##.", "..###./..#.../#...#./.#...#/...#../.###..", "..##.#/...#../.#...#/#...#./..#.../#.##..", "..##../#.#.../#...#./.#...#/...#.#/..##..", "..##../...#.#/.#...#/#...#./#.#.../..##..", "..#..#/...#.#/.#...#/#...#./#.#.../#..#..", "..#.../...#.#/##...#/#...##/#.#.../...#..", "..#.../...#.#/.#...#/#...#./#.#.../...#..", "...###/..#.../#...#./.#...#/...#../###...", "...##./..#.../#...##/##...#/...#../.##...", "...##./..#.../#...#./.#...#/...#../.##...", "...#.#/..#.../#...##/##...#/...#../#.#...", "...#../#.#.../#...##/##...#/...#.#/..#...", "...#../#.#.../#...#./.#...#/...#.#/..#..."]
  };
  function makeGrid(L, R) {
    const S = L.size;
    if (PATTERNS[L.id]) {
      const P = PATTERNS[L.id][Math.floor(R() * PATTERNS[L.id].length)].split('/');
      const B = P.map((row) => [...row].map((ch) => ch === '#'));
      return { S, B, entries: runsOf(B, S).filter((e) => e.cells.length >= 2) };
    }
    for (let t = 0; t < 20000; t++) {
      const B = Array.from({ length: S }, () => Array(S).fill(false));
      const setB = (r, c) => { B[r][c] = true; B[S - 1 - r][S - 1 - c] = true; };
      for (let i = Math.floor(R() * 3); i > 0; i--) setB(Math.floor(R() * S), Math.floor(R() * S));
      // bryt varje för långt svar med en svart ruta någonstans inuti, tills inga är för långa
      let runs = runsOf(B, S), guard = 0;
      for (let long = runs.find((e) => e.cells.length > L.maxLen); long && guard < 40; long = runs.find((e) => e.cells.length > L.maxLen), guard++) {
        const [r, c] = long.cells[1 + Math.floor(R() * (long.cells.length - 2))].split(',').map(Number);
        setB(r, c); runs = runsOf(B, S);
      }
      if (runs.some((e) => e.cells.length > L.maxLen)) continue;
      const entries = runs.filter((e) => e.cells.length >= 2);
      if (entries.length < L.ent[0] || entries.length > L.ent[1]) continue;
      const cover = {};
      entries.forEach((e) => e.cells.forEach((id) => { cover[id] = (cover[id] || 0) + 1; }));
      const white = []; for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) if (!B[r][c]) white.push(r + ',' + c);
      if (white.some((id) => !cover[id])) continue;               // varje vit ruta hör till ett svar
      if (white.filter((id) => cover[id] === 2).length < white.length * 0.6) continue; // de flesta korsas
      // hänger ihop?
      const seen = new Set([white[0]]), q = [white[0]];
      while (q.length) {
        const [r, c] = q.pop().split(',').map(Number);
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => { const id = (r + dr) + ',' + (c + dc); if (white.includes(id) && !seen.has(id)) { seen.add(id); q.push(id); } });
      }
      if (seen.size !== white.length) continue;
      return { S, B, entries };
    }
    return null;
  }

  // --- 2. tal ---
  function fill(G, L, R) {
    const E = G.entries;
    const dig = {}, ans = new Array(E.length);
    const used = new Set();
    const lo = (len) => Math.pow(10, len - 1);
    let steps = 0;
    function candidates(e) {
      const len = e.cells.length, hi = L.max[len], from = lo(len), out = [], pat = e.cells.map((id) => dig[id]);
      const fits = (v) => { const s = String(v); return s.length === len && v <= hi && !used.has(v) && pat.every((d, i) => d === undefined || d === s[i]); };
      if (R() < 0.5) FACTS.forEach(([v, , lv]) => { if (lv <= LEVEL_RANK[L.id] && fits(v) && !out.includes(v)) out.push(v); });
      const span = hi - from + 1, off = Math.floor(R() * span), stride = [1, 7, 11, 13, 17][Math.floor(R() * 5)];
      for (let i = 0; i < span && out.length < 12; i++) { const v = from + ((off + i * stride) % span); if (fits(v) && !out.includes(v)) out.push(v); }
      return out;
    }
    const done = new Array(E.length).fill(false);
    // välj alltid det svar som har flest siffror bestämda (snabbast att hitta motsägelser)
    function nextEntry() {
      let best = -1, bestScore = -1;
      E.forEach((e, i) => { if (done[i]) return; const f = e.cells.filter((id) => dig[id] !== undefined).length / e.cells.length + R() * 0.01; if (f > bestScore) { bestScore = f; best = i; } });
      return best;
    }
    function consistent() {
      for (let i = 0; i < E.length; i++) {
        if (done[i]) continue;
        const e = E[i];
        if (dig[e.cells[0]] === '0') return false;
        if (e.cells.every((id) => dig[id] !== undefined)) { const v = Number(e.cells.map((id) => dig[id]).join('')); if (v > L.max[e.cells.length] || used.has(v)) return false; }
      }
      return true;
    }
    function go(k) {
      if (k === E.length) return true;
      if (++steps > 300) return false;
      const i = nextEntry(), e = E[i];
      for (const v of candidates(e)) {
        const s = String(v), set = [];
        e.cells.forEach((id, j) => { if (dig[id] === undefined) { dig[id] = s[j]; set.push(id); } });
        ans[i] = v; used.add(v); done[i] = true;
        if (consistent() && go(k + 1)) return true;
        done[i] = false; used.delete(v); set.forEach((id) => delete dig[id]);
      }
      return false;
    }
    return go(0) ? { dig, ans } : null;
  }

  // --- 3. ledtrådar ---
  // vardagsfrågor: [antal per sak, början, sak (plural), lägsta nivå]
  const GROUPS = [
    [2, 'hjul på', 'cyklar', 0], [4, 'hjul på', 'bilar', 0], [4, 'ben på', 'hundar', 0], [2, 'ögon på', 'katter', 0], [5, 'fingrar på', 'händer', 0],
    [10, 'kronor i', 'tiokronor', 0], [8, 'ben på', 'spindlar', 1], [6, 'ben på', 'myror', 1], [7, 'dagar på', 'veckor', 1], [12, 'månader på', 'år', 1],
    [20, 'kronor i', 'tjugolappar', 1], [3, 'hörn på', 'trianglar', 1], [4, 'hörn på', 'kvadrater', 1], [60, 'minuter på', 'timmar', 1], [24, 'timmar på', 'dygn', 2],
    [100, 'centimeter på', 'meter', 1], [50, 'kronor i', 'femtiolappar', 2], [11, 'spelare i', 'fotbollslag', 2]
  ];
  function clueFor(n, L, R) {
    const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
    const lv = LEVEL_RANK[L.id], opts = []; // [vikt, funktion]
    const add = (w, f) => opts.push([w, f]);
    const facts = FACTS.filter(([v, , l]) => v === n && l <= lv);
    if (facts.length) add(6, () => facts[Math.floor(R() * facts.length)][1]);
    GROUPS.forEach(([k, pre, noun, l]) => { const q = n / k; if (l <= lv && Number.isInteger(q) && q >= 2 && q <= (lv === 0 ? 10 : lv === 1 ? 12 : 99)) add(lv === 0 ? 1.5 : 1.2, () => `${pre} ${q} ${noun}`); });
    // plus och minus
    const wPM = lv === 0 ? 3 : lv === 1 ? 1 : 0.8;
    add(wPM, () => { const a = ri(Math.max(2, Math.floor(n * 0.2)), n - 2); return a >= 2 && n - a >= 2 ? `${a} + ${n - a}` : null; });
    add(wPM, () => { const b = ri(2, lv === 0 ? Math.min(90, 500 - n) : lv === 1 ? 300 : 2000); return b > 1 && n + b <= (lv === 0 ? 500 : 9999) ? `${n + b} − ${b}` : null; });
    if (lv === 0) {
      if (n % 2 === 0 && n >= 4) add(1, () => `dubbelt så mycket som ${n / 2}`);
      if (n * 2 <= 200) add(1, () => `hälften av ${n * 2}`);
      if (n > 10) add(0.7, () => `10 mer än ${n - 10}`);
      if (n <= 490) add(0.7, () => `10 mindre än ${n + 10}`);
      if (n >= 100 && n % 10 === 0) add(1, () => `${n / 10} tiotal`);
    }
    if (lv >= 1) {
      const pairs = []; for (let a = 2; a <= 10; a++) if (n % a === 0 && n / a >= 2 && n / a <= 10) pairs.push([a, n / a]);
      if (pairs.length) add(lv === 1 ? 5 : 2, () => { const [a, b] = pairs[Math.floor(R() * pairs.length)]; return `${a} × ${b}`; });
      const big = []; for (let a = 2; a <= 9; a++) if (n % a === 0 && n / a > 10 && n / a < 1000) big.push([a, n / a]);
      if (big.length && (lv === 2 || n <= 300)) add(lv === 1 ? 2 : 1.5, () => { const [a, b] = big[Math.floor(R() * big.length)]; return `${b} × ${a}`; });
      add(lv === 1 ? 2.5 : 1.5, () => { const b = ri(2, lv === 1 ? 10 : 12); return n * b <= (lv === 1 ? 999 : 9999) && n >= 2 ? `${n * b} ÷ ${b}` : null; });
      if (n % 3 === 0 && n >= 6) add(0.8, () => `tre gånger så mycket som ${n / 3}`);
      if (n * 2 <= (lv === 2 ? 9999 : 999)) add(0.8, () => `hälften av ${n * 2}`);
    }
    if (lv === 2) {
      add(2, () => { const a = ri(3, 12), b = ri(3, 12), c = n - a * b; return c >= 2 && c <= 99 ? `${a} × ${b} + ${c}` : null; });
      add(2, () => { const a = ri(3, 12), b = ri(3, 12), c = a * b - n; return c >= 2 && c <= 99 ? `${a} × ${b} − ${c}` : null; });
      add(2, () => {
        const cs = []; for (let c = 2; c <= 12; c++) if (n % c === 0 && n / c >= 3 && n / c <= 99) cs.push(c);
        if (!cs.length) return null;
        const c = cs[Math.floor(R() * cs.length)], s2 = n / c, a = ri(1, s2 - 1);
        return `(${a} + ${s2 - a}) × ${c}`;
      });
      add(1.5, () => { const b = ri(2, 9), c = ri(2, Math.min(99, n - 2)); const a = (n - c) * b; return n - c >= 2 && a <= 999 ? `${a} ÷ ${b} + ${c}` : null; });
      const k = Math.round(Math.sqrt(n)); if (k * k === n && k >= 4 && k <= 30) add(2, () => `${k} × ${k}`);
      if (n % 4 === 0) add(0.8, () => `en fjärdedel av ${n * 4}`);
      if (n * 10 <= 99999) add(0.6, () => `en tiondel av ${n * 10}`);
    }
    const total = opts.reduce((a, [w]) => a + w, 0);
    for (let t = 0; t < 60; t++) {
      let x = R() * total, f = opts[opts.length - 1][1];
      for (const [w, g] of opts) { if ((x -= w) < 0) { f = g; break; } }
      const c = f(); if (c) return c;
    }
    return `${n - 1} + 1`;
  }

  // Räknar ut en ledtråd som är en uträkning (för testerna). Null för textfrågor.
  function evalClue(c) {
    let s = c.replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/');
    const m = s.match(/^(dubbelt så mycket som|hälften av|tre gånger så mycket som|en fjärdedel av|en tiondel av|10 mer än|10 mindre än) (\d+)$/);
    if (m) { const v = Number(m[2]); return { 'dubbelt så mycket som': v * 2, 'hälften av': v / 2, 'tre gånger så mycket som': v * 3, 'en fjärdedel av': v / 4, 'en tiondel av': v / 10, '10 mer än': v + 10, '10 mindre än': v - 10 }[m[1]]; }
    const gq = GROUPS.find(([, pre, noun]) => new RegExp('^' + pre + ' (\\d+) ' + noun + '$').test(c)); if (gq) return Number(c.match(/(\d+)/)[1]) * gq[0];
    const tt = s.match(/^(\d+) tiotal$/); if (tt) return Number(tt[1]) * 10;
    if (!/^[\d\s+\-*/()]+$/.test(s)) return null;
    return Function('return (' + s + ')')();
  }

  function makePuzzle(level, seed) {
    const L = LEVELS[level], R = rng(seed);
    for (let t = 0; t < 200; t++) {
      const G = makeGrid(L, R); if (!G) continue;
      const F = fill(G, L, R); if (!F) continue;
      // numrera som i ett vanligt korsord
      const start = {};
      G.entries.forEach((e) => { (start[e.cells[0]] = start[e.cells[0]] || []).push(e); });
      let num = 0; const nums = {};
      for (let r = 0; r < G.S; r++) for (let c = 0; c < G.S; c++) if (start[r + ',' + c]) nums[r + ',' + c] = ++num;
      const entries = G.entries.map((e, i) => ({ dir: e.dir, cells: e.cells, num: nums[e.cells[0]], ans: F.ans[i], clue: clueFor(F.ans[i], L, R) }))
        .sort((a, b) => (a.dir === b.dir ? a.num - b.num : a.dir === 'a' ? -1 : 1));
      return { level, seed, S: G.S, B: G.B, dig: F.dig, nums, entries };
    }
    return null;
  }

  function norm(o) {

    v.equip = Object.assign({}, DEFAULT_EQUIP, v.equip || {});
    if (!Array.isArray(v.owned)) v.owned = [];
    if (!v.daily || !Array.isArray(v.daily.l)) v.daily = { d: '', l: [] };
    v.mynt = Math.max(0, Number(v.mynt) || 0);
    return v;
  }

  function store(addPts = 0, best = 0, now = false) {

<p class="lead">Ett riktigt korsord, fast ledtrådarna är uträkningar och svaren är tal. Skriv en siffra i varje ruta. Där svaren korsas måste siffrorna stämma åt båda hållen.</p>

</section>
${save.bestStreak ? `<section class="panel"><p>Felfri svit just nu: <b>${save.streak}</b> · Din bästa: <b>${save.bestStreak}</b></p></section>` : ''}
${K ? '<section class="panel" id="board"></section>' : ''}
<footer class="foot"><span class="muted small">${sess ? 'Mynt och resultat sparas på ditt konto.' : 'Resultaten sparas i den här webbläsaren.'}</span>${sess ? '' : '<button class="link small" data-a="reset">Börja om från början</button>'}</footer>`;

  function helpPanel() {

<section class="panel">

  /* ---------- konto ---------- */
  function renderAcct() {

  /* ---------- topplista ---------- */
  async function loadBoard() {
    const box = $('board'); if (!box || !K) return;
    const tabs = [['week', 'Veckans poäng'], ['best', 'Längsta felfria svit'], ['total', 'All-time']];
    box.innerHTML = `<div class="mk-bar"><h2>Topplista</h2>${sess && acct ? `<span class="muted small">Du: ${acct.week} poäng i veckan</span>` : ''}</div>
      <div class="chips">${tabs.map(([id, n]) => `<button class="chip${boardKind === id ? ' on' : ''}" data-kind="${id}">${n}</button>`).join('')}</div>
      <div id="brows"><p class="muted">Hämtar…</p></div>
      <p class="muted small">${boardKind === 'best' ? 'Flest korsord i rad lösta utan fel och utan att visa siffror.' : 'Poäng får du för lösta korsord. Svårare nivå och färre fel ger mer poäng.'}${sess ? '' : ' Logga in för att vara med.'}</p>`;
    box.querySelectorAll('[data-kind]').forEach((b) => { b.onclick = () => { boardKind = b.dataset.kind; loadBoard(); }; });
    try {
      const rows = await K.rpc('get_leaderboard', { p_spel: SPEL, p_kind: boardKind, p_token: (sess && sess.token) || null });
      if (!$('brows')) return;
      $('brows').innerHTML = rows && rows.length
        ? `<ol class="board">${rows.map((r) => `<li class="${r.r_me ? 'me' : ''}${r.r_rank <= 3 ? ' top' + r.r_rank : ''}"><span class="b-rank">${r.r_rank}</span><span class="b-name">${esc(r.r_name)}${r.r_me ? ' <small>(du)</small>' : ''}</span><span class="b-score">${r.r_score}</span></li>`).join('')}</ol>`
        : '<p class="muted">Ingen har kommit med på listan än. Bli först!</p>';
    } catch (e) { if ($('brows')) $('brows').innerHTML = '<p class="muted">Kunde inte hämta topplistan just nu.</p>'; }
  }

  /* ---------- spela ---------- */
  let P = null, timerT = null;
  const stopTimer = () => { clearInterval(timerT); timerT = null; };
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const hoverable = () => window.matchMedia && matchMedia('(hover: hover)').matches;

  function gridHTML(pz, opts = {}) {
    let h = '';
    for (let r = 0; r < pz.S; r++) for (let c = 0; c < pz.S; c++) {
      const id = r + ',' + c;
      if (pz.B[r][c]) { h += '<div class="kc b" aria-hidden="true"></div>'; continue; }
      const v = opts.fill ? opts.fill(id) : '';
      h += `<div class="kc w${opts.cls ? ' ' + opts.cls(id) : ''}" data-id="${id}" role="button" aria-label="Ruta rad ${r + 1}, kolumn ${c + 1}">${pz.nums[id] ? `<span class="kn">${pz.nums[id]}</span>` : ''}<span class="kd">${v}</span></div>`;
    }
    return h;
  }
  const dirName = (d) => (d === 'a' ? 'vågrätt' : 'lodrätt');

  function startPuzzle(level, daily) {
    view = 'play'; stopTimer(); window.scrollTo(0, 0);
    const seed = daily ? hashStr(today() + ':' + level) : (Math.random() * 4294967296) >>> 0;
    const pz = makePuzzle(level, seed), L = LEVELS[level];
    const at = {}; // ruta -> { a: svar vågrätt, d: svar lodrätt }
    pz.entries.forEach((e, i) => e.cells.forEach((id) => { (at[id] = at[id] || {})[e.dir] = i; }));
    const white = Object.keys(at);
    P = { pz, L, at, white, daily: !!daily, errors: 0, hints: 0, t0: Date.now(), done: false, vals: {}, lock: {}, ei: 0, id: pz.entries[0].cells[0] };
    const list = (d) => pz.entries.map((e, i) => (e.dir === d ? `<li data-clue="${i}"><b>${e.num}</b> <span>${esc(e.clue)}</span></li>` : '')).join('');
    $('app').innerHTML = `${head()}
<section class="panel">
  <div class="mk-bar"><h2>${daily ? 'Dagens korsord · ' : ''}${L.n}</h2><div class="mk-live"><span>Tid <b id="time">0:00</b></span><span>Kvar <b id="left">${white.length}</b></span>${save.streak ? `<span>Felfri svit <b>${save.streak}</b></span>` : ''}</div></div>
  ${level === 'svar' ? '<p class="muted small">Kom ihåg: × och ÷ räknas före + och −, och det som står inom parentes räknas först.</p>' : ''}
  <div class="kx-cur" id="cur" aria-live="polite"><button class="kx-nav" data-a="prev" aria-label="Förra ledtråden">‹</button><div class="kx-curtxt"><b id="curnum"></b> <span id="curclue"></span></div><button class="kx-nav" data-a="next" aria-label="Nästa ledtråd">›</button></div>
  <div class="mk-wrap"><div class="kx-board ${lookClasses()}" id="grid" style="--S:${pz.S}">${gridHTML(pz)}<div class="mk-fx" id="fx"></div></div></div>
  <div class="kx-pad" id="pad">${'1234567890'.split('').map((d) => `<button class="kx-key" data-k="${d}">${d}</button>`).join('')}<button class="kx-key wide" data-k="back" aria-label="Sudda">⌫</button><button class="kx-key wide" data-k="dir" aria-label="Byt riktning">⇄ <small>vågrätt/lodrätt</small></button></div>
  <p class="mk-msg" id="msg" aria-live="polite"></p>
  <div class="mk-acts" id="acts">
    <button class="btn" data-a="check">Rätta</button>
    <button class="btn ghost" data-a="hint">Visa siffra</button>
    <button class="btn ghost" data-a="new">Nytt korsord</button>
    <button class="btn ghost" data-a="home">Avbryt</button>
  </div>
</section>
<section class="panel kx-clues">
  <div><h3>Vågrätt</h3><ol class="kx-list">${list('a')}</ol></div>
  <div><h3>Lodrätt</h3><ol class="kx-list">${list('d')}</ol></div>
</section>`;
    $('grid').addEventListener('click', (e) => { const c = e.target.closest('.kc.w'); if (c) pickCell(c.dataset.id); });
    timerT = setInterval(() => { if ($('time')) $('time').textContent = fmt(Math.floor((Date.now() - P.t0) / 1000)); }, 1000);
    paint();
  }

  // välj ruta; samma ruta igen byter riktning om den hör till två svar
  function pickCell(id) {
    if (!P || P.done) return;
    const a = P.at[id];
    if (id === P.id && a.a !== undefined && a.d !== undefined) P.ei = P.pz.entries[P.ei].dir === 'a' ? a.d : a.a;
    else { const cur = P.pz.entries[P.ei].dir; P.ei = a[cur] !== undefined ? a[cur] : (a.a !== undefined ? a.a : a.d); }
    P.id = id; paint();
  }
  function pickEntry(i) {
    P.ei = (i + P.pz.entries.length) % P.pz.entries.length;
    const e = P.pz.entries[P.ei];
    P.id = e.cells.find((id) => !P.lock[id] && !P.vals[id]) || e.cells.find((id) => !P.lock[id]) || e.cells[0];
    paint();
  }
  function toggleDir() { const a = P.at[P.id]; if (a.a !== undefined && a.d !== undefined) { P.ei = P.pz.entries[P.ei].dir === 'a' ? a.d : a.a; paint(); } }

  function paint() {
    const e = P.pz.entries[P.ei], run = new Set(e.cells);
    document.querySelectorAll('#grid .kc.w').forEach((c) => {
      const id = c.dataset.id;
      c.classList.toggle('run', run.has(id)); c.classList.toggle('sel', id === P.id);
      c.querySelector('.kd').textContent = P.vals[id] || '';
    });
    $('curnum').textContent = `${e.num} ${dirName(e.dir)}`;
    $('curclue').textContent = e.clue;
    document.querySelectorAll('.kx-list li').forEach((li) => li.classList.toggle('on', Number(li.dataset.clue) === P.ei));
    const li = document.querySelector(`.kx-list li[data-clue="${P.ei}"]`);
    if (li && hoverable()) li.scrollIntoView({ block: 'nearest' });
  }

  function advance() {
    const e = P.pz.entries[P.ei], k = e.cells.indexOf(P.id);
    const nx = e.cells.slice(k + 1).find((id) => !P.lock[id]);
    if (nx) { P.id = nx; return; }
    const before = e.cells.slice(0, k).find((id) => !P.lock[id] && !P.vals[id]); // en tom ruta tidigare i samma svar
    if (before) { P.id = before; return; }
    // svaret är fullt: hoppa till nästa svar som har tomma rutor
    for (let s = 1; s <= P.pz.entries.length; s++) {
      const i = (P.ei + s) % P.pz.entries.length, f = P.pz.entries[i].cells.find((id) => !P.lock[id] && !P.vals[id]);
      if (f) { P.ei = i; P.id = f; return; }
    }
  }
  function typeDigit(d) {
    if (!P || P.done) return;
    if (!P.lock[P.id]) {
      P.vals[P.id] = d;
      const c = document.querySelector(`#grid [data-id="${P.id}"]`); if (c) c.classList.remove('bad');
      $('msg').textContent = ''; $('msg').className = 'mk-msg';
    }
    advance(); paint();
  }
  function backspace() {
    if (!P || P.done) return;
    if (!P.lock[P.id] && P.vals[P.id]) { delete P.vals[P.id]; paint(); return; }
    const e = P.pz.entries[P.ei], k = e.cells.indexOf(P.id);
    const pv = e.cells.slice(0, k).reverse().find((id) => !P.lock[id]);
    if (pv) { P.id = pv; delete P.vals[pv]; paint(); }
  }
  function move(dr, dc) {
    const [r, c] = P.id.split(',').map(Number);
    for (let s = 1; s < P.pz.S; s++) {
      const id = (r + dr * s) + ',' + (c + dc * s);
      if (P.at[id]) { const dir = dr ? 'd' : 'a', a = P.at[id]; P.id = id; P.ei = a[dir] !== undefined ? a[dir] : (a.a !== undefined ? a.a : a.d); paint(); return; }
    }
  }

  function check() {
    if (!P || P.done) return;
    let wrong = 0, empty = 0;
    P.white.forEach((id) => {
      if (P.lock[id]) return;
      const c = document.querySelector(`#grid [data-id="${id}"]`);
      if (!P.vals[id]) { empty++; return; }
      if (P.vals[id] === P.pz.dig[id]) { P.lock[id] = 'ok'; c.classList.add('ok'); }
      else { c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad'); wrong++; }
    });
    P.errors += wrong;
    markDone();
    const msg = $('msg');
    if (!left()) return solved();
    if (wrong) { msg.className = 'mk-msg bad'; msg.textContent = wrong === 1 ? 'En siffra är fel. Räkna om ledtråden för den röda rutan.' : `${wrong} siffror är fel. Räkna om ledtrådarna för de röda rutorna.`; }
    else if (empty) { msg.className = 'mk-msg good'; msg.textContent = `Allt du skrivit är rätt! ${empty === 1 ? 'En ruta' : empty + ' rutor'} kvar.`; }
  }
  const left = () => { const n = P.white.filter((id) => !P.lock[id]).length; $('left').textContent = n; return n; };
  function markDone() {
    P.pz.entries.forEach((e, i) => { const li = document.querySelector(`.kx-list li[data-clue="${i}"]`); if (li) li.classList.toggle('done', e.cells.every((id) => P.lock[id])); });
  }
  function hint() {
    if (!P || P.done) return;
    const e = P.pz.entries[P.ei];
    const id = !P.lock[P.id] ? P.id : (e.cells.find((x) => !P.lock[x]) || P.white.find((x) => !P.lock[x]));
    if (!id) return;
    P.vals[id] = P.pz.dig[id]; P.lock[id] = 'hint'; P.hints++;
    const c = document.querySelector(`#grid [data-id="${id}"]`); c.classList.remove('bad'); c.classList.add('hint');
    P.id = id; markDone();
    if (!left()) { paint(); return solved(); }
    advance(); paint();
  }

  function solved() {
    P.done = true; stopTimer();
    document.querySelectorAll('#grid .kc').forEach((c) => c.classList.remove('run', 'sel'));
    $('cur').innerHTML = '<div class="kx-curtxt"><b>Klart!</b> <span>Alla tal stämmer.</span></div>';
    $('pad').hidden = true;
    const secs = Math.max(1, Math.round((Date.now() - P.t0) / 1000));
    const L = P.L, perfect = !P.errors && !P.hints;
    const dailyAgain = P.daily && dailyDone(L.id);
    const factor = Math.max(0.3, 1 - 0.05 * P.errors - 0.15 * P.hints);
    const pts = sess && !dailyAgain ? Math.round(L.pts * factor) : 0;
    let earned = 0, dailyBonus = 0;
    if (!dailyAgain) {
      save.solved[L.id] = (save.solved[L.id] || 0) + 1;
      if (perfect) { save.streak++; save.bestStreak = Math.max(save.bestStreak, save.streak); } else save.streak = 0;
      if (sess) earned = L.mynt + (perfect ? Math.ceil(L.mynt / 2) : 0);
      if (P.daily) {
        if (save.daily.d !== today()) save.daily = { d: today(), l: [] };
        save.daily.l.push(L.id);
        if (sess) dailyBonus = 5;
      }
    }
    save.mynt += earned + dailyBonus;
    store(pts, sess ? save.bestStreak : 0);
    celebrate();
    const msg = perfect ? 'Felfritt! Snyggt räknat.' : P.hints ? 'Klart! Nästa gång kanske utan att visa siffror?' : 'Klart! Hela korsordet stämmer.';
    $('msg').className = 'mk-msg good'; $('msg').textContent = '';
    $('acts').outerHTML = `<div class="mk-center" style="display:flex;flex-direction:column;gap:14px">
  ${perfect ? '<div><span class="mk-badge">Felfritt</span></div>' : ''}
  <h2>${msg}</h2>
  <div class="mk-res">
    <div><b>${fmt(secs)}</b><span>Tid</span></div>
    <div><b>${P.errors}</b><span>Fel</span></div>
    <div><b>${save.streak}</b><span>Felfri svit</span></div>
  </div>
  ${dailyAgain ? '<p class="muted small">Du har redan löst dagens korsord på den här nivån, så det ger inga nya poäng. Kom tillbaka i morgon!</p>'
    : sess ? `<div class="mk-earn"><span>+${pts} poäng</span>${earned + dailyBonus ? `<span>+${coins(earned + dailyBonus)}${dailyBonus ? ' <span class="small muted">(varav 5 för dagens korsord)</span>' : ''}</span>` : ''}</div>`
    : (K ? '<p class="muted small">Logga in för att få poäng på topplistan och mynt till ditt korsord.</p>' : '')}
  <div class="mk-acts">
    <button class="btn" data-a="new">Nytt korsord</button>
    <button class="btn ghost" data-a="home">Välj nivå</button>
    ${sess ? '<button class="btn ghost" data-a="shop">Korsordsverkstan</button>' : ''}
  </div>
</div>`;
  }

  // tangentbord och knappsats
  document.addEventListener('keydown', (e) => {
    if (view !== 'play' || !P || P.done || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); typeDigit(e.key); }
    else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); backspace(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); move(0, -1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); move(0, 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1, 0); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move(1, 0); }
    else if (e.key === 'Tab') { e.preventDefault(); pickEntry(P.ei + (e.shiftKey ? -1 : 1)); }
    else if (e.key === ' ') { e.preventDefault(); toggleDir(); }
    else if (e.key === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); check(); }
  });
  document.addEventListener('click', (e) => {
    if (view !== 'play' || !P) return;
    const k = e.target.closest('[data-k]'), cl = e.target.closest('[data-clue]');
    if (k) { const v = k.dataset.k; if (v === 'back') backspace(); else if (v === 'dir') toggleDir(); else typeDigit(v); }
    else if (cl && !P.done) pickEntry(Number(cl.dataset.clue));
  });

  /* ---------- firande ---------- */
  function celebrate() {
    const fx = $('fx'); if (!fx) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const kind = sess && save.equip.fest && owns(save.equip.fest) ? save.equip.fest : '';
    const W = fx.clientWidth, H = fx.clientHeight;
    const add = (css, html = '') => { const s = document.createElement('span'); s.className = 'mk-p'; s.style.cssText = css; s.innerHTML = html; fx.appendChild(s); };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const COLS = ['#ff9f8a', '#ffd166', '#7ccf5a', '#6ec6ff', '#b58cff', '#ffffff'];
    if (kind === 'fest-konfetti') {
      for (let i = 0; i < 70; i++) add(`left:${rnd(0, W)}px;top:${rnd(-30, 0)}px;width:${rnd(6, 10)}px;height:${rnd(10, 16)}px;background:${pick(COLS)};--anim:mkfall;--dur:${rnd(1.4, 2.4)}s;--del:${rnd(0, .5)}s;--dx:${rnd(-60, 60)}px;--dy:${H + 40}px;--rot:${rnd(-540, 540)}deg`);
    } else if (kind === 'fest-ballonger') {
      for (let i = 0; i < 14; i++) { const c = pick(COLS); add(`left:${rnd(0, W - 30)}px;top:${H - 20}px;width:30px;height:38px;border-radius:50% 50% 48% 48%;background:${c};box-shadow:inset -6px -6px 0 rgba(0,0,0,.15);--anim:mkrise;--dur:${rnd(2.2, 3.4)}s;--del:${rnd(0, .8)}s;--dx:${rnd(-30, 30)}px;--dy:${-H - 60}px`); }
    } else if (kind === 'fest-kristaller') {
      for (let i = 0; i < 40; i++) add(`left:${rnd(0, W)}px;top:${rnd(-30, 0)}px;font:700 ${rnd(14, 26)}px var(--f-body);color:${pick(['#9fe3ff', '#b58cff', '#7ccf5a', '#ffd166'])};text-shadow:0 0 8px currentColor;--anim:mkfall;--dur:${rnd(1.6, 2.6)}s;--del:${rnd(0, .7)}s;--dx:${rnd(-20, 20)}px;--dy:${H + 40}px;--rot:${rnd(-180, 180)}deg`, '◆');
    } else if (kind === 'fest-fyrverkeri') {
      for (let b = 0; b < 4; b++) {
        const cx = rnd(W * .15, W * .85), cy = rnd(H * .15, H * .55), c = pick(COLS), del = b * .35;
        for (let i = 0; i < 18; i++) { const a = (i / 18) * Math.PI * 2, d = rnd(50, 90); add(`left:${cx}px;top:${cy}px;width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 8px ${c};--anim:mkburst;--dur:1.1s;--del:${del}s;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`); }
      }
    } else {
      for (let i = 0; i < 16; i++) add(`left:${rnd(W * .2, W * .8)}px;top:${rnd(H * .3, H * .7)}px;font:700 18px var(--f-body);color:var(--moss);--anim:mkburst;--dur:1s;--del:${rnd(0, .3)}s;--dx:${rnd(-70, 70)}px;--dy:${rnd(-70, 70)}px`, '✦');
    }
    setTimeout(() => { if (fx) fx.innerHTML = ''; }, 4500);
  }

  /* ---------- Korsordsverkstan ---------- */
  function showShop() {
    view = 'shop'; stopTimer(); window.scrollTo(0, 0);
    if (!sess) { showHome(); toast('Logga in för att samla mynt och använda Korsordsverkstan.', 3500); return; }
    const e = save.equip;
    const demo = makePuzzle('latt', 7), dcells = Object.keys(demo.dig), run = new Set(demo.entries[0].cells);
    const cells = gridHTML(demo, { fill: (id) => (dcells.indexOf(id) % 3 !== 2 ? demo.dig[id] : ''), cls: (id) => (run.has(id) ? 'run' : '') + (id === demo.entries[0].cells[0] ? ' sel' : '') });
    $('app').innerHTML = `${head()}
<section class="panel">
  <div class="mk-bar"><h2>Korsordsverkstan</h2>${coins(save.mynt, 24)}</div>
  <p class="muted">Pimpa ditt korsord med mynten du tjänar. Lätt ger 3 mynt, Medel 6 och Svår 10. Felfritt ger hälften till. Dagens korsord ger 5 extra per nivå.</p>
  <div class="mk-wrap"><div class="kx-board ${lookClasses()}" id="grid" style="--S:${demo.S};--cs:min(48px, calc((100vw - 130px) / 5))">${cells}<div class="mk-fx" id="fx"></div></div></div>
  ${e.fest && owns(e.fest) ? '<div class="mk-center"><button class="btn ghost" data-a="preview">Visa firandet</button></div>' : ''}
</section>
<div class="mk-cats">${CATS.map(([cat, title, txt]) => `<section class="panel">
  <h2>${title}</h2><p class="muted small">${txt}</p>
  <div class="mk-items">${[{ id: '', cat, n: DEFAULTS[cat][0], d: DEFAULTS[cat][1], p: 0, sw: DEFAULTS[cat][2], fg: cat === 'penna' ? 'var(--gold)' : '' }].concat(SHOP.filter((x) => x.cat === cat)).map((it) => {
    const own = !it.id || owns(it.id), on = it.id ? e[cat] === it.id : !e[cat];
    let btn;
    if (own) btn = on ? '<button class="btn ghost" disabled>Används</button>' : `<button class="btn" data-a="equip" data-cat="${cat}" data-id="${it.id}">Använd</button>`;
    else btn = `<button class="btn" data-a="buy" data-id="${it.id}" ${save.mynt < it.p ? 'disabled' : ''}>Köp ${coinSVG(16)} ${it.p}</button>`;
    const sw = it.sw ? `<div class="mk-sw" style="background:${it.sw};${it.fg && it.fg !== 'linear' ? `color:${it.fg}` : ''}">${cat === 'penna' ? (it.fg === 'linear' ? '<span style="background:linear-gradient(90deg,#ff6b6b,#ffd166,#7ccf5a,#6ec6ff,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent">1 2 3</span>' : '1 2 3') : cat === 'tema' ? '7' : ''}</div>`
      : `<div class="mk-sw" style="background:var(--well);color:var(--gold)">${cat === 'fest' ? ({ 'fest-konfetti': '▮ ▮ ▮', 'fest-ballonger': '● ● ●', 'fest-kristaller': '◆ ◆ ◆', 'fest-fyrverkeri': '✺ ✺ ✺' }[it.id] || '✦') : ''}</div>`;
    return `<div class="mk-item${on && own ? ' on' : ''}">${sw}<h3>${esc(it.n)}</h3><p>${esc(it.d)}</p>${btn}</div>`;
  }).join('')}</div>
</section>`).join('')}</div>
<div class="mk-acts"><button class="btn ghost" data-a="home">Tillbaka till nivåerna</button></div>`;
  }
  function buy(id) {
    const it = item(id); if (!it || owns(id) || save.mynt < it.p) return;
    save.mynt -= it.p; save.owned.push(id);
    equip(it.cat, id, true);
    toast(`Du köpte <b>${esc(it.n)}</b>!`);
    if (it.cat === 'fest') setTimeout(celebrate, 150);
  }
  function equip(cat, id, quiet) {
    save.equip[cat] = id || '';
    store(); const y = window.scrollY; showShop(); window.scrollTo(0, y);
    if (!quiet) toast('Sparat.', 1200);
  }

  /* ---------- händelser ---------- */
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a],[data-lv],[data-daily]');
    if (!b) return;
    if (b.dataset.lv) return startPuzzle(b.dataset.lv, false);
    if (b.dataset.daily) return startPuzzle(b.dataset.daily, true);
    const a = b.dataset.a;
    if (a === 'home') showHome();
    else if (a === 'help') helpPanel();
    else if (a === 'check') check();
    else if (a === 'prev') pickEntry(P.ei - 1);
    else if (a === 'next') pickEntry(P.ei + 1);
    else if (a === 'hint') hint();
    else if (a === 'new') startPuzzle(P ? P.L.id : 'latt', false);
    else if (a === 'shop') showShop();
    else if (a === 'buy') buy(b.dataset.id);
    else if (a === 'equip') equip(b.dataset.cat, b.dataset.id);
    else if (a === 'preview') celebrate();
    else if (a === 'logout') { (async () => { clearTimeout(saveT); if (sess) await store(0, 0, true); await saveChain; await K.logout(); await useAccount(null); showHome(); toast('Du är utloggad.'); })(); }
    else if (a === 'reset') {
      if (b.dataset.sure) { save = norm(); store(); showHome(); toast('Allt är nollställt.'); }
      else { b.dataset.sure = '1'; b.textContent = 'Säker? Klicka igen för att nollställa'; }
    }
  });

  showHome();
  (async () => {
    if (!K || !K.session()) return;
    const s = await K.info();
    await useAccount(s);
    if (view === 'home') showHome();
  })();
  window.addEventListener('pagehide', () => { if (sess && saveT) { clearTimeout(saveT); store(0, 0, true); } });
})();
</script>
<script src="/statistik.js"></script>
</body>
</html>
