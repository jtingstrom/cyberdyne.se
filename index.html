<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyberdyne Spel</title>
<meta name="description" content="Gratis lärospel för mellanstadiet. Ett konto gäller i alla spel.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 7' shape-rendering='crispEdges'%3E%3Cpath fill='%230b0a10' d='M2 0h4v1h1v1h1v2H7v1H6v1H5v1H3V6H2V5H1V4H0V2h1V1h1z'/%3E%3Cpath fill='%23b58cff' d='M2 1h4v1h1v2H6v1H5v1H3V5H2V4H1V2h1z'/%3E%3Cpath fill='%23fff' d='M2 1h1v1H2zM1 2h1v1H1z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="stil.css">
<style>
  /* portalens egna delar; resten kommer från stil.css */
  .portal { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo h1 { font-size: clamp(2rem, 7vw, 3rem); }
  .acct { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
  .acct form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; width: 100%; }
  .acct .fld { flex: 1 1 140px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .game { display: flex; flex-direction: column; gap: 10px; background: var(--rock); border: 3px solid var(--edge); border-radius: 4px; box-shadow: inset 0 3px 0 var(--rock-3), 0 6px 0 var(--edge); padding: 18px; }
  .game.soon { background: var(--well); box-shadow: none; }
  .game-top { display: flex; align-items: center; gap: 12px; }
  .game h2 { font-size: 1.45rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: .8rem; font-weight: 800; background: var(--rock-2); border: 2px solid var(--edge); border-radius: 999px; padding: 2px 10px; }
  .game .btn { align-self: flex-start; margin-top: auto; }
  .boardwrap h2 { margin-bottom: 4px; }
</style>
</head>
<body>
<main class="portal" id="portal">
  <header class="logo">
    <svg width="64" height="56" viewBox="0 0 8 7" shape-rendering="crispEdges" aria-hidden="true"><path fill="#0b0a10" d="M2 0h4v1h1v1h1v2H7v1H6v1H5v1H3V6H2V5H1V4H0V2h1V1h1z"/><path fill="#b58cff" d="M2 1h4v1h1v2H6v1H5v1H3V5H2V4H1V2h1z"/><path fill="#fff" d="M2 1h1v1H2zM1 2h1v1H1z"/></svg>
    <div>
      <p class="eyebrow">Lärospel för mellanstadiet</p>
      <h1>Cyberdyne Spel</h1>
    </div>
  </header>
  <p class="lead">Gratis spel att träna med, utan reklam. Ett konto gäller i alla spel, så du loggar bara in en gång.</p>

  <section class="panel acct" id="acct" aria-live="polite"><p class="muted">Kollar inloggningen…</p></section>

  <section aria-labelledby="spelrubrik">
    <h2 id="spelrubrik" class="sr">Spel</h2>
    <div class="games" id="games"><p class="muted">Hämtar spel…</p></div>
  </section>

  <section class="panel boardwrap" id="board"></section>

  <footer class="foot">
    <span class="row"><a class="link" href="kristallgruvan/foraldrar.html">För föräldrar</a><a class="link" href="kristallgruvan/larare.html">För lärare</a></span>
    <span class="muted small">Kontakt: <a class="maillink" href="mailto:info@tingstrom.se">info@tingstrom.se</a></span>
  </footer>
</main>
<div id="toast" class="toast" role="status" aria-live="assertive"></div>

<script src="konto/config.js"></script>
<script src="konto/konto.js"></script>
<script src="portal.js"></script>
