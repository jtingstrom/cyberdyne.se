/* Layout: en smal kolumn som en gruvgång – hjälte överst, ett stenblock (panel) per steg. Medvetet ett enda mörkt tema: grottan. */
:root {
  --bg: #15131c;
  --rock: #221f2c;
  --rock-2: #2b2738;
  --rock-3: #3a3449;
  --edge: #0b0a10;
  --well: #100f16;
  --fg: #f1ecf8;
  --muted: #aaa2bf;
  --moss: #7ccf5a;
  --moss-d: #3f8a2a;
  --moss-ink: #10200a;
  --amethyst: #b58cff;
  --gold: #ffd166;
  --soft: #ff9f8a;
  --f-display: "KG Siffror", "Pixelify Sans", "Courier New", monospace;
  --f-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-body); font-size: 18px; line-height: 1.5;
  background-image: radial-gradient(var(--rock) 1.2px, transparent 1.6px), radial-gradient(var(--rock-2) 1px, transparent 1.4px);
  background-size: 28px 28px, 44px 44px; background-position: 0 0, 13px 19px;
}
#app { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 7vw, 3.2rem); letter-spacing: .01em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.eyebrow { font-family: var(--f-display); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.grow { flex: 1; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.panel { background: var(--rock); border: 3px solid var(--edge); border-radius: 4px; box-shadow: inset 0 3px 0 var(--rock-3), 0 6px 0 var(--edge); padding: 22px; display: flex; flex-direction: column; gap: 14px; }

.btn { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; color: var(--moss-ink); background: var(--moss); border: 3px solid var(--edge); border-radius: 4px; padding: 10px 18px; box-shadow: inset 0 -4px 0 var(--moss-d), 0 4px 0 var(--edge); cursor: pointer; transition: transform .06s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--moss-d), 0 1px 0 var(--edge); }
.btn.big { font-size: 1.35rem; padding: 14px 26px; align-self: flex-start; }
.btn.ghost { background: var(--rock-3); color: var(--fg); box-shadow: inset 0 -4px 0 var(--rock-2), 0 4px 0 var(--edge); }
.link { background: none; border: 0; color: var(--muted); font: inherit; font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 2px; }
.link:hover { color: var(--fg); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.mossa { position: relative; display: inline-block; width: 72px; flex: none; }
.mossa svg { width: 100%; height: auto; display: block; }
.mossa.big { width: 132px; }
.mossa.mid { width: 92px; }
.mossa.sleep svg { animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
.mossa.awake svg { animation: hop 1.1s ease-in-out infinite; }
.zzz { position: absolute; right: -6px; top: 6px; font-family: var(--f-display); color: var(--amethyst); font-size: 1rem; }
.zzz i, .zzz b { font-style: normal; font-weight: 700; display: inline-block; }
.zzz i { font-size: 1.25em; transform: translateY(-.4em); }
.zzz b { font-size: 1.55em; transform: translateY(-.9em); }
@keyframes breathe { 50% { transform: scaleY(.95); } }
@keyframes hop { 50% { transform: translateY(-6%); } }

.hero { display: flex; gap: 22px; align-items: center; padding-block: 18px 6px; }
.hero-txt { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lead { font-size: 1.1rem; max-width: 52ch; }
.hero.won h1 { color: var(--moss); }
.holdzone { display: inline-block; flex: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }

.kid-list { display: flex; flex-wrap: wrap; gap: 12px; }
.btn.kid { font-size: 1.3rem; }
.newkid { display: flex; flex-direction: column; gap: 10px; border-top: 3px dashed var(--rock-3); padding-top: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); flex: 1 1 160px; }
.fld.inline { flex-direction: row; align-items: center; gap: 10px; flex: none; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--well); border: 3px solid var(--edge); border-radius: 4px; padding: 10px 12px; box-shadow: inset 0 3px 0 rgba(0,0,0,.35); }
textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }

.intro { align-items: flex-start; }
.paper { display: flex; gap: 14px; align-items: center; background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 12px 14px; }
.paper svg { flex: none; }
.tips { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.tips li::marker { color: var(--gold); }

.maphead { display: flex; gap: 16px; align-items: center; }
.meter { height: 18px; background: var(--well); border: 3px solid var(--edge); border-radius: 3px; margin: 6px 0; overflow: hidden; }
.meter span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--amethyst) 0 10px, #9b6bff 10px 12px); transition: width .4s; }
.tunnels { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.tunnel { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left; padding: 14px; background: var(--rock); color: var(--fg); border: 3px solid var(--edge); border-radius: 4px; box-shadow: inset 0 3px 0 var(--rock-3), 0 4px 0 var(--edge); cursor: pointer; font: inherit; }
.tunnel .gem { grid-row: 1 / 3; }
.t-name { display: flex; flex-direction: column; font-weight: 800; line-height: 1.2; }
.t-name small { font-family: var(--f-display); font-weight: 500; color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.t-state { font-family: var(--f-display); font-size: .9rem; color: var(--moss); }
.tunnel:hover:not(:disabled) { background: var(--rock-2); }
.tunnel.next { border-color: var(--gold); }
.tunnel.next .t-state { color: var(--gold); }
.tunnel.done { cursor: default; background: var(--well); box-shadow: none; }
.tunnel.done .t-state { color: var(--muted); }
.gem.on { filter: drop-shadow(0 0 6px rgba(255,255,255,.18)); }

.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.qarea { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 1.05rem; }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 14px; height: 14px; background: var(--rock-3); border: 2px solid var(--edge); }
.dots i.maybe { opacity: .45; }
.dots i.now { background: var(--gold); opacity: 1; }
.dots i.ok { background: var(--moss); opacity: 1; }
.dots i.miss { background: var(--soft); opacity: 1; }
.qcard { padding: 26px 24px; }
.qtext { font-size: 1.45rem; font-weight: 700; line-height: 1.45; max-width: 40ch; }
.qtext.expr { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 800; font-variant-numeric: tabular-nums; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-size: .82em; margin: 0 .12em; }
.fr > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .18em .04em; }
.fr > span:last-child { padding-top: .04em; }
.ansform { display: flex; flex-direction: column; gap: 10px; }
.ansrow { display: flex; align-items: center; gap: 10px; }
#ans { font-size: 1.9rem; font-weight: 800; width: min(260px, 100%); padding: 10px 14px; font-variant-numeric: tabular-nums; }
.unit { font-size: 1.4rem; font-weight: 800; color: var(--muted); }
.choices { display: flex; flex-wrap: wrap; gap: 12px; }
.btn.choice { background: var(--rock-3); color: var(--fg); box-shadow: inset 0 -4px 0 var(--rock-2), 0 4px 0 var(--edge); font-family: var(--f-body); font-weight: 800; font-size: 1.6rem; min-width: 96px; padding: 12px 20px; }
.btn.choice:hover { background: #4a4260; }
.dunno { align-self: flex-start; }

.fig { display: block; width: 100%; max-width: 380px; height: auto; max-height: 260px; margin: 4px 0; }
.fig .shape { fill: rgba(181,140,255,.14); stroke: var(--fg); stroke-width: 2.5; }
.fig .fill { fill: var(--amethyst); stroke: var(--fg); stroke-width: 2; }
.fig .lbl { fill: var(--fg); font: 800 17px var(--f-body); }
.fig .tick { fill: var(--muted); font: 700 11px var(--f-body); }
.fig .grid { stroke: var(--rock-3); stroke-width: 1; }
.fig .grid2 { stroke: var(--rock-2); stroke-width: 1; }
.fig .ray { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
.fig .mark { fill: none; stroke: var(--gold); stroke-width: 2.5; }
.fig .dot { fill: var(--fg); }
.fig .dash { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 5; }

.found { align-items: center; text-align: center; }
.found .btn.big { align-self: center; }
.gemstage { padding: 10px; animation: shine 1.6s ease-in-out infinite; }
@keyframes shine { 50% { transform: translateY(-6px) scale(1.04); } }

.depth { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.depth li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px dashed var(--rock-3); flex-wrap: wrap; }
.depth li:last-child { border-bottom: 0; }
.d-name { font-weight: 800; }
.d-gems { display: inline-flex; gap: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; background: var(--rock-2); color: var(--fg); border: 3px solid var(--edge); border-radius: 4px; padding: 14px 22px; font-size: 1.15rem; box-shadow: 0 6px 0 var(--edge); transition: transform .18s, opacity .18s; max-width: calc(100% - 32px); text-align: center; z-index: 10; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: var(--moss); color: var(--moss-ink); }
.toast.good b { font-family: var(--f-display); }
.toast.soft b { color: var(--gold); font-family: var(--f-display); }

.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 18vh; }

/* föräldravy: lugnare, tabellorienterad */
.parent { display: flex; flex-direction: column; gap: 18px; }
.parent .panel { font-size: 16px; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.phead h1 { font-size: 2.2rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-weight: 700; color: var(--fg); background: var(--rock-2); border: 2px solid var(--edge); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip.on { background: var(--amethyst); color: var(--edge); }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
.big-v { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; }
.big-v small { font-family: var(--f-body); font-size: .9rem; color: var(--muted); }
.sw { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; border-top: 3px dashed var(--rock-3); padding-top: 14px; }
.sw ul { margin: 6px 0 0; padding-left: 1.1em; }
.tablewrap { overflow-x: auto; }
table { width: 100%; min-width: 540px; border-collapse: collapse; font-size: .95rem; }
table.ans { min-width: 640px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rock-3); vertical-align: top; }
th { font-family: var(--f-display); font-weight: 500; color: var(--muted); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
td .gem { vertical-align: -2px; margin-right: 4px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; font-size: .8rem; font-weight: 800; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--edge); white-space: nowrap; }
.pill.good { background: var(--moss); color: var(--moss-ink); }
.pill.mid { background: var(--gold); color: #2a1f00; }
.pill.low { background: var(--soft); color: #2a0d06; }
.pill.none { background: var(--rock-3); color: var(--muted); }
details { border-top: 1px solid var(--rock-3); padding: 10px 0; }
summary { cursor: pointer; font-weight: 800; }
table.ans tr.ok .mark { color: var(--moss); font-weight: 800; }
table.ans tr.miss .mark { color: var(--soft); font-weight: 800; }
#exportbox { display: flex; flex-direction: column; gap: 10px; }
#exportbox[hidden] { display: none; }


/* ---------- spelet ---------- */
.px { display: block; flex: none; image-rendering: pixelated; }
.hubtop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; }
.who { display: flex; align-items: center; gap: 14px; min-width: 0; }
.who h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); }
.statrow { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { display: inline-grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; background: var(--rock); border: 3px solid var(--edge); border-radius: 4px; padding: 6px 12px; box-shadow: 0 4px 0 var(--edge); }
.stat svg { grid-row: 1 / 3; }
.stat b { font-family: var(--f-display); font-size: 1.35rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: .72rem; line-height: 1.1; }
.stat.inline { box-shadow: none; padding: 4px 10px; display: inline-flex; gap: 6px; }
.dayrow, .eggrow { flex-direction: row; align-items: center; gap: 16px; }
.chest.ready { animation: wobble 1.4s ease-in-out infinite; }
@keyframes wobble { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-6deg); } 90% { transform: rotate(6deg); } }
.egg.cracked { animation: wobble 1s ease-in-out infinite; }
.meter.egg-m span { background: repeating-linear-gradient(90deg, #f3ead7 0 10px, #d8ccb4 10px 12px); }
.meter.thin { height: 10px; border-width: 2px; margin: 4px 0 0; }
.panel.note { padding: 12px 18px; border-color: var(--gold); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mode { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left; background: var(--rock); color: var(--fg); border: 3px solid var(--edge); border-radius: 4px; padding: 14px 16px; box-shadow: inset 0 3px 0 var(--rock-3), 0 5px 0 var(--edge); cursor: pointer; font: inherit; }
.mode > svg { grid-row: 1 / 3; }
.mode:hover { background: var(--rock-2); }
.mode:active { transform: translateY(3px); box-shadow: inset 0 3px 0 var(--rock-3), 0 2px 0 var(--edge); }
.m-t { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; }
.m-d { color: var(--muted); font-size: .88rem; }
.mode.main { grid-column: 1 / -1; grid-template-columns: 1fr; background: var(--moss); color: var(--moss-ink); box-shadow: inset 0 -5px 0 var(--moss-d), 0 5px 0 var(--edge); padding: 20px 22px; }
.mode.main .m-t { font-size: 2rem; }
.mode.main .m-d { color: var(--moss-ink); opacity: .8; }
.mode.main:hover { background: #8ad968; }
.mode.hot { border-color: var(--soft); }
.mode.done { opacity: .7; }
.navgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

<main id="app"></main>

<noscript><p style="padding:16px">Sidan behöver JavaScript.</p></noscript>

<script src="../konto/konto.js"></script>
<script>
/* =====================================================================
   KRISTALLGRUVAN – UPPGIFTSMOTOR (ren logik, inget DOM, ingen lagring)
   Kan återanvändas oförändrad i spelet och på en egen server.
   Nivåer: 1 = åk 3, 2 = åk 4, 3 = åk 5, 4 = åk 6, 5 = över åk 6
   ===================================================================== */
(function (root) {
  'use strict';

  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const P = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  const r6 = (x) => Math.round(x * 1e6) / 1e6;
  const fmt = (n) => {
    const x = r6(n);
    const neg = x < 0;
    const [i, d] = Math.abs(x).toString().split('.');
    const int = i.length > 4 ? i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : i;
    return (neg ? '−' : '') + int + (d ? ',' + d : '');
  };
  const NAMES = ['Ella', 'Leo', 'Maja', 'Noah', 'Alva', 'Elias', 'Saga', 'Hugo', 'Wilma', 'Liam', 'Ebba', 'Viggo', 'Nora', 'Theo'];

  const LEVEL_LABELS = ['under åk 3', 'åk 3', 'åk 4', 'åk 5', 'åk 6', 'över åk 6', 'åk 7–8'];
  const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const sup = (n) => String(n).split('').map((c) => SUP[+c]).join('');

  const AREAS = [
    { id: 'tal', name: 'Tal & positionssystem', gem: '#7fd1ff' },
    { id: 'addsub', name: 'Addition & subtraktion', gem: '#7ccf5a' },
    { id: 'tabell', name: 'Gångertabellerna', gem: '#ffd166' },
    { id: 'muldiv', name: 'Multiplikation & division', gem: '#ff9f5a' },
    { id: 'brak', name: 'Bråk', gem: '#ff7aa8' },
    { id: 'dec', name: 'Decimaltal & procent', gem: '#5ee0c0' },
    { id: 'geo', name: 'Geometri', gem: '#b58cff' },
    { id: 'mat', name: 'Mätning & tid', gem: '#f2f2f2' },
    { id: 'alg', name: 'Mönster & ekvationer', gem: '#6f8cff' },
    { id: 'stat', name: 'Statistik & sannolikhet', gem: '#e6c27a' },
    { id: 'prob', name: 'Problemlösning', gem: '#ff6b6b' },
  ];

  /* ---------- frågebyggare ---------- */
  // text: bråk skrivs som {3/4} och ritas staplade i gränssnittet
  function num(text, answer, o) { return Object.assign({ kind: 'num', text, answer: r6(answer) }, o || {}); }
  function frac(text, n, d, o) { return Object.assign({ kind: 'frac', text, answer: { n, d } }, o || {}); }
  function time(text, h, m, o) { return Object.assign({ kind: 'time', text, answer: { h: ((h % 24) + 24) % 24, m } }, o || {}); }
  function choice(text, correct, wrong, o) {
    o = o || {};
    const opts = o.fixedOrder ? o.fixedOrder : shuffle([correct].concat(wrong));
    const q = Object.assign({ kind: 'choice', text, choices: opts, answer: opts.indexOf(correct) }, o);
    delete q.fixedOrder;
    return q;
  }
  const pad = (n) => (n < 10 ? '0' : '') + n;

  /* ---------- figurer (SVG, färger via CSS-klasser) ---------- */
  const FIG = {
    rect(w, h) {
      const s = Math.min(200 / w, 120 / h), W = w * s, H = h * s, x = 70, y = 16;
      return `<svg class="fig" viewBox="0 0 ${W + 110} ${H + 56}" role="img" aria-label="Rektangel ${w} gånger ${h} cm">
<rect class="shape" x="${x}" y="${y}" width="${W}" height="${H}"/>
<text class="lbl" x="${x + W / 2}" y="${y + H + 28}" text-anchor="middle">${fmt(w)} cm</text>
<text class="lbl" x="${x - 10}" y="${y + H / 2 + 6}" text-anchor="end">${fmt(h)} cm</text></svg>`;
    },
    bar(n, k) {
      const W = 300, w = W / n;
      let r = '';
      for (let i = 0; i < n; i++) r += `<rect class="${i < k ? 'fill' : 'shape'}" x="${10 + i * w}" y="10" width="${w}" height="50"/>`;
      return `<svg class="fig" viewBox="0 0 320 70" role="img" aria-label="Stång i ${n} delar">${r}</svg>`;
    },
    angle(deg) {
      const cx = 150, cy = 150, L = 130, rad = (deg * Math.PI) / 180;
      const x2 = cx + L * Math.cos(rad), y2 = cy - L * Math.sin(rad);
      let mark;
      if (deg === 90) mark = `<path class="mark" d="M${cx + 22} ${cy} L${cx + 22} ${cy - 22} L${cx} ${cy - 22}"/>`;
      else { const r = 30; mark = `<path class="mark" d="M${cx + r} ${cy} A${r} ${r} 0 0 0 ${cx + r * Math.cos(rad)} ${cy - r * Math.sin(rad)}"/>`; }
      return `<svg class="fig" viewBox="0 0 300 170" role="img" aria-label="En vinkel"><line class="ray" x1="${cx}" y1="${cy}" x2="${cx + L}" y2="${cy}"/><line class="ray" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}"/>${mark}<circle class="dot" cx="${cx}" cy="${cy}" r="4"/></svg>`;
    },
    tri(b, h) {
      const s = Math.min(220 / b, 130 / h), B = b * s, H = h * s, x = 30, y = H + 16, ax = x + B * 0.35;
      return `<svg class="fig" viewBox="0 0 ${B + 120} ${H + 56}" role="img" aria-label="Triangel med basen ${b} cm och höjden ${h} cm">
<polygon class="shape" points="${x},${y} ${x + B},${y} ${ax},${y - H}"/>
<line class="dash" x1="${ax}" y1="${y - H}" x2="${ax}" y2="${y}"/>
<text class="lbl" x="${x + B / 2}" y="${y + 28}" text-anchor="middle">${b} cm</text>
<text class="lbl" x="${ax + 8}" y="${y - H / 2}">${h} cm</text></svg>`;
    },
    lshape(W, H, cw, ch) {
      const s = Math.min(200 / W, 140 / H), ox = 64, oy = 14, X = (v) => ox + v * s, Y = (v) => oy + v * s;
      const pts = [[0, 0], [W - cw, 0], [W - cw, ch], [W, ch], [W, H], [0, H]].map(([a, b]) => `${X(a)},${Y(b)}`).join(' ');
      return `<svg class="fig" viewBox="0 0 ${W * s + 130} ${H * s + 56}" role="img" aria-label="Sammansatt figur">
<polygon class="shape" points="${pts}"/>
<text class="lbl" x="${X(W / 2)}" y="${Y(H) + 28}" text-anchor="middle">${W} cm</text>
<text class="lbl" x="${X(0) - 10}" y="${Y(H / 2) + 6}" text-anchor="end">${H} cm</text>
<text class="lbl" x="${X(W - cw / 2)}" y="${Y(ch) - 8}" text-anchor="middle">${cw} cm</text>
<text class="lbl" x="${X(W - cw) - 8}" y="${Y(ch / 2) + 6}" text-anchor="end">${ch} cm</text></svg>`;
    },
    bars(cats, vals) {
      const x0 = 34, x1 = 300, y0 = 170, top = 14, max = 12, step = (y0 - top) / max, bw = (x1 - x0) / cats.length;
      let g = '';
      for (let v = 0; v <= max; v++) {
        g += `<line class="${v % 2 ? 'grid2' : 'grid'}" x1="${x0}" y1="${y0 - v * step}" x2="${x1}" y2="${y0 - v * step}"/>`;
        if (v % 2 === 0) g += `<text class="tick" x="${x0 - 6}" y="${y0 - v * step + 4}" text-anchor="end">${v}</text>`;
      }
      cats.forEach((c, i) => {
        const h = vals[i] * step, x = x0 + i * bw + bw * 0.2;
        g += `<rect class="fill" x="${x}" y="${y0 - h}" width="${bw * 0.6}" height="${h}"/>`;
        g += `<text class="tick" x="${x + bw * 0.3}" y="${y0 + 18}" text-anchor="middle">${c}</text>`;
      });
      return `<svg class="fig" viewBox="0 0 310 196" role="img" aria-label="Stapeldiagram">${g}</svg>`;
    },
  };

  /* ---------- mallar per område och nivå ---------- */
  function digitValue(min, max, places) {
    for (;;) {
      const n = R(min, max), s = String(n), pl = P(places);
      const idx = s.length - 1 - Math.log10(pl);
      const d = Number(s[idx]);
      if (d === 0) continue;
      if (s.split('').filter((c) => c === s[idx]).length > 1) continue;
      return num(`Vilket värde har siffran <b>${d}</b> i talet <b>${fmt(n)}</b>?`, d * pl, { skill: 'siffrans värde' });
    }
  }

  const T = {
    tal: {
      1: [() => digitValue(100, 999, [10, 100]),
          () => { const n = R(120, 980), k = P([10, 100]); return num(`Vilket tal är ${k} mer än ${fmt(n)}?`, n + k, { skill: 'räkna med 10 och 100' }); }],
      2: [() => digitValue(10000, 99999, [100, 1000, 10000]),
          () => { let n = R(1000, 9999); if (n % 100 === 50) n++; return num(`Avrunda ${fmt(n)} till närmaste hundratal.`, Math.round(n / 100) * 100, { skill: 'avrundning' }); }],
      3: [() => { const n = R(10, 99) * 10000 + R(0, 999); return num(`Vilket tal är 1 000 mindre än ${fmt(n)}?`, n - 1000, { skill: 'stora tal, växling' }); },
          () => { const a = R(1, 9), b = P([R(1, 9) * 10, R(1, 9)]), c = R(1, 9); return num(`Skriv med siffror: <b>${a} ${a === 1 ? 'miljon' : 'miljoner'} ${b} tusen ${c}</b>`, a * 1e6 + b * 1000 + c, { skill: 'tal till miljoner' }); }],
      4: [() => { const t = -R(2, 9), u = R(-t + 1, 15); return num(`Termometern visar ${fmt(t)} °C. Temperaturen stiger ${u} grader. Vad visar termometern nu?`, t + u, { unit: '°C', skill: 'negativa tal' }); },
          () => { const x = R(101, 999) / 100, m = P([10, 100]); return num(`Vad är ${m} · ${fmt(x)}?`, x * m, { skill: 'multiplikation med 10 och 100' }); },
          () => { for (;;) { const a = R(1, 9), d1 = R(1, 9), d2 = R(1, 9), d3 = R(1, 9); const ds = [d1, d2, d3]; const pos = R(0, 1); const d = ds[pos]; if (ds.filter((x) => x === d).length > 1 || d === a) continue; const x = a + d1 / 10 + d2 / 100 + d3 / 1000; return num(`Vilket värde har siffran <b>${d}</b> i talet <b>${fmt(x)}</b>?`, d / (pos ? 100 : 10), { skill: 'decimala positioner' }); } }],
      5: [() => { for (;;) { const a = -R(2, 12), b = R(4, 20); if ((a + b) % 2) continue; return num(`Vilket tal ligger mitt emellan ${fmt(a)} och ${fmt(b)} på tallinjen?`, (a + b) / 2, { skill: 'tallinje, negativa tal' }); } },
          () => { const x = R(1, 9) + R(1, 99) / 100; return num(`Hur många hundradelar är ${fmt(x)}?`, Math.round(x * 100), { skill: 'decimala positioner' }); },
          () => { const n = R(2, 999); return num(`Vad är ${fmt(n)} / 1 000?`, n / 1000, { skill: 'division med 1 000' }); }],
    },
    addsub: {
      1: [() => { for (;;) { const a = R(25, 69), b = R(15, 29); if (a % 10 + b % 10 >= 10) return num(`${a} + ${b}`, a + b, { skill: 'tiotalsövergång' }); } },
          () => { for (;;) { const a = R(41, 95), b = R(12, a - 10); if (a % 10 < b % 10) return num(`${a} − ${b}`, a - b, { skill: 'subtraktion med växling' }); } }],
      2: [() => { const a = R(150, 599), b = R(150, 399); return num(`${a} + ${b}`, a + b, { skill: 'tresiffrig addition' }); },

      2: [() => { const n = P(NAMES), p = R(4, 8), k = R(4, 9), g = R(3, p * k - 5); return num(`Ett paket samlarkort innehåller ${p} kort. ${n} köper ${k} paket och ger bort ${g} kort. Hur många kort har ${n} kvar?`, p * k - g, { skill: 'textuppgift, två steg' }); },
          () => { const n = P(NAMES), k = R(3, 6), q = R(4, 12); return num(`${n} och ${k - 1} kompisar delar lika på ${k * q} smaragder. Hur många smaragder får var och en?`, q, { skill: 'delning' }); }],
      3: [() => { const A = R(12, 24) * 5, C = R(6, Math.floor(A / 5) - 1) * 5, na = R(1, 3), nc = R(2, 4); return num(`En biobiljett kostar ${A} kr för vuxna och ${C} kr för barn. Vad kostar det för ${na} ${na === 1 ? 'vuxen' : 'vuxna'} och ${nc} barn?`, na * A + nc * C, { unit: 'kr', skill: 'textuppgift, flera steg' }); },
          () => { const n = P(NAMES), c = R(15, 55), k = R(2, 3); return num(`${n} köper ${k} böcker som kostar ${c} kr styck och betalar med en 200-lapp. Hur mycket får ${n} tillbaka?`, 200 - k * c, { unit: 'kr', skill: 'växel' }); }],
      4: [() => { const price = R(8, 40) * 20, p = P([10, 25, 50]); return num(`En tröja kostar ${price} kr. Den sänks med ${p} %. Vad kostar tröjan nu?`, (price * (100 - p)) / 100, { unit: 'kr', skill: 'procent, rabatt' }); },
          () => { const persons = P([3, 4, 6]), pizzas = R(2, 4), price = R(15, 30) * persons; return num(`${persons} kompisar köper ${pizzas} pizzor för ${price} kr styck och delar lika på notan. Hur mycket betalar var och en?`, (pizzas * price) / persons, { unit: 'kr', skill: 'textuppgift, flera steg' }); },
          () => { const d = R(2, 5), t = 10 * R(1, 6); return num(`En kran droppar ${d} dl vatten per minut. Hur många liter har droppat efter ${t} minuter?`, (d * t) / 10, { unit: 'liter', skill: 'enheter i problem' }); }],
      5: [() => { const big = R(20, 60), small = R(5, big - 4); return num(`Två tal har summan ${big + small} och skillnaden ${big - small}. Vilket är det största talet?`, big, { skill: 'resonemang, två villkor' }); },
          () => { const k = P([2, 3, 4]), b = R(3, 8), word = { 2: 'dubbelt', 3: 'tre gånger', 4: 'fyra gånger' }[k]; return num(`Maja är ${word} så gammal som sin lillebror. Tillsammans är de ${(k + 1) * b} år. Hur gammal är Maja?`, k * b, { unit: 'år', skill: 'resonemang, delar' }); }],
    },
  };

  /* ---------- nivå 6: åk 7–8 (används i spelet, inte i kartläggningen) ---------- */
  T.tal[6] = [
    () => { const b = P([2, 3, 10]), e = b === 10 ? R(3, 6) : b === 2 ? R(4, 7) : R(2, 4); return num(`Vad är ${b}${sup(e)}?`, b ** e, { skill: 'potenser' }); },
    () => { const a = R(2, 9), b = R(2, 9), sa = P([-1, 1]), sb = sa === 1 ? -1 : P([-1, 1]); return num(`${sa < 0 ? '(−' + a + ')' : a} · ${sb < 0 ? '(−' + b + ')' : b}`, sa * a * sb * b, { skill: 'negativa tal, multiplikation' }); },
    () => { const x = R(11, 99) / 10, e = R(2, 4); return num(`Skriv ${fmt(x)} · 10${sup(e)} som ett vanligt tal.`, x * 10 ** e, { skill: 'tiopotenser' }); },
  ];
  T.addsub[6] = [
    () => { const a = R(11, 59) / 10, b = R(101, 999) / 100, c = R(5, 15); return num(`−${fmt(a)} + ${fmt(b)} − ${c}`, -a + b - c, { skill: 'negativa decimaltal' }); },
    () => { const a = R(5, 20), b = R(2, a - 1); return num(`(−${a}) − (−${b})`, -a + b, { skill: 'subtrahera negativa tal' }); },
  ];
  T.tabell[6] = [
    () => { const a = R(13, 19), b = R(4, 9); return num(`${a} · ${b}`, a * b, { skill: 'tabell 13–19' }); },
    () => { const a = R(11, 20); return num(`Vilket positivt tal gånger sig självt blir ${a * a}?`, a, { skill: 'kvadrattal' }); },
  ];
  T.muldiv[6] = [
    () => { const a = R(120, 480), b = R(21, 48); return num(`${a} · ${b}`, a * b, { skill: 'flersiffrig multiplikation' }); },
    () => { const d = R(2, 9) / 100, q = R(3, 12); return num(`${fmt(r6(d * q))} / ${fmt(d)}`, q, { skill: 'division med decimaltal' }); },
  ];
  T.brak[6] = [
    () => { const [a, b, c, d] = P([[2, 3, 3, 4], [1, 2, 2, 5], [3, 4, 2, 3], [2, 5, 5, 6], [3, 8, 4, 9], [4, 5, 1, 2]]); const n = a * c, m = b * d, g = gcd(n, m); return frac(`{${a}/${b}} · {${c}/${d}}`, n / g, m / g, { skill: 'multiplikation av bråk' }); },
    () => { const w1 = R(1, 3), w2 = R(1, 3); const [n1, d1, n2, d2] = P([[1, 2, 3, 4], [1, 3, 1, 2], [2, 3, 1, 6], [1, 4, 1, 2], [3, 4, 1, 2]]); const n = (w1 * d1 + n1) * d2 + (w2 * d2 + n2) * d1, m = d1 * d2, g = gcd(n, m); return frac(`${w1}{${n1}/${d1}} + ${w2}{${n2}/${d2}}`, n / g, m / g, { skill: 'blandad form' }); },
    () => { const [a, b, c, d] = P([[3, 4, 1, 2], [2, 3, 1, 6], [5, 6, 1, 3], [1, 2, 1, 4], [4, 5, 2, 5]]); const n = a * d, m = b * c, g = gcd(n, m); return frac(`{${a}/${b}} / {${c}/${d}}`, n / g, m / g, { skill: 'division med bråk' }); },
  ];
  T.dec[6] = [
    () => { const old = R(4, 20) * 20, p = P([10, 20, 25, 50]); return num(`Priset höjs från ${old} kr till ${old * (100 + p) / 100} kr. Med hur många procent höjdes priset?`, p, { unit: '%', skill: 'procentuell förändring' }); },
    () => { const p = P([15, 35, 45]), N = 20 * R(3, 25); return num(`Vad är ${p} % av ${N}?`, (p * N) / 100, { skill: 'procent av' }); },
    () => { let n = R(101, 999); if (n % 10 === 5) n++; return num(`Avrunda ${fmt(n / 1000)} till två decimaler.`, Math.round(n / 10) / 100, { skill: 'avrundning decimaltal' }); },
  ];
  T.geo[6] = [
    () => { const d = R(2, 20); return num(`En cirkel har diametern ${d} cm. Vad är omkretsen? Räkna med π ≈ 3,14.`, 3.14 * d, { unit: 'cm', skill: 'cirkelns omkrets' }); },
    () => { const [a, b, c] = P([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [9, 12, 15]]); return num(`En rätvinklig triangel har kateterna ${a} cm och ${b} cm. Hur lång är hypotenusan?`, c, { unit: 'cm', skill: 'Pythagoras sats' }); },
    () => { const b = R(4, 12), h = R(3, 9); return num(`Ett parallellogram har basen ${b} cm och höjden ${h} cm. Vad är arean?`, b * h, { unit: 'cm²', skill: 'parallellogram' }); },
  ];
  T.mat[6] = [
    () => { const a = R(2, 9); return num(`Hur många liter är ${a} m³?`, 1000 * a, { unit: 'liter', skill: 'volymenheter' }); },
    () => { const v = P([36, 54, 72, 90, 108]); return num(`En bil kör ${v} km/h. Hur många meter per sekund är det?`, v / 3.6, { unit: 'm/s', skill: 'enhetsbyte fart' }); },
    () => { const a = R(2, 9); return num(`Hur många kubikcentimeter är ${a} dm³?`, 1000 * a, { unit: 'cm³', skill: 'volymenheter' }); },
  ];
  T.alg[6] = [
    () => { for (;;) { const m = R(2, 4), k = R(1, 6), x = R(3, 12), c = R(1, m - 1), r = m * (x - k) - c * x; if (r <= 0) continue; return num(`${m}(x − ${k}) = ${c === 1 ? '' : c}x + ${r}. Vad är x?`, x, { skill: 'ekvation med parentes' }); } },
    () => { const x = R(2, 6), a = R(2, 4); return num(`Vad är värdet av ${a}x² om x = ${x}?`, a * x * x, { skill: 'potensuttryck' }); },
    () => { const a = R(2, 5), b = R(1, 6), c = R(1, a - 1), d = R(1, 6), x = R(2, 9); return num(`Förenkla ${a}x + ${b} − ${c === 1 ? '' : c}x + ${d} och räkna ut värdet när x = ${x}.`, (a - c) * x + b + d, { skill: 'förenkla uttryck' }); },
  ];
  T.stat[6] = [
    () => { const [t, k] = P([['båda visar sexa', 1], ['summan blir 11', 2], ['summan blir 3', 2], ['summan blir 7', 6]]); return frac(`Du slår två vanliga tärningar. Hur stor är chansen att ${t}? Svara med ett bråk.`, k, 36, { skill: 'sannolikhet, två händelser' }); },
    () => { for (;;) { const m = R(6, 15), rem = R(2, 30), nm = (5 * m - rem) / 4; if (!Number.isInteger(nm) || nm <= 0) continue; return num(`Medelvärdet av 5 tal är ${m}. Talet ${rem} tas bort. Vad blir medelvärdet av de 4 tal som är kvar?`, nm, { skill: 'medelvärde' }); } },
    () => { const v = Array.from({ length: 6 }, () => R(1, 20)), s = v.slice().sort((a, b) => a - b); return num(`Vad är medianen? &nbsp;${v.join(', ')}`, (s[2] + s[3]) / 2, { skill: 'median, jämnt antal' }); },
  ];
  T.prob[6] = [
    () => { const v = R(4, 12) * 10, t = R(2, 4), t2 = R(5, 8); return num(`Ett tåg kör ${v * t} km på ${t} timmar. Hur långt kör det på ${t2} timmar med samma fart?`, v * t2, { unit: 'km', skill: 'proportionalitet' }); },
    () => { const p = P([20, 25, 10]), orig = R(6, 30) * 20; return num(`Efter ${p} % rabatt kostar jackan ${orig * (100 - p) / 100} kr. Vad kostade jackan från början?`, orig, { unit: 'kr', skill: 'procent baklänges' }); },
    () => { const k = R(3, 6), price = R(4, 12), m = R(7, 12); return num(`${k} pennor kostar ${k * price} kr. Vad kostar ${m} pennor?`, m * price, { unit: 'kr', skill: 'proportionalitet' }); },
  ];

  function generate(areaId, level, avoid) {
    const pool = T[areaId][level];
    for (let i = 0; i < 25; i++) {
      const q = P(pool)();
      if (!avoid || !avoid.has(plain(q.text))) { q.area = areaId; q.level = level; return q; }
    }
    const q = P(pool)(); q.area = areaId; q.level = level; return q;
  }

  /* ---------- rättning ---------- */
  function parseNum(raw) {
    let s = String(raw).trim().replace(/[−–]/g, '-').replace(/[\s ]/g, '').replace(/[a-zA-ZåäöÅÄÖ°%²³]+\.?$/, '').replace(',', '.');
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null;
    return Number(s);
  }
  function parseFrac(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-').replace(',', '.');
    let m = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (m) { const w = +m[1], n = +m[2], d = +m[3]; if (!d) return null; return { value: w + n / d, n: w * d + n, d }; }
    m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
    if (m) { const n = +m[1], d = +m[2]; if (!d) return null; return { value: n / d, n, d }; }
    const v = parseNum(s); return v === null ? null : { value: v, n: null, d: null };
  }
  function check(q, raw) {
    if (raw === null || raw === undefined || String(raw).trim() === '') return false;
    if (q.kind === 'choice') return Number(raw) === q.answer;
    if (q.kind === 'num') { const v = parseNum(raw); return v !== null && Math.abs(v - q.answer) < 1e-9; }
    if (q.kind === 'frac') {
      const f = parseFrac(raw); if (!f) return false;
      const ok = Math.abs(f.value - q.answer.n / q.answer.d) < 1e-9;
      if (!ok) return false;
      if (q.simplest) return f.n !== null && f.n === q.answer.n && f.d === q.answer.d;
      return true;
    }
    if (q.kind === 'time') {
      const m = String(raw).trim().match(/^(\d{1,2})\s*[:.]\s*(\d{2})$/);
      return !!m && (+m[1] % 24) === q.answer.h && +m[2] === q.answer.m;
    }
    return false;
  }
  function answerText(q) {
    if (q.kind === 'choice') return plain(q.choices[q.answer]);
    if (q.kind === 'frac') return q.answer.n + '/' + q.answer.d;
    if (q.kind === 'time') return pad(q.answer.h) + ':' + pad(q.answer.m);
    return fmt(q.answer) + (q.unit ? ' ' + q.unit : '');
  }
  function plain(text) {
    return String(text).replace(/\{([^}]+)\}/g, ' $1 ').replace(/&nbsp;/g, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  }

  /* ---------- adaptiv logik ---------- */
  const MIN_Q = 4, MAX_Q = 5;
  function startLevel(grade) { return Math.max(1, Math.min(5, (Number(grade) || 4) - 2)); }
  function nextLevel(level, ok) { return ok ? Math.min(5, level + 1) : Math.max(1, level - 1); }
  function areaDone(asked) {
    if (asked.length >= MAX_Q) return true;
    if (asked.length < MIN_Q) return false;
    const a = asked[asked.length - 1], b = asked[asked.length - 2];
    return a.ok === b.ok; // två senaste pekar åt samma håll -> klart
  }
  function estimate(asked) {
    if (!asked || !asked.length) return null;
    let best = 0;
    for (let L = 1; L <= 5; L++) {
      const at = asked.filter((x) => x.level === L), c = at.filter((x) => x.ok).length;
      if (c > 0 && c >= at.length - c) best = L;
    }
    const atBest = asked.filter((x) => x.level === best);
    const correct = asked.filter((x) => x.ok).length;
    const ms = asked.filter((x) => x.ms).map((x) => x.ms);
    return {
      level: best,
      label: LEVEL_LABELS[best],
      secure: best > 0 && atBest.every((x) => x.ok),
      correct, total: asked.length,
      avgMs: ms.length ? Math.round(ms.reduce((a, b) => a + b, 0) / ms.length) : null,
    };
  }

  root.KGQ = { AREAS, LEVEL_LABELS, MAX_LEVEL: 6, generate, check, answerText, plain, fmt, startLevel, nextLevel, areaDone, estimate, _T: T };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
   KRISTALLGRUVAN – SPELMOTOR (ren logik, inget DOM, ingen lagring)
   Spelardokument (schema 'kristallgruvan-spel/1'):
   { kidId, familyId, crystals, totalCorrect, totalAnswered,
     skills: { [area]: { level, recent: [0|1] } }, focus: [area], disabled: [area],
     dailyGoalMin, egg: { progress }, creatures: { [id]: { xp, stage, at } },
     inventory: { [blockId]: n }, base: { w, h, cells: [''|blockId|'c:'+creatureId] },
     streak: { count, last, freezes }, chestDay, bossWeek, raceBest,
     medals: { [id]: isoDate }, today: { day, ms, rounds },
     requests: [{ id, rewardId, name, cost, at, status }], stats: {...} }
   ===================================================================== */
(function (root) {
  'use strict';
  const Q = root.KGQ;
  const MAX = 6;
  const AREA_IDS = Q.AREAS.map((a) => a.id);
  const rnd = Math.random;

  /* ---------- datum ---------- */
  const z = (n) => String(n).padStart(2, '0');
  function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function daysBetween(a, b) { return Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5); }
  function weekKey(d) {
    d = d ? new Date(d) : new Date();
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return t.getUTCFullYear() + '-v' + z(Math.ceil(((t - y0) / 864e5 + 1) / 7));
  }

  /* ---------- varelser (egna, påhittade) ---------- */
  const CREATURE_NAMES = {
    tal: ['Siffrik', 'Nollo', 'Miljonix'], addsub: ['Plusse', 'Minuset', 'Växlo'], tabell: ['Tabbe', 'Gångis', 'Rutan'],
    muldiv: ['Delbert', 'Multo', 'Kvotis'], brak: ['Bråkis', 'Halvan', 'Nämnis'], dec: ['Decimo', 'Kommis', 'Procentina'],
    geo: ['Vinkla', 'Kuben', 'Pyra'], mat: ['Metra', 'Klockis', 'Litro'], alg: ['Mönstra', 'Ekvo', 'Gåtan'],
    stat: ['Staplo', 'Medelix', 'Tärnis'], prob: ['Klurix', 'Ledtråd', 'Lösaren'],
  };
  const CREATURES = [];
  AREA_IDS.forEach((area, ai) => CREATURE_NAMES[area].forEach((name, k) => CREATURES.push({ id: area + '-' + k, name, area, seed: ai * 31 + k * 7 + 3 })));
  const STAGE_XP = [0, 0, 20, 60]; // steg 2 vid 20 xp, steg 3 vid 60

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  // 12x12 rutnät. K kontur, B kropp, L ljus, D mörk, A fläckar, W/E ögon, P kristall
  function creatureGrid(seed, stage) {
    const r = mulberry32(seed * 9973 + 17), W = 12, H = 12;
    const g = Array.from({ length: H }, () => Array(W).fill('.'));
    for (let y = 2; y <= 10; y++) for (let x = 0; x < 6; x++) {
      const dx = (5.5 - x) / 5, dy = (y - 6.5) / 4.3, e = dx * dx + dy * dy;
      if (e < 0.72 || (e < 1.05 && r() < 0.5)) { g[y][x] = 'B'; g[y][W - 1 - x] = 'B'; }
    }
    for (let y = 2; y <= 10; y++) { const l = g[y].indexOf('B'); if (l >= 0) for (let x = l; x < W - l; x++) g[y][x] = 'B'; } // inga hål
    for (let y = 4; y <= 8; y++) for (let x = 3; x <= 8; x++) g[y][x] = 'B';
    if (r() < 0.6) { const ex = 1 + Math.floor(r() * 3); g[1][ex] = g[2][ex] = 'B'; g[1][W - 1 - ex] = g[2][W - 1 - ex] = 'B'; } // öron
    g[11][3] = g[11][8] = 'D'; if (r() < 0.5) { g[11][4] = g[11][7] = 'D'; }
    const r2 = mulberry32(seed * 7 + 5);
    for (let y = 0; y < H; y++) for (let x = 0; x < W / 2; x++) {
      if (g[y][x] !== 'B') continue;
      if (y > 0 && g[y - 1][x] === '.') g[y][x] = g[y][W - 1 - x] = 'L';
      else if (y < H - 1 && (g[y + 1][x] === '.' || g[y + 1][x] === 'D')) g[y][x] = g[y][W - 1 - x] = 'D';
      else if (stage >= 2 && r2() < 0.22 && !(y >= 5 && y <= 6)) g[y][x] = g[y][W - 1 - x] = 'A';
    }
    const ey = 5, ex = r() < 0.5 ? 3 : 4;
    g[ey][ex] = g[ey][W - 1 - ex] = 'W'; g[ey + 1][ex] = g[ey + 1][W - 1 - ex] = 'E';
    if (r() < 0.6) { g[8][5] = g[8][6] = 'E'; }
    if (stage >= 3) { g[0][5] = g[0][6] = 'P'; g[1][5] = g[1][6] = 'P'; if (g[0][4] === '.') g[0][4] = 'p'; if (g[0][7] === '.') g[0][7] = 'p'; }
    const out = g.map((row) => row.slice());
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (g[y][x] !== '.') continue;
      const n = [[0, 1], [1, 0], [0, -1], [-1, 0]].some(([a, b]) => { const c = g[y + a] && g[y + a][x + b]; return c && c !== '.' && c !== 'p' && c !== 'P'; });
      if (n) out[y][x] = 'K';
    }
    return out.map((row) => row.join(''));
  }

  /* ---------- byggblock ---------- */
  const BLOCKS = [
    { id: 'jord', name: 'Jord', cost: 1 }, { id: 'sten', name: 'Sten', cost: 1 }, { id: 'gras', name: 'Gräs', cost: 2 },
    { id: 'tra', name: 'Plankor', cost: 2 }, { id: 'tegel', name: 'Tegel', cost: 3 }, { id: 'glas', name: 'Glas', cost: 4 },
    { id: 'fackla', name: 'Fackla', cost: 5 }, { id: 'blomma', name: 'Blomma', cost: 5 }, { id: 'vatten', name: 'Vatten', cost: 6 },
    { id: 'svamp', name: 'Svamp', cost: 6 }, { id: 'kista', name: 'Kista', cost: 12 }, { id: 'lampa', name: 'Kristallampa', cost: 15 },
    { id: 'guld', name: 'Guldblock', cost: 30 }, { id: 'diamant', name: 'Diamantblock', cost: 50 },
  ];
  const FREEZE_COST = 40, MAX_FREEZES = 2, EXPAND_COST = 120, MAX_W = 16;

  /* ---------- medaljer ---------- */
  const owned = (p) => Object.keys(p.creatures || {}).length;
  const MEDALS = [
    { id: 'forsta', name: 'Första turen', desc: 'Gör din första gruvtur', test: (p) => p.stats.rounds >= 1 },
    { id: 'rätt100', name: 'Hundra rätt', desc: '100 rätta svar', test: (p) => p.totalCorrect >= 100 },
    { id: 'rätt500', name: 'Femhundra rätt', desc: '500 rätta svar', test: (p) => p.totalCorrect >= 500 },
    { id: 'rätt1000', name: 'Tusen rätt', desc: '1 000 rätta svar', test: (p) => p.totalCorrect >= 1000 },
    { id: 'svit3', name: 'Tre dagar', desc: 'Spela 3 dagar i rad', test: (p) => p.streak.count >= 3 },

    const list = pool.length ? pool : enabledAreas(p);
    const w = list.map((a) => (p.focus.includes(a) ? 3 : 1));

      else { area = pickArea(p, counts); level = pickLevel(p.skills[area]); }
      counts[area] = (counts[area] || 0) + 1;

  }

  ${eggSVG(64, p.egg.progress >= need * 0.7)}
  <div class="grow"><p><b>Ägget kläcks om ${need - p.egg.progress} rätta svar</b></p><div class="meter egg-m"><span style="width:${(p.egg.progress / need) * 100}%"></span></div><p class="muted small">${E.owned(p)} av ${E.CREATURES.length} varelser hittade</p></div>`}
</section>
${pending.length ? `<section class="panel note"><p><b>Väntar på en vuxen:</b> ${pending.map((r) => esc(r.name)).join(', ')}</p></section>` : ''}
<section class="modes">
  <button class="mode main" data-g="go-tur"><span class="m-t">Gruvtur</span><span class="m-d">8 uppgifter · cirka 5 min</span></button>
  <button class="mode" data-g="go-race">${tileSVG('tra', 30)}<span class="m-t">Vagnrace</span><span class="m-d">60 sekunder tabeller${p.raceBest ? ` · rekord ${p.raceBest}` : ''}</span></button>
  <button class="mode${bossDone ? ' done' : ' hot'}" data-g="go-boss">${creatureSVG({ seed: 777, area: 'geo' }, 3, 30, false)}<span class="m-t">Veckoboss</span><span class="m-d">${bossDone ? 'Besegrad! Ny boss på måndag.' : '5 kluriga uppgifter · +60'}</span></button>
  <button class="mode" data-g="pick-area">${tileSVG('lampa', 30)}<span class="m-t">Träna ett område</span><span class="m-d">Välj själv vad du vill öva på</span></button>
  ${ctx.publicMode ? `<button class="mode" data-act="board">${tileSVG('diamant', 30)}<span class="m-t">Topplista</span><span class="m-d">Veckans poäng, vagnrace och all-time</span></button>` : ''}
</section>
<nav class="navgrid">
  <button class="nav" data-g="collection">${creatureSVG(E.CREATURES[0], 2, 34, E.owned(p) === 0)}<span>Samling</span><small>${E.owned(p)}/${E.CREATURES.length}</small></button>
  <button class="nav" data-g="base">${tileSVG('tegel', 34)}<span>Min bas</span><small>bygg</small></button>
  <button class="nav" data-g="shop">${tileSVG('guld', 34)}<span>Butik</span><small>handla</small></button>
  <button class="nav" data-g="medals">${medalSVG(true, 34)}<span>Medaljer</span><small>${Object.keys(p.medals).length}/${E.MEDALS.length}</small></button>
</nav>
<footer class="foot">
  <button class="link" data-act="home">${ctx.publicMode ? 'Logga ut' : 'Byt spelare'}</button>
  ${ctx.publicMode ? '<button class="link" data-act="code">Mitt konto</button>' : '<button class="link" data-g="test">Kartläggning</button>'}
</footer>`);
    }

    function showAreaPicker() {
      view(`
<header class="subhead"><button class="link" data-g="hub">Tillbaka</button><h2>Träna ett område</h2></header>
<section class="tunnels">
  ${Q.AREAS.filter((a) => !player.disabled.includes(a.id)).map((a) => `<button class="tunnel" data-g="go-area" data-id="${a.id}">${gemSVG(a.gem, true, 30)}<span class="t-name"><small>${esc(Q.LEVEL_LABELS[player.skills[a.id].level])}</small>${esc(a.name)}</span><span class="t-state">${player.focus.includes(a.id) ? 'Fokus' : 'Träna'}</span></button>`).join('')}
</section>`);
    }

    /* ---------- runda ---------- */
    function startRound(mode, areaId) {
      if (mode === 'boss' && player.bossWeek === E.weekKey()) { toast('Veckobossen är redan besegrad. En ny kommer på måndag!', 'note'); return; }
      R = { mode, areaId, qs: E.buildRound(player, mode, areaId), i: 0, results: [], earned: 0, combo: 0, levels: [], hatched: [], evolved: [], waiting: false };
      R.shownAt = Date.now();
      renderQ();
    }
    function roundTitle() { return R.mode === 'boss' ? 'Veckoboss' : R.mode === 'omrade' ? areaName(R.areaId) : 'Gruvtur'; }
    function renderQ(feedback) {
      const q = R.qs[R.i], n = R.qs.length;
      const dots = R.qs.map((_, i) => `<i class="${i < R.results.length ? (R.results[i] ? 'ok' : 'miss') : i === R.i ? 'now' : ''}"></i>`).join('');
      const bossHp = R.mode === 'boss' ? Math.max(0, 3 - R.results.filter(Boolean).length) : 0;
      let input;
      if (feedback) {
        input = `<div class="fb ${feedback.ok ? 'good' : 'soft'}"><p><b>${feedback.ok ? 'Rätt!' : 'Inte riktigt.'}</b> ${feedback.ok ? '' : `Rätt svar: <b>${richText(esc(Q.answerText(q)))}</b>`}</p><button class="btn" data-g="next" autofocus>Fortsätt</button></div>`;
      } else if (q.kind === 'choice') {
        input = `<div class="choices">${q.choices.map((c, i) => `<button class="btn choice" data-g="choice" data-i="${i}">${richText(c)}</button>`).join('')}</div>`;
      } else {
        const hint = q.kind === 'frac' ? 'Skriv bråk med snedstreck, t.ex. 3/4' : q.kind === 'time' ? 'Skriv som 14:05' : '';
        input = `<form id="gform" class="ansform" autocomplete="off"><label class="sr" for="gans">Ditt svar</label>
          <div class="ansrow"><input id="gans" ${q.kind === 'num' ? 'inputmode="decimal"' : 'inputmode="text"'} autocomplete="off" autocorrect="off" spellcheck="false" autofocus>${q.unit ? `<span class="unit">${esc(q.unit)}</span>` : ''}</div>
          ${hint ? `<p class="muted small">${hint}</p>` : ''}<button class="btn big" type="submit">Svara</button></form>`;
      }
      const isExpr = /^[\d−\-{0,(]/.test(q.text) && q.text.length < 40;
      view(`
<header class="qhead">
  <button class="link" data-g="quit">Avsluta</button>
  <span class="qarea">${esc(roundTitle())}</span>
  <span class="dots">${dots}</span>
  <span class="earned">${gemSVG('#b58cff', true, 18)} +${R.earned}</span>
</header>
${R.mode === 'boss' ? `<section class="bossbar">${creatureSVG({ seed: 777, area: 'geo' }, 3, 64)}<div><p class="eyebrow">Stenjätten</p><p class="hearts">${'<i class="on"></i>'.repeat(bossHp)}${'<i></i>'.repeat(3 - bossHp)}</p><p class="muted small">Klara 3 av 5 för att vinna</p></div></section>` : ''}
<section class="panel qcard">
  <p class="eyebrow">${esc(areaName(q.area))}${q.level > player.skills[q.area].level ? ' · utmaning' : ''}</p>
  <p class="qtext${isExpr ? ' expr' : ''}">${richText(q.text)}${isExpr && !/[?.]$/.test(Q.plain(q.text)) ? ' =' : ''}</p>
  ${q.fig || ''}
  ${input}
  ${feedback ? '' : '<button class="link dunno" data-g="dunno">Vet inte</button>'}
</section>`);
      const f = document.getElementById('gform');
      if (f) f.addEventListener('submit', (e) => { e.preventDefault(); const v = document.getElementById('gans').value; if (!v.trim()) { toast('Skriv ett svar eller tryck på Vet inte.', 'note'); return; } answer(v); });
    }
    function answer(raw, dunno) {
      if (!R || R.waiting) return;
      R.waiting = true;
      const q = R.qs[R.i];
      const ok = !dunno && Q.check(q, raw);
      R.combo = ok ? R.combo + 1 : 0;
      const ev = E.recordAnswer(player, q, ok, Date.now() - R.shownAt, { combo: R.combo });
      if (ok && ctx.onPoints) ctx.onPoints(player, q.level * 10 + (R.combo >= 3 ? 5 : 0));
      if (ctx.onAnswer) ctx.onAnswer(q, ok, dunno ? '(vet inte)' : q.kind === 'choice' ? Q.plain(q.choices[Number(raw)]) : String(raw).trim());
      R.results.push(ok); R.earned += ev.crystals;
      if (ev.levelChange) { R.levels.push(ev.levelChange); if (ev.levelChange.to > ev.levelChange.from) toast(`<b>Ny nivå!</b> ${esc(areaName(ev.levelChange.area))}: ${esc(Q.LEVEL_LABELS[ev.levelChange.to])}`, 'good'); }
      if (ev.hatched) R.hatched.push(ev.hatched);
      ev.evolved.forEach((x) => R.evolved.push(x));
      saveSoon();
      if (ok) {
        if (!ev.levelChange) toast(`<b>Rätt!</b> +${ev.crystals}${R.combo >= 3 ? ` · ${R.combo} i rad` : ''}`, 'good');
        setTimeout(() => { R.waiting = false; nextQ(); }, 850);
      } else { R.waiting = false; R.fb = true; renderQ({ ok: false }); }
    }
    function nextQ() {
      if (!R) return;
      R.fb = false; R.i++;
      if (R.i >= R.qs.length) return endRound();
      R.shownAt = Date.now(); renderQ();
    }
    function endRound() {
      const wins = R.results.filter(Boolean).length;
      let bossWin = false;
      if (R.mode === 'boss' && wins >= 3) { bossWin = true; player.bossWeek = E.weekKey(); player.stats.bossWins++; player.crystals += 60; R.earned += 60; if (ctx.onPoints) ctx.onPoints(player, 100); }
      const fin = E.finishRound(player, R.mode);
      save();
      showSummary({ title: R.mode === 'boss' ? (bossWin ? 'Stenjätten är besegrad!' : 'Stenjätten klarade sig den här gången') : 'Turen är klar!', line: `${wins} av ${R.qs.length} rätt`, earned: R.earned, fin, levels: R.levels, hatched: R.hatched, evolved: R.evolved, again: R.mode === 'boss' ? (bossWin ? null : 'go-boss') : R.mode === 'omrade' ? 'go-area' : 'go-tur', areaId: R.areaId, bossWin });
      R = null;
    }
    function showSummary(s) {
      const f = s.fin, items = [];
      items.push(`<li>${gemSVG('#b58cff', true, 20)} <b>+${s.earned}</b> kristaller från uppgifterna</li>`);
      if (f.bonus) items.push(`<li>${gemSVG('#7ccf5a', true, 20)} <b>+${f.bonus}</b> för att du gjorde klart</li>`);
      if (f.chest) items.push(`<li>${tileSVG('kista', 20)} <b>+${f.chest}</b> från dagens kista</li>`);
      if (f.streakUp) items.push(`<li>${tileSVG('fackla', 20)} <b>${player.streak.count}</b> ${player.streak.count === 1 ? 'dag' : 'dagar'} i rad${f.freezeUsed ? ` (ett frysblock räddade sviten)` : ''}</li>`);
      if (f.freezeEarned) items.push(`<li>${iceSVG(18)} Du fick ett frysblock för en hel vecka!</li>`);
      const ups = s.levels.filter((l) => l.to > l.from);
      view(`
<section class="panel found">
  <p class="eyebrow">${esc(s.line)}</p>
  <h2>${esc(s.title)}</h2>
  ${s.hatched.map((c) => `<div class="hatch">${creatureSVG(c, 1, 120)}<p class="eyebrow">Ett ägg kläcktes!</p><h3>${esc(c.name)}</h3><p class="muted small">${esc(areaName(c.area))}-varelse. Den växer när du tränar ${esc(areaName(c.area).toLowerCase())}.</p></div>`).join('')}
  ${s.evolved.map((x) => `<div class="hatch">${creatureSVG(x.creature, x.stage, 96)}<p><b>${esc(x.creature.name)}</b> utvecklades till steg ${x.stage}!</p></div>`).join('')}
  <ul class="gains">${items.join('')}</ul>
  ${ups.map((l) => `<p class="levelup">Ny nivå i ${esc(areaName(l.area))}: <b>${esc(Q.LEVEL_LABELS[l.to])}</b></p>`).join('')}
  ${f.medals.map((m) => `<div class="medalwin">${medalSVG(true, 40)}<div><p class="eyebrow">Ny medalj</p><p><b>${esc(m.name)}</b> · ${esc(m.desc)}</p></div></div>`).join('')}
  ${E.goalReached(player) ? '<p class="muted">Dagsmålet är klart! Du får spela vidare, men uppdragen ger halva kristaller resten av dagen.</p>' : ''}
  <div class="actions center-a">
    ${s.again ? `<button class="btn big" data-g="${s.again}" ${s.areaId ? `data-id="${s.areaId}"` : ''} autofocus>${s.again === 'go-boss' ? 'Försök igen' : 'En tur till'}</button>` : ''}
    <button class="btn ghost" data-g="hub">Hem</button>
  </div>
</section>`);
    }

    /* ---------- vagnrace ---------- */
    function stopRace() { if (raceTimer) { clearInterval(raceTimer); raceTimer = null; } }
    function startRace() {
      stopRace();
      R = { mode: 'race', end: Date.now() + 60000, count: 0, wrong: 0, avoid: new Set(), earned: 0, levels: [], hatched: [], evolved: [] };
      raceNext();
      raceTimer = setInterval(() => {
        const left = Math.max(0, R.end - Date.now());
        const bar = document.getElementById('racebar'); if (bar) bar.style.width = (left / 600) + '%';
        const t = document.getElementById('racet'); if (t) t.textContent = Math.ceil(left / 1000);
        if (left <= 0) endRace();
      }, 200);
    }
    function raceNext(prev) {
      R.q = E.raceQuestion(player, R.avoid); R.avoid.add(Q.plain(R.q.text)); R.shownAt = Date.now();
      view(`
<header class="qhead"><button class="link" data-g="quit">Avsluta</button><span class="qarea">Vagnrace</span><span class="earned"><b id="racet">${Math.ceil((R.end - Date.now()) / 1000)}</b> s</span></header>
<div class="track"><span id="racebar" style="width:${Math.max(0, R.end - Date.now()) / 600}%"></span></div>
<section class="panel qcard race">
  <p class="racecount">${tileSVG('tra', 22)} <b>${R.count}</b> rätt</p>
  <p class="qtext expr">${richText(R.q.text)} =</p>
  <form id="rform" class="ansform" autocomplete="off"><label class="sr" for="rans">Svar</label><div class="ansrow"><input id="rans" inputmode="numeric" autocomplete="off" autofocus></div></form>
  <p class="muted small">${prev ? esc(prev) : 'Tryck Enter efter varje svar.'}</p>
</section>`);
      document.getElementById('rform').addEventListener('submit', (e) => {
        e.preventDefault(); if (!R || R.mode !== 'race') return;
        const v = document.getElementById('rans').value; if (!v.trim()) return;
        const ok = Q.check(R.q, v);
        const ev = E.recordAnswer(player, R.q, ok, Date.now() - R.shownAt, { race: true });
        if (ok) { R.count++; R.earned += ev.crystals; if (ctx.onPoints) ctx.onPoints(player, 5); } else R.wrong++;
        if (ctx.onAnswer) ctx.onAnswer(R.q, ok, String(v).trim());
        if (ev.hatched) R.hatched.push(ev.hatched); ev.evolved.forEach((x) => R.evolved.push(x));
        if (ev.levelChange) R.levels.push(ev.levelChange);
        if (Date.now() >= R.end) return endRace();
        raceNext(ok ? 'Rätt!' : `${Q.plain(R.q.text)} = ${Q.answerText(R.q)}`);
      });
    }
    function endRace() {
      if (!R || R.mode !== 'race') return;
      stopRace();
      const rec = R.count > player.raceBest; if (rec) player.raceBest = R.count;
      if (ctx.onRace) ctx.onRace(player, R.count);
      const fin = E.finishRound(player, 'race');
      save();
      showSummary({ title: rec ? 'Nytt rekord!' : 'Racet är slut!', line: `${R.count} rätt på 60 sekunder`, earned: R.earned, fin, levels: R.levels, hatched: R.hatched, evolved: R.evolved, again: 'go-race' });
      R = null;
    }

    /* ---------- samling ---------- */
    function showCollection() {
      const p = player;
      view(`
<header class="subhead"><button class="link" data-g="hub">Tillbaka</button><h2>Samling</h2><span class="muted">${E.owned(p)} av ${E.CREATURES.length}</span></header>
<p class="muted">Varelserna växer när du tränar deras område. Steg 2 vid ${E.STAGE_XP[2]} rätta svar, steg 3 vid ${E.STAGE_XP[3]}.</p>
<section class="cards">
  ${E.CREATURES.map((c) => {
    const st = p.creatures[c.id];
    if (!st) return `<div class="card off">${creatureSVG(c, 1, 72, true)}<p class="c-name">???</p><p class="muted small">${esc(areaName(c.area))}</p></div>`;
    const next = st.stage < 3 ? E.STAGE_XP[st.stage + 1] : null;
    return `<div class="card">${creatureSVG(c, st.stage, 72)}<p class="c-name">${esc(c.name)}</p><p class="muted small">${esc(areaName(c.area))} · steg ${st.stage}</p>${next ? `<div class="meter thin"><span style="width:${(st.xp / next) * 100}%;background:${areaGem(c.area)}"></span></div><p class="muted tiny">${st.xp}/${next}</p>` : '<p class="tiny gold">Fullt utvecklad</p>'}</div>`;
  }).join('')}
</section>`);
    }

    /* ---------- bas ---------- */
    function baseSVG() {
      const b = player.base;
      const used = new Set(b.cells.filter(Boolean));
      let defs = '';
      used.forEach((it) => {
        if (it.startsWith('c:')) { const c = E.CREATURES.find((x) => x.id === it.slice(2)); const st = player.creatures[c.id]; if (c && st) defs += `<symbol id="s-${it.replace(':', '_')}" viewBox="0 0 12 12">${grid2svg(E.creatureGrid(c.seed, st.stage), creaturePal(c, st.stage))}</symbol>`; }
        else if (TILES[it]) defs += `<symbol id="s-${it}" viewBox="0 0 8 8">${grid2svg(TILES[it].rows, TILES[it].pal)}</symbol>`;
      });
      let cells = '';
      b.cells.forEach((it, i) => {
        const x = (i % b.w) * 8, y = Math.floor(i / b.w) * 8;
        cells += `<rect class="cell" x="${x}" y="${y}" width="8" height="8" data-g="cell" data-i="${i}"/>`;
        if (it) cells += `<use href="#s-${it.replace(':', '_')}" x="${x}" y="${y}" width="8" height="8" pointer-events="none"/>`;
      });
      return `<svg class="basesvg" viewBox="0 0 ${b.w * 8} ${b.h * 8}" shape-rendering="crispEdges" role="img" aria-label="Din bas"><defs>${defs}</defs>${cells}</svg>`;
    }
    function showBase() {
      const p = player, placed = new Set(p.base.cells.filter((c) => c && c.startsWith('c:')));
      const items = E.BLOCKS.filter((b) => p.inventory[b.id] > 0);
      const crs = E.CREATURES.filter((c) => p.creatures[c.id] && !placed.has('c:' + c.id));
      if (buildSel && buildSel !== 'hacka' && !(buildSel.startsWith('c:') ? crs.some((c) => 'c:' + c.id === buildSel) : p.inventory[buildSel] > 0)) buildSel = null;
      view(`
<header class="subhead"><button class="link" data-g="hub">Tillbaka</button><h2>Min bas</h2><span class="muted">${gemSVG('#b58cff', true, 18)} ${p.crystals}</span></header>
<section class="panel basewrap">
  <div class="basebox">${baseSVG()}</div>
  <p class="muted small">${buildSel === 'hacka' ? 'Hackan är vald. Tryck på något i basen för att plocka upp det.' : buildSel ? 'Tryck på en tom ruta för att placera.' : 'Välj ett block eller en varelse nedan och tryck sedan på en ruta.'}</p>
  <div class="hotbar">
    <button class="slot${buildSel === 'hacka' ? ' sel' : ''}" data-g="sel" data-id="hacka" aria-label="Hacka"><svg class="px" width="28" height="28" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${grid2svg(['.ssssss.', 's......s', '...bb...', '...bb...', '...bb...', '...bb...', '...bb...', '........'], { s: '#c9c6d2', b: '#7d5129' })}</svg><small>Hacka</small></button>
    ${items.map((b) => `<button class="slot${buildSel === b.id ? ' sel' : ''}" data-g="sel" data-id="${b.id}" aria-label="${esc(b.name)}">${tileSVG(b.id, 28)}<small>${p.inventory[b.id]}</small></button>`).join('')}
    ${crs.map((c) => `<button class="slot${buildSel === 'c:' + c.id ? ' sel' : ''}" data-g="sel" data-id="c:${c.id}" aria-label="${esc(c.name)}">${creatureSVG(c, p.creatures[c.id].stage, 28)}<small>${esc(c.name)}</small></button>`).join('')}
  </div>
  ${items.length ? '' : '<p class="muted small">Du har inga block kvar. Köp fler i butiken.</p>'}
  <button class="btn ghost" data-g="shop">Till butiken</button>
</section>`);
    }
    function clickCell(i) {
      if (!buildSel) { toast('Välj först ett block nedanför basen.', 'note'); return; }
      const ok = buildSel === 'hacka' ? E.pickUp(player, i) : E.place(player, i, buildSel);
      if (ok) { if (buildSel !== 'hacka') { const got = E.checkMedals(player); got.forEach((m) => toast(`<b>Ny medalj:</b> ${esc(m.name)}`, 'good')); } saveSoon(); showBase(); }
    }

    /* ---------- butik ---------- */
    function showShop() {
      const p = player;
      const tabs = [['block', 'Block'], ['extra', 'Extra']].concat(ctx.publicMode ? [] : [['riktiga', 'Riktiga belöningar']]);
      let body = '';
      if (shopTab === 'block') {
        body = `<div class="shoplist">${E.BLOCKS.map((b) => `<div class="shopitem">${tileSVG(b.id, 36)}<div class="grow"><p><b>${esc(b.name)}</b></p><p class="muted small">${b.cost} ${b.cost === 1 ? 'kristall' : 'kristaller'} styck · du har ${p.inventory[b.id] || 0}</p></div>
          <div class="buyrow">
            <button class="btn sm buy" data-g="buy" data-id="${b.id}" data-n="1" ${p.crystals < b.cost ? 'disabled' : ''} aria-label="Köp 1 ${esc(b.name)} för ${b.cost} kristaller">Köp 1<small>${gemSVG('#b58cff', true, 14)}${b.cost}</small></button>
            <button class="btn sm buy" data-g="buy" data-id="${b.id}" data-n="5" ${p.crystals < b.cost * 5 ? 'disabled' : ''} aria-label="Köp 5 ${esc(b.name)} för ${b.cost * 5} kristaller">Köp 5<small>${gemSVG('#b58cff', true, 14)}${b.cost * 5}</small></button>
          </div></div>`).join('')}</div>`;
      } else if (shopTab === 'extra') {
        body = `<div class="shoplist">
          <div class="shopitem">${iceSVG(36)}<div class="grow"><p><b>Frysblock</b></p><p class="muted small">Skyddar din svit en dag du inte hinner spela. Du har ${p.streak.freezes} av ${E.MAX_FREEZES}.</p></div><button class="btn sm" data-g="buyfreeze" ${p.crystals < E.FREEZE_COST || p.streak.freezes >= E.MAX_FREEZES ? 'disabled' : ''}>${E.FREEZE_COST}</button></div>
          <div class="shopitem">${tileSVG('sten', 36)}<div class="grow"><p><b>Större bas</b></p><p class="muted small">Två kolumner till. Basen är ${p.base.w} rutor bred (max ${E.MAX_W}).</p></div><button class="btn sm" data-g="expand" ${p.crystals < E.EXPAND_COST || p.base.w >= E.MAX_W ? 'disabled' : ''}>${E.EXPAND_COST}</button></div>
        </div>`;
      } else {
        const rw = (family && family.rewards) || [];
        const reqs = p.requests.slice().reverse().slice(0, 8);
        body = rw.length ? `<div class="shoplist">${rw.map((r) => `<div class="shopitem">${tileSVG('kista', 36)}<div class="grow"><p><b>${esc(r.name)}</b></p><p class="muted small">${r.cost} kristaller</p></div>

  <div class="tablewrap"><table class="lv">

        case 'realbuy': {

          return showShop();
        }
        case 'p-approve': E.resolveRequest(pPlayer, id, true); return savePP();
        case 'p-decline': E.resolveRequest(pPlayer, id, false); return savePP();
        case 'p-lv': { const s = pPlayer.skills[id]; s.level = Math.max(1, Math.min(E.MAX, s.level + Number(b.dataset.d))); s.recent = []; return savePP(); }
        case 'p-fromtest': {
          const ss = await ctx.store.listSessions(pKid.id); const fin = ss.find((s) => s.finishedAt);
          if (!fin) { toast('Ingen klar kartläggning hittades.', 'note'); return; }
          E.applyTest(pPlayer, fin); toast('Nivåerna är uppdaterade.', 'good'); return savePP();
        }
        case 'p-delrew': family.rewards = family.rewards.filter((r) => r.id !== id); await ctx.store.saveFamily(family).catch(() => {}); return ctx.rerenderParent();
      }
    });
    document.addEventListener('change', (e) => {

      else if (g === 'p-on') { pPlayer.disabled = b.checked ? pPlayer.disabled.filter((x) => x !== id) : pPlayer.disabled.concat(id); savePP(); }
      else if (g === 'p-goal') { pPlayer.dailyGoalMin = Number(b.value); savePP(); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && saveT) save(); });

    return { open, reset, parentSection, bindParent, eggSVG, creatureSVG, showHub, getPlayer: () => player };
  };

<script>
/* =====================================================================
   KRISTALLGRUVAN – LAGRING (version 3: gemensamt konto för portalen)
   Inloggningen sköts av ../konto/konto.js (CyberKonto). Här sparas bara
   Kristallgruvans framsteg och poäng, via databasfunktionerna load_game,
   save_game och get_leaderboard med spelnamnet 'kristallgruvan'.
   Framstegen speglas också i webbläsaren, så spelet tål korta avbrott.
   Utan inställningar i konto/config.js körs spelet helt lokalt.
   ===================================================================== */
(function (root) {
  'use strict';
  const SPEL = 'kristallgruvan';
  const KEY = 'kristallgruvan.v3';
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const E = () => root.KGEngine;
  const K = () => root.CyberKonto;

  class PublicStore {
    constructor() {
      this.mode = K() && K().online ? 'online' : 'local';
      this.profile = null; // { id, name, grade, token }
      this.q = Promise.resolve();
      this.status = 'ok';
      this.onStatus = null;
      this.onLoggedOut = null;
      this.answers = [];
    }
    static message(code) { return K() ? K().message(code) : 'Något gick fel.'; }

    /* ---- lokal spegel ---- */
    _get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return this._mem || {}; } }
    _set(m) { this._mem = m; try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) { /* bara i minnet */ } }
    _mirror(p) { const m = this._get(); m.players = m.players || {}; m.players[p.kidId] = clone(p); this._set(m); }
    _forget(id) { const m = this._get(); if (m.players) delete m.players[id]; if (m.profiles) delete m.profiles[id]; this._set(m); }
    localProfiles() { return Object.values(this._get().profiles || {}); }
    saveLocalProfile(p) { const m = this._get(); m.profiles = m.profiles || {}; m.profiles[p.id] = { id: p.id, name: p.name, grade: p.grade }; this._set(m); }
    legacyProfiles() { return []; }
    markMigrated() {}
    // inloggningen ägs av CyberKonto (delas med alla spel)
    rememberSession() { /* sparas redan av CyberKonto vid inloggning */ }
    savedSession() { return this.mode === 'online' ? K().session() : null; }
    clearSession() { if (this.mode === 'online') K().clear(); }
    setStatus(s) { if (s !== this.status) { this.status = s; if (this.onStatus) this.onStatus(s); } }

    /* ---- konto ---- */
    async register(name, password, grade, remember) {
      if (this.mode !== 'online') return { id: (root.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()), name, grade, token: null };
      return K().register(name, password, grade, remember);
    }
    async login(name, password, remember) {
      if (this.mode !== 'online') {
        const p = this.localProfiles().find((x) => x.name.toLowerCase() === name.toLowerCase());
        if (!p) throw Object.assign(new Error('wrong_login'), { code: 'wrong_login' });
        return { id: p.id, name: p.name, grade: p.grade, token: null };
      }
      return K().login(name, password, remember);
    }
    async changePassword(oldp, newp) { await K().changePassword(oldp, newp); }
    async logout() {
      try { await this.q; } catch (e) { /* */ }
      if (this.mode === 'online') await K().logout();
      if (this.profile) { const m = this._get(); if (m.players) delete m.players[this.profile.id]; this._set(m); }
      this.profile = null; this.answers = [];
    }
    async deletePlayer() {
      if (this.mode === 'online') await K().deleteAccount();
      this._forget(this.profile.id); this.profile = null;
    }
    _lostSession() { this.clearSession(); if (this.onLoggedOut) this.onLoggedOut(); }

    /* ---- gränssnitt som spelet använder ---- */
    async getPlayer(id) {
      const local = (this._get().players || {})[id] || null;
      if (this.mode !== 'online') return local ? clone(local) : null;
      try {
        const rows = await K().rpc('load_game', { p_token: this.profile.token, p_spel: SPEL });
        const row = rows && rows[0];
        if (!row) return local ? clone(local) : null;
        const server = row.r_state && row.r_state.skills && row.r_state.creatures ? clone(row.r_state) : null; // bara ett giltigt sparat spel
        if (server) server.kidId = id;
        const best = !local || (server && (server.totalAnswered || 0) >= (local.totalAnswered || 0)) ? server || (local && clone(local)) : clone(local);
        if (best) best.pts = { pending: (local && local.pts && local.pts.pending) || 0, week: row.r_week, total: row.r_total, race: row.r_best };
        if (row.r_name && this.profile) this.profile.name = row.r_name;
        this.setStatus('ok');
        return best;
      } catch (e) {
        if (e.code === 'not_logged_in') { this._lostSession(); throw Object.assign(new Error('not_logged_in'), { code: 'not_logged_in' }); }
        this.setStatus('offline'); return local ? clone(local) : null;
      }
    }
    addAnswer(a) { this.answers.push(a); if (this.answers.length > 200) this.answers.splice(0, this.answers.length - 200); }
    savePlayer(p) {
      p.pts = p.pts || { pending: 0, week: 0, total: 0, race: 0 };
      if (this.mode !== 'online') {
        const wk = E().weekKey();
        if (p.pts.weekKey !== wk) { p.pts.week = 0; p.pts.weekKey = wk; }
        p.pts.week += p.pts.pending; p.pts.total += p.pts.pending; p.pts.pending = 0; p.pts.race = p.raceBest || 0;
        this.answers = [];
        this._mirror(p);
        return Promise.resolve();
      }
      this._mirror(p);
      const prof = this.profile;
      this.q = this.q.then(async () => {
        if (!prof || !prof.token || this.profile !== prof) return;
        const add = p.pts.pending || 0;
        const ans = this.answers.slice(0, 40);
        const state = clone(p); delete state.pts;
        try {
          const res = await K().rpc('save_game', { p_token: prof.token, p_spel: SPEL, p_grade: prof.grade, p_state: state, p_add_points: add, p_best: p.raceBest || 0, p_answers: ans });
          const r = res && res[0];
          p.pts.pending = Math.max(0, (p.pts.pending || 0) - add);
          this.answers.splice(0, ans.length);
          if (r) { p.pts.week = r.out_week; p.pts.total = r.out_total; p.pts.race = r.out_best; }
          this._mirror(p);
          this.setStatus('ok');
        } catch (e) {
          if (e.code === 'not_logged_in') this._lostSession(); else this.setStatus('offline');
        }
      });
      return this.q;
    }
    flush() { return this.q; }
    async leaderboard(kind, myId) {
      if (this.mode !== 'online') {
        const m = this._get(), wk = E().weekKey();
        const rows = Object.values(m.players || {}).map((p) => {
          const pr = (m.profiles || {})[p.kidId] || { name: '?' };
          const pts = p.pts || {};
          const score = kind === 'week' ? (pts.weekKey === wk ? pts.week || 0 : 0) : kind === 'race' ? p.raceBest || 0 : pts.total || 0;
          return { name: pr.name, score, me: p.kidId === myId };
        }).filter((r) => r.score > 0).sort((a, b) => b.score - a.score);
        let rank = 0, last = null;
        return rows.map((r, i) => { if (r.score !== last) { rank = i + 1; last = r.score; } return Object.assign(r, { rank }); }).slice(0, 20);
      }
      const s = K().session();
      const rows = await K().rpc('get_leaderboard', { p_spel: SPEL, p_kind: kind === 'race' ? 'best' : kind, p_token: (s && s.token) || null });
      return (rows || []).map((r) => ({ rank: r.r_rank, name: r.r_name, score: r.r_score, me: r.r_me }));
    }
    async getFamily() { return null; }
    async saveFamily() {}
    async listSessions() { return []; }
  }

  root.KGPublicStore = PublicStore;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
   KRISTALLGRUVAN PUBLIK – INLOGGNING, KONTO OCH TOPPLISTA
   Spelet självt finns i game.js (samma som i familjeversionen).
