/* Layout: en smal kolumn som en gruvgång – hjälte överst, ett stenblock (panel) per steg. Medvetet ett enda mörkt tema: grottan. */
:root {
  --bg: #15131c;
  --rock: #221f2c;
  --rock-2: #2b2738;
  --rock-3: #3a3449;
  --edge: #0b0a10;
  --well: #100f16;
  --fg: #f1ecf8;
  --muted: #aaa2bf;
  --moss: #7ccf5a;
  --moss-d: #3f8a2a;
  --moss-ink: #10200a;
  --amethyst: #b58cff;
  --gold: #ffd166;
  --soft: #ff9f8a;
  --f-display: "KG Siffror", "Pixelify Sans", "Courier New", monospace;
  --f-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-body); font-size: 18px; line-height: 1.5;
  background-image: radial-gradient(var(--rock) 1.2px, transparent 1.6px), radial-gradient(var(--rock-2) 1px, transparent 1.4px);
  background-size: 28px 28px, 44px 44px; background-position: 0 0, 13px 19px;
}
#app { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 7vw, 3.2rem); letter-spacing: .01em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.eyebrow { font-family: var(--f-display); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.grow { flex: 1; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.panel { background: var(--rock); border: 3px solid var(--edge); border-radius: 4px; box-shadow: inset 0 3px 0 var(--rock-3), 0 6px 0 var(--edge); padding: 22px; display: flex; flex-direction: column; gap: 14px; }

.btn { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; color: var(--moss-ink); background: var(--moss); border: 3px solid var(--edge); border-radius: 4px; padding: 10px 18px; box-shadow: inset 0 -4px 0 var(--moss-d), 0 4px 0 var(--edge); cursor: pointer; transition: transform .06s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--moss-d), 0 1px 0 var(--edge); }
.btn.big { font-size: 1.35rem; padding: 14px 26px; align-self: flex-start; }
.btn.ghost { background: var(--rock-3); color: var(--fg); box-shadow: inset 0 -4px 0 var(--rock-2), 0 4px 0 var(--edge); }
.link { background: none; border: 0; color: var(--muted); font: inherit; font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 2px; }
.link:hover { color: var(--fg); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.mossa { position: relative; display: inline-block; width: 72px; flex: none; }
.mossa svg { width: 100%; height: auto; display: block; }
.mossa.big { width: 132px; }
.mossa.mid { width: 92px; }
.mossa.sleep svg { animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
.mossa.awake svg { animation: hop 1.1s ease-in-out infinite; }
.zzz { position: absolute; right: -6px; top: 6px; font-family: var(--f-display); color: var(--amethyst); font-size: 1rem; }
.zzz i, .zzz b { font-style: normal; font-weight: 700; display: inline-block; }
.zzz i { font-size: 1.25em; transform: translateY(-.4em); }
.zzz b { font-size: 1.55em; transform: translateY(-.9em); }
@keyframes breathe { 50% { transform: scaleY(.95); } }
@keyframes hop { 50% { transform: translateY(-6%); } }

.hero { display: flex; gap: 22px; align-items: center; padding-block: 18px 6px; }
.hero-txt { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lead { font-size: 1.1rem; max-width: 52ch; }
.hero.won h1 { color: var(--moss); }
.holdzone { display: inline-block; flex: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }

.kid-list { display: flex; flex-wrap: wrap; gap: 12px; }
.btn.kid { font-size: 1.3rem; }
.newkid { display: flex; flex-direction: column; gap: 10px; border-top: 3px dashed var(--rock-3); padding-top: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--muted); flex: 1 1 160px; }
.fld.inline { flex-direction: row; align-items: center; gap: 10px; flex: none; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--well); border: 3px solid var(--edge); border-radius: 4px; padding: 10px 12px; box-shadow: inset 0 3px 0 rgba(0,0,0,.35); }
textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }

.intro { align-items: flex-start; }
.paper { display: flex; gap: 14px; align-items: center; background: var(--rock-2); border: 3px solid var(--edge); border-radius: 4px; padding: 12px 14px; }
.paper svg { flex: none; }
.tips { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.tips li::marker { color: var(--gold); }

.maphead { display: flex; gap: 16px; align-items: center; }
.meter { height: 18px; background: var(--well); border: 3px solid var(--edge); border-radius: 3px; margin: 6px 0; overflow: hidden; }
.meter span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--amethyst) 0 10px, #9b6bff 10px 12px); transition: width .4s; }
.tunnels { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.tunnel { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left; padding: 14px; background: var(--rock); color: var(--fg); border: 3px solid var(--edge); border-radius: 4px; box-shadow: inset 0 3px 0 var(--rock-3), 0 4px 0 var(--edge); cursor: pointer; font: inherit; }
.tunnel .gem { grid-row: 1 / 3; }
.t-name { display: flex; flex-direction: column; font-weight: 800; line-height: 1.2; }
.t-name small { font-family: var(--f-display); font-weight: 500; color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.t-state { font-family: var(--f-display); font-size: .9rem; color: var(--moss); }
.tunnel:hover:not(:disabled) { background: var(--rock-2); }
.tunnel.next { border-color: var(--gold); }
.tunnel.next .t-state { color: var(--gold); }
.tunnel.done { cursor: default; background: var(--well); box-shadow: none; }
.tunnel.done .t-state { color: var(--muted); }
.gem.on { filter: drop-shadow(0 0 6px rgba(255,255,255,.18)); }

.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.qarea { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 1.05rem; }
.dots { display: inline-flex; gap: 6px; }
.dots i { width: 14px; height: 14px; background: var(--rock-3); border: 2px solid var(--edge); }
.dots i.maybe { opacity: .45; }
.dots i.now { background: var(--gold); opacity: 1; }
.dots i.ok { background: var(--moss); opacity: 1; }
.dots i.miss { background: var(--soft); opacity: 1; }
.qcard { padding: 26px 24px; }
.qtext { font-size: 1.45rem; font-weight: 700; line-height: 1.45; max-width: 40ch; }
.qtext.expr { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 800; font-variant-numeric: tabular-nums; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; font-size: .82em; margin: 0 .12em; }
.fr > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .18em .04em; }
.fr > span:last-child { padding-top: .04em; }
.ansform { display: flex; flex-direction: column; gap: 10px; }
.ansrow { display: flex; align-items: center; gap: 10px; }
#ans { font-size: 1.9rem; font-weight: 800; width: min(260px, 100%); padding: 10px 14px; font-variant-numeric: tabular-nums; }
.unit { font-size: 1.4rem; font-weight: 800; color: var(--muted); }
.choices { display: flex; flex-wrap: wrap; gap: 12px; }
.btn.choice { background: var(--rock-3); color: var(--fg); box-shadow: inset 0 -4px 0 var(--rock-2), 0 4px 0 var(--edge); font-family: var(--f-body); font-weight: 800; font-size: 1.6rem; min-width: 96px; padding: 12px 20px; }
.btn.choice:hover { background: #4a4260; }
.dunno { align-self: flex-start; }

.fig { display: block; width: 100%; max-width: 380px; height: auto; max-height: 260px; margin: 4px 0; }
.fig .shape { fill: rgba(181,140,255,.14); stroke: var(--fg); stroke-width: 2.5; }
.fig .fill { fill: var(--amethyst); stroke: var(--fg); stroke-width: 2; }
.fig .lbl { fill: var(--fg); font: 800 17px var(--f-body); }
.fig .tick { fill: var(--muted); font: 700 11px var(--f-body); }
.fig .grid { stroke: var(--rock-3); stroke-width: 1; }
.fig .grid2 { stroke: var(--rock-2); stroke-width: 1; }
.fig .ray { stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
.fig .mark { fill: none; stroke: var(--gold); stroke-width: 2.5; }
.fig .dot { fill: var(--fg); }
.fig .dash { stroke: var(--gold); stroke-width: 2; stroke-dasharray: 6 5; }

.found { align-items: center; text-align: center; }
.found .btn.big { align-self: center; }
.gemstage { padding: 10px; animation: shine 1.6s ease-in-out infinite; }
@keyframes shine { 50% { transform: translateY(-6px) scale(1.04); } }

.depth { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.depth li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px dashed var(--rock-3); flex-wrap: wrap; }
.depth li:last-child { border-bottom: 0; }
.d-name { font-weight: 800; }
.d-gems { display: inline-flex; gap: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; background: var(--rock-2); color: var(--fg); border: 3px solid var(--edge); border-radius: 4px; padding: 14px 22px; font-size: 1.15rem; box-shadow: 0 6px 0 var(--edge); transition: transform .18s, opacity .18s; max-width: calc(100% - 32px); text-align: center; z-index: 10; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.good { background: var(--moss); color: var(--moss-ink); }
.toast.good b { font-family: var(--f-display); }
.toast.soft b { color: var(--gold); font-family: var(--f-display); }

.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 18vh; }

/* föräldravy: lugnare, tabellorienterad */
.parent { display: flex; flex-direction: column; gap: 18px; }
.parent .panel { font-size: 16px; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.phead h1 { font-size: 2.2rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-weight: 700; color: var(--fg); background: var(--rock-2); border: 2px solid var(--edge); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip.on { background: var(--amethyst); color: var(--edge); }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
.big-v { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; }
.big-v small { font-family: var(--f-body); font-size: .9rem; color: var(--muted); }
.sw { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; border-top: 3px dashed var(--rock-3); padding-top: 14px; }
.sw ul { margin: 6px 0 0; padding-left: 1.1em; }
.tablewrap { overflow-x: auto; }
table { width: 100%; min-width: 540px; border-collapse: collapse; font-size: .95rem; }
table.ans { min-width: 640px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rock-3); vertical-align: top; }
th { font-family: var(--f-display); font-weight: 500; color: var(--muted); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
td .gem { vertical-align: -2px; margin-right: 4px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; font-size: .8rem; font-weight: 800; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--edge); white-space: nowrap; }
.pill.good { background: var(--moss); color: var(--moss-ink); }
.pill.mid { background: var(--gold); color: #2a1f00; }
.pill.low { background: var(--soft); color: #2a0d06; }
.pill.none { background: var(--rock-3); color: var(--muted); }
details { border-top: 1px solid var(--rock-3); padding: 10px 0; }
summary { cursor: pointer; font-weight: 800; }
table.ans tr.ok .mark { color: var(--moss); font-weight: 800; }
table.ans tr.miss .mark { color: var(--soft); font-weight: 800; }
#exportbox { display: flex; flex-direction: column; gap: 10px; }
#exportbox[hidden] { display: none; }


/* ---------- spelet ---------- */
.px { display: block; flex: none; image-rendering: pixelated; }
.hubtop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; }
.who { display: flex; align-items: center; gap: 14px; min-width: 0; }
.who h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); }
.statrow { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { display: inline-grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; background: var(--rock); border: 3px solid var(--edge); border-radius: 4px; padding: 6px 12px; box-shadow: 0 4px 0 var(--edge); }
.stat svg { grid-row: 1 / 3; }
.stat b { font-family: var(--f-display); font-size: 1.35rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: .72rem; line-height: 1.1; }
.stat.inline { box-shadow: none; padding: 4px 10px; display: inline-flex; gap: 6px; }
.dayrow, .eggrow { flex-direction: row; align-items: center; gap: 16px; }
.chest.ready { animation: wobble 1.4s ease-in-out infinite; }
@keyframes wobble { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-6deg); } 90% { transform: rotate(6deg); } }
.egg.cracked { animation: wobble 1s ease-in-out infinite; }
.meter.egg-m span { background: repeating-linear-gradient(90deg, #f3ead7 0 10px, #d8ccb4 10px 12px); }
.meter.thin { height: 10px; border-width: 2px; margin: 4px 0 0; }
.panel.note { padding: 12px 18px; border-color: var(--gold); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mode { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left; background: var(--rock); color: var(--fg); border: 3px solid var(--edge); border-radius: 4px; padding: 14px 16px; box-shadow: inset 0 3px 0 var(--rock-3), 0 5px 0 var(--edge); cursor: pointer; font: inherit; }
.mode > svg { grid-row: 1 / 3; }
.mode:hover { background: var(--rock-2); }
.mode:active { transform: translateY(3px); box-shadow: inset 0 3px 0 var(--rock-3), 0 2px 0 var(--edge); }
.m-t { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; }
.m-d { color: var(--muted); font-size: .88rem; }
.mode.main { grid-column: 1 / -1; grid-template-columns: 1fr; background: var(--moss); color: var(--moss-ink); box-shadow: inset 0 -5px 0 var(--moss-d), 0 5px 0 var(--edge); padding: 20px 22px; }
.mode.main .m-t { font-size: 2rem; }
.mode.main .m-d { color: var(--moss-ink); opacity: .8; }
.mode.main:hover { background: #8ad968; }
.mode.hot { border-color: var(--soft); }
.mode.done { opacity: .7; }
.navgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

<main id="app"></main>

<noscript><p style="padding:16px">Sidan behöver JavaScript.</p></noscript>

<script src="../konto/konto.js"></script>
<script>
/* =====================================================================
   KRISTALLGRUVAN – UPPGIFTSMOTOR (ren logik, inget DOM, ingen lagring)
   Kan återanvändas oförändrad i spelet och på en egen server.
   Nivåer: 1 = åk 3, 2 = åk 4, 3 = åk 5, 4 = åk 6, 5 = över åk 6
   ===================================================================== */
(function (root) {
  'use strict';

  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const P = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
  const r6 = (x) => Math.round(x * 1e6) / 1e6;
  const fmt = (n) => {
    const x = r6(n);
    const neg = x < 0;
    const [i, d] = Math.abs(x).toString().split('.');
    const int = i.length > 4 ? i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : i;
    return (neg ? '−' : '') + int + (d ? ',' + d : '');
  };
  const NAMES = ['Ella', 'Leo', 'Maja', 'Noah', 'Alva', 'Elias', 'Saga', 'Hugo', 'Wilma', 'Liam', 'Ebba', 'Viggo', 'Nora', 'Theo'];

  const LEVEL_LABELS = ['under åk 3', 'åk 3', 'åk 4', 'åk 5', 'åk 6', 'över åk 6', 'åk 7–8'];
  const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const sup = (n) => String(n).split('').map((c) => SUP[+c]).join('');

  const AREAS = [
    { id: 'tal', name: 'Tal & positionssystem', gem: '#7fd1ff' },
    { id: 'addsub', name: 'Addition & subtraktion', gem: '#7ccf5a' },
    { id: 'tabell', name: 'Gångertabellerna', gem: '#ffd166' },
    { id: 'muldiv', name: 'Multiplikation & division', gem: '#ff9f5a' },
    { id: 'brak', name: 'Bråk', gem: '#ff7aa8' },
    { id: 'dec', name: 'Decimaltal & procent', gem: '#5ee0c0' },
    { id: 'geo', name: 'Geometri', gem: '#b58cff' },
    { id: 'mat', name: 'Mätning & tid', gem: '#f2f2f2' },
    { id: 'alg', name: 'Mönster & ekvationer', gem: '#6f8cff' },
    { id: 'stat', name: 'Statistik & sannolikhet', gem: '#e6c27a' },
    { id: 'prob', name: 'Problemlösning', gem: '#ff6b6b' },
  ];

  /* ---------- frågebyggare ---------- */
  // text: bråk skrivs som {3/4} och ritas staplade i gränssnittet
  function num(text, answer, o) { return Object.assign({ kind: 'num', text, answer: r6(answer) }, o || {}); }
  function frac(text, n, d, o) { return Object.assign({ kind: 'frac', text, answer: { n, d } }, o || {}); }
  function time(text, h, m, o) { return Object.assign({ kind: 'time', text, answer: { h: ((h % 24) + 24) % 24, m } }, o || {}); }
  function choice(text, correct, wrong, o) {
    o = o || {};
    const opts = o.fixedOrder ? o.fixedOrder : shuffle([correct].concat(wrong));
    const q = Object.assign({ kind: 'choice', text, choices: opts, answer: opts.indexOf(correct) }, o);
    delete q.fixedOrder;
    return q;
  }
  const pad = (n) => (n < 10 ? '0' : '') + n;

  /* ---------- figurer (SVG, färger via CSS-klasser) ---------- */
  const FIG = {
    rect(w, h) {
      const s = Math.min(200 / w, 120 / h), W = w * s, H = h * s, x = 70, y = 16;
      return `<svg class="fig" viewBox="0 0 ${W + 110} ${H + 56}" role="img" aria-label="Rektangel ${w} gånger ${h} cm">
<rect class="shape" x="${x}" y="${y}" width="${W}" height="${H}"/>
<text class="lbl" x="${x + W / 2}" y="${y + H + 28}" text-anchor="middle">${fmt(w)} cm</text>
<text class="lbl" x="${x - 10}" y="${y + H / 2 + 6}" text-anchor="end">${fmt(h)} cm</text></svg>`;
    },
    bar(n, k) {
      const W = 300, w = W / n;
      let r = '';
      for (let i = 0; i < n; i++) r += `<rect class="${i < k ? 'fill' : 'shape'}" x="${10 + i * w}" y="10" width="${w}" height="50"/>`;
      return `<svg class="fig" viewBox="0 0 320 70" role="img" aria-label="Stång i ${n} delar">${r}</svg>`;
    },
    angle(deg) {
      const cx = 150, cy = 150, L = 130, rad = (deg * Math.PI) / 180;
      const x2 = cx + L * Math.cos(rad), y2 = cy - L * Math.sin(rad);
      let mark;
      if (deg === 90) mark = `<path class="mark" d="M${cx + 22} ${cy} L${cx + 22} ${cy - 22} L${cx} ${cy - 22}"/>`;
      else { const r = 30; mark = `<path class="mark" d="M${cx + r} ${cy} A${r} ${r} 0 0 0 ${cx + r * Math.cos(rad)} ${cy - r * Math.sin(rad)}"/>`; }
      return `<svg class="fig" viewBox="0 0 300 170" role="img" aria-label="En vinkel"><line class="ray" x1="${cx}" y1="${cy}" x2="${cx + L}" y2="${cy}"/><line class="ray" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}"/>${mark}<circle class="dot" cx="${cx}" cy="${cy}" r="4"/></svg>`;
    },
    tri(b, h) {
      const s = Math.min(220 / b, 130 / h), B = b * s, H = h * s, x = 30, y = H + 16, ax = x + B * 0.35;
      return `<svg class="fig" viewBox="0 0 ${B + 120} ${H + 56}" role="img" aria-label="Triangel med basen ${b} cm och höjden ${h} cm">
<polygon class="shape" points="${x},${y} ${x + B},${y} ${ax},${y - H}"/>
<line class="dash" x1="${ax}" y1="${y - H}" x2="${ax}" y2="${y}"/>
<text class="lbl" x="${x + B / 2}" y="${y + 28}" text-anchor="middle">${b} cm</text>
<text class="lbl" x="${ax + 8}" y="${y - H / 2}">${h} cm</text></svg>`;
    },
    lshape(W, H, cw, ch) {
      const s = Math.min(200 / W, 140 / H), ox = 64, oy = 14, X = (v) => ox + v * s, Y = (v) => oy + v * s;
      const pts = [[0, 0], [W - cw, 0], [W - cw, ch], [W, ch], [W, H], [0, H]].map(([a, b]) => `${X(a)},${Y(b)}`).join(' ');
      return `<svg class="fig" viewBox="0 0 ${W * s + 130} ${H * s + 56}" role="img" aria-label="Sammansatt figur">
<polygon class="shape" points="${pts}"/>
<text class="lbl" x="${X(W / 2)}" y="${Y(H) + 28}" text-anchor="middle">${W} cm</text>
<text class="lbl" x="${X(0) - 10}" y="${Y(H / 2) + 6}" text-anchor="end">${H} cm</text>
<text class="lbl" x="${X(W - cw / 2)}" y="${Y(ch) - 8}" text-anchor="middle">${cw} cm</text>
<text class="lbl" x="${X(W - cw) - 8}" y="${Y(ch / 2) + 6}" text-anchor="end">${ch} cm</text></svg>`;
    },
    bars(cats, vals) {
      const x0 = 34, x1 = 300, y0 = 170, top = 14, max = 12, step = (y0 - top) / max, bw = (x1 - x0) / cats.length;
      let g = '';
      for (let v = 0; v <= max; v++) {
        g += `<line class="${v % 2 ? 'grid2' : 'grid'}" x1="${x0}" y1="${y0 - v * step}" x2="${x1}" y2="${y0 - v * step}"/>`;
        if (v % 2 === 0) g += `<text class="tick" x="${x0 - 6}" y="${y0 - v * step + 4}" text-anchor="end">${v}</text>`;
      }
      cats.forEach((c, i) => {
        const h = vals[i] * step, x = x0 + i * bw + bw * 0.2;
        g += `<rect class="fill" x="${x}" y="${y0 - h}" width="${bw * 0.6}" height="${h}"/>`;
        g += `<text class="tick" x="${x + bw * 0.3}" y="${y0 + 18}" text-anchor="middle">${c}</text>`;
      });
      return `<svg class="fig" viewBox="0 0 310 196" role="img" aria-label="Stapeldiagram">${g}</svg>`;
    },
  };

  /* ---------- mallar per område och nivå ---------- */
  function digitValue(min, max, places) {
    for (;;) {
      const n = R(min, max), s = String(n), pl = P(places);
      const idx = s.length - 1 - Math.log10(pl);
      const d = Number(s[idx]);
      if (d === 0) continue;
      if (s.split('').filter((c) => c === s[idx]).length > 1) continue;
      return num(`Vilket värde har siffran <b>${d}</b> i talet <b>${fmt(n)}</b>?`, d * pl, { skill: 'siffrans värde' });
    }
  }

  const T = {
    tal: {
      1: [() => digitValue(100, 999, [10, 100]),
          () => { const n = R(120, 980), k = P([10, 100]); return num(`Vilket tal är ${k} mer än ${fmt(n)}?`, n + k, { skill: 'räkna med 10 och 100' }); }],
      2: [() => digitValue(10000, 99999, [100, 1000, 10000]),
          () => { let n = R(1000, 9999); if (n % 100 === 50) n++; return num(`Avrunda ${fmt(n)} till närmaste hundratal.`, Math.round(n / 100) * 100, { skill: 'avrundning' }); }],
      3: [() => { const n = R(10, 99) * 10000 + R(0, 999); return num(`Vilket tal är 1 000 mindre än ${fmt(n)}?`, n - 1000, { skill: 'stora tal, växling' }); },
          () => { const a = R(1, 9), b = P([R(1, 9) * 10, R(1, 9)]), c = R(1, 9); return num(`Skriv med siffror: <b>${a} ${a === 1 ? 'miljon' : 'miljoner'} ${b} tusen ${c}</b>`, a * 1e6 + b * 1000 + c, { skill: 'tal till miljoner' }); }],
      4: [() => { const t = -R(2, 9), u = R(-t + 1, 15); return num(`Termometern visar ${fmt(t)} °C. Temperaturen stiger ${u} grader. Vad visar termometern nu?`, t + u, { unit: '°C', skill: 'negativa tal' }); },
          () => { const x = R(101, 999) / 100, m = P([10, 100]); return num(`Vad är ${m} · ${fmt(x)}?`, x * m, { skill: 'multiplikation med 10 och 100' }); },
          () => { for (;;) { const a = R(1, 9), d1 = R(1, 9), d2 = R(1, 9), d3 = R(1, 9); const ds = [d1, d2, d3]; const pos = R(0, 1); const d = ds[pos]; if (ds.filter((x) => x === d).length > 1 || d === a) continue; const x = a + d1 / 10 + d2 / 100 + d3 / 1000; return num(`Vilket värde har siffran <b>${d}</b> i talet <b>${fmt(x)}</b>?`, d / (pos ? 100 : 10), { skill: 'decimala positioner' }); } }],
      5: [() => { for (;;) { const a = -R(2, 12), b = R(4, 20); if ((a + b) % 2) continue; return num(`Vilket tal ligger mitt emellan ${fmt(a)} och ${fmt(b)} på tallinjen?`, (a + b) / 2, { skill: 'tallinje, negativa tal' }); } },
          () => { const x = R(1, 9) + R(1, 99) / 100; return num(`Hur många hundradelar är ${fmt(x)}?`, Math.round(x * 100), { skill: 'decimala positioner' }); },
          () => { const n = R(2, 999); return num(`Vad är ${fmt(n)} / 1 000?`, n / 1000, { skill: 'division med 1 000' }); }],
    },
    addsub: {
      1: [() => { for (;;) { const a = R(25, 69), b = R(15, 29); if (a % 10 + b % 10 >= 10) return num(`${a} + ${b}`, a + b, { skill: 'tiotalsövergång' }); } },
          () => { for (;;) { const a = R(41, 95), b = R(12, a - 10); if (a % 10 < b % 10) return num(`${a} − ${b}`, a - b, { skill: 'subtraktion med växling' }); } }],
      2: [() => { const a = R(150, 599), b = R(150, 399); return num(`${a} + ${b}`, a + b, { skill: 'tresiffrig addition' }); },

      2: [() => { const n = P(NAMES), p = R(4, 8), k = R(4, 9), g = R(3, p * k - 5); return num(`Ett paket samlarkort innehåller ${p} kort. ${n} köper ${k} paket och ger bort ${g} kort. Hur många kort har ${n} kvar?`, p * k - g, { skill: 'textuppgift, två steg' }); },
          () => { const n = P(NAMES), k = R(3, 6), q = R(4, 12); return num(`${n} och ${k - 1} kompisar delar lika på ${k * q} smaragder. Hur många smaragder får var och en?`, q, { skill: 'delning' }); }],
      3: [() => { const A = R(12, 24) * 5, C = R(6, Math.floor(A / 5) - 1) * 5, na = R(1, 3), nc = R(2, 4); return num(`En biobiljett kostar ${A} kr för vuxna och ${C} kr för barn. Vad kostar det för ${na} ${na === 1 ? 'vuxen' : 'vuxna'} och ${nc} barn?`, na * A + nc * C, { unit: 'kr', skill: 'textuppgift, flera steg' }); },
          () => { const n = P(NAMES), c = R(15, 55), k = R(2, 3); return num(`${n} köper ${k} böcker som kostar ${c} kr styck och betalar med en 200-lapp. Hur mycket får ${n} tillbaka?`, 200 - k * c, { unit: 'kr', skill: 'växel' }); }],
      4: [() => { const price = R(8, 40) * 20, p = P([10, 25, 50]); return num(`En tröja kostar ${price} kr. Den sänks med ${p} %. Vad kostar tröjan nu?`, (price * (100 - p)) / 100, { unit: 'kr', skill: 'procent, rabatt' }); },
          () => { const persons = P([3, 4, 6]), pizzas = R(2, 4), price = R(15, 30) * persons; return num(`${persons} kompisar köper ${pizzas} pizzor för ${price} kr styck och delar lika på notan. Hur mycket betalar var och en?`, (pizzas * price) / persons, { unit: 'kr', skill: 'textuppgift, flera steg' }); },
          () => { const d = R(2, 5), t = 10 * R(1, 6); return num(`En kran droppar ${d} dl vatten per minut. Hur många liter har droppat efter ${t} minuter?`, (d * t) / 10, { unit: 'liter', skill: 'enheter i problem' }); }],
      5: [() => { const big = R(20, 60), small = R(5, big - 4); return num(`Två tal har summan ${big + small} och skillnaden ${big - small}. Vilket är det största talet?`, big, { skill: 'resonemang, två villkor' }); },
          () => { const k = P([2, 3, 4]), b = R(3, 8), word = { 2: 'dubbelt', 3: 'tre gånger', 4: 'fyra gånger' }[k]; return num(`Maja är ${word} så gammal som sin lillebror. Tillsammans är de ${(k + 1) * b} år. Hur gammal är Maja?`, k * b, { unit: 'år', skill: 'resonemang, delar' }); }],
    },
  };

  /* ---------- nivå 6: åk 7–8 (används i spelet, inte i kartläggningen) ---------- */
  T.tal[6] = [
    () => { const b = P([2, 3, 10]), e = b === 10 ? R(3, 6) : b === 2 ? R(4, 7) : R(2, 4); return num(`Vad är ${b}${sup(e)}?`, b ** e, { skill: 'potenser' }); },
    () => { const a = R(2, 9), b = R(2, 9), sa = P([-1, 1]), sb = sa === 1 ? -1 : P([-1, 1]); return num(`${sa < 0 ? '(−' + a + ')' : a} · ${sb < 0 ? '(−' + b + ')' : b}`, sa * a * sb * b, { skill: 'negativa tal, multiplikation' }); },
    () => { const x = R(11, 99) / 10, e = R(2, 4); return num(`Skriv ${fmt(x)} · 10${sup(e)} som ett vanligt tal.`, x * 10 ** e, { skill: 'tiopotenser' }); },
  ];
  T.addsub[6] = [
    () => { const a = R(11, 59) / 10, b = R(101, 999) / 100, c = R(5, 15); return num(`−${fmt(a)} + ${fmt(b)} − ${c}`, -a + b - c, { skill: 'negativa decimaltal' }); },
    () => { const a = R(5, 20), b = R(2, a - 1); return num(`(−${a}) − (−${b})`, -a + b, { skill: 'subtrahera negativa tal' }); },
  ];
  T.tabell[6] = [
    () => { const a = R(13, 19), b = R(4, 9); return num(`${a} · ${b}`, a * b, { skill: 'tabell 13–19' }); },
    () => { const a = R(11, 20); return num(`Vilket positivt tal gånger sig självt blir ${a * a}?`, a, { skill: 'kvadrattal' }); },
  ];
  T.muldiv[6] = [
    () => { const a = R(120, 480), b = R(21, 48); return num(`${a} · ${b}`, a * b, { skill: 'flersiffrig multiplikation' }); },
    () => { const d = R(2, 9) / 100, q = R(3, 12); return num(`${fmt(r6(d * q))} / ${fmt(d)}`, q, { skill: 'division med decimaltal' }); },
  ];
  T.brak[6] = [
    () => { const [a, b, c, d] = P([[2, 3, 3, 4], [1, 2, 2, 5], [3, 4, 2, 3], [2, 5, 5, 6], [3, 8, 4, 9], [4, 5, 1, 2]]); const n = a * c, m = b * d, g = gcd(n, m); return frac(`{${a}/${b}} · {${c}/${d}}`, n / g, m / g, { skill: 'multiplikation av bråk' }); },
    () => { const w1 = R(1, 3), w2 = R(1, 3); const [n1, d1, n2, d2] = P([[1, 2, 3, 4], [1, 3, 1, 2], [2, 3, 1, 6], [1, 4, 1, 2], [3, 4, 1, 2]]); const n = (w1 * d1 + n1) * d2 + (w2 * d2 + n2) * d1, m = d1 * d2, g = gcd(n, m); return frac(`${w1}{${n1}/${d1}} + ${w2}{${n2}/${d2}}`, n / g, m / g, { skill: 'blandad form' }); },
    () => { const [a, b, c, d] = P([[3, 4, 1, 2], [2, 3, 1, 6], [5, 6, 1, 3], [1, 2, 1, 4], [4, 5, 2, 5]]); const n = a * d, m = b * c, g = gcd(n, m); return frac(`{${a}/${b}} / {${c}/${d}}`, n / g, m / g, { skill: 'division med bråk' }); },
  ];
  T.dec[6] = [
    () => { const old = R(4, 20) * 20, p = P([10, 20, 25, 50]); return num(`Priset höjs från ${old} kr till ${old * (100 + p) / 100} kr. Med hur många procent höjdes priset?`, p, { unit: '%', skill: 'procentuell förändring' }); },
    () => { const p = P([15, 35, 45]), N = 20 * R(3, 25); return num(`Vad är ${p} % av ${N}?`, (p * N) / 100, { skill: 'procent av' }); },
    () => { let n = R(101, 999); if (n % 10 === 5) n++; return num(`Avrunda ${fmt(n / 1000)} till två decimaler.`, Math.round(n / 10) / 100, { skill: 'avrundning decimaltal' }); },
  ];
  T.geo[6] = [
    () => { const d = R(2, 20); return num(`En cirkel har diametern ${d} cm. Vad är omkretsen? Räkna med π ≈ 3,14.`, 3.14 * d, { unit: 'cm', skill: 'cirkelns omkrets' }); },
    () => { const [a, b, c] = P([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [9, 12, 15]]); return num(`En rätvinklig triangel har kateterna ${a} cm och ${b} cm. Hur lång är hypotenusan?`, c, { unit: 'cm', skill: 'Pythagoras sats' }); },
    () => { const b = R(4, 12), h = R(3, 9); return num(`Ett parallellogram har basen ${b} cm och höjden ${h} cm. Vad är arean?`, b * h, { unit: 'cm²', skill: 'parallellogram' }); },
  ];
  T.mat[6] = [
    () => { const a = R(2, 9); return num(`Hur många liter är ${a} m³?`, 1000 * a, { unit: 'liter', skill: 'volymenheter' }); },
    () => { const v = P([36, 54, 72, 90, 108]); return num(`En bil kör ${v} km/h. Hur många meter per sekund är det?`, v / 3.6, { unit: 'm/s', skill: 'enhetsbyte fart' }); },
    () => { const a = R(2, 9); return num(`Hur många kubikcentimeter är ${a} dm³?`, 1000 * a, { unit: 'cm³', skill: 'volymenheter' }); },
  ];
  T.alg[6] = [
    () => { for (;;) { const m = R(2, 4), k = R(1, 6), x = R(3, 12), c = R(1, m - 1), r = m * (x - k) - c * x; if (r <= 0) continue; return num(`${m}(x − ${k}) = ${c === 1 ? '' : c}x + ${r}. Vad är x?`, x, { skill: 'ekvation med parentes' }); } },
    () => { const x = R(2, 6), a = R(2, 4); return num(`Vad är värdet av ${a}x² om x = ${x}?`, a * x * x, { skill: 'potensuttryck' }); },
    () => { const a = R(2, 5), b = R(1, 6), c = R(1, a - 1), d = R(1, 6), x = R(2, 9); return num(`Förenkla ${a}x + ${b} − ${c === 1 ? '' : c}x + ${d} och räkna ut värdet när x = ${x}.`, (a - c) * x + b + d, { skill: 'förenkla uttryck' }); },
  ];
  T.stat[6] = [
    () => { const [t, k] = P([['båda visar sexa', 1], ['summan blir 11', 2], ['summan blir 3', 2], ['summan blir 7', 6]]); return frac(`Du slår två vanliga tärningar. Hur stor är chansen att ${t}? Svara med ett bråk.`, k, 36, { skill: 'sannolikhet, två händelser' }); },
    () => { for (;;) { const m = R(6, 15), rem = R(2, 30), nm = (5 * m - rem) / 4; if (!Number.isInteger(nm) || nm <= 0) continue; return num(`Medelvärdet av 5 tal är ${m}. Talet ${rem} tas bort. Vad blir medelvärdet av de 4 tal som är kvar?`, nm, { skill: 'medelvärde' }); } },
    () => { const v = Array.from({ length: 6 }, () => R(1, 20)), s = v.slice().sort((a, b) => a - b); return num(`Vad är medianen? &nbsp;${v.join(', ')}`, (s[2] + s[3]) / 2, { skill: 'median, jämnt antal' }); },
  ];
  T.prob[6] = [
    () => { const v = R(4, 12) * 10, t = R(2, 4), t2 = R(5, 8); return num(`Ett tåg kör ${v * t} km på ${t} timmar. Hur långt kör det på ${t2} timmar med samma fart?`, v * t2, { unit: 'km', skill: 'proportionalitet' }); },
    () => { const p = P([20, 25, 10]), orig = R(6, 30) * 20; return num(`Efter ${p} % rabatt kostar jackan ${orig * (100 - p) / 100} kr. Vad kostade jackan från början?`, orig, { unit: 'kr', skill: 'procent baklänges' }); },
    () => { const k = R(3, 6), price = R(4, 12), m = R(7, 12); return num(`${k} pennor kostar ${k * price} kr. Vad kostar ${m} pennor?`, m * price, { unit: 'kr', skill: 'proportionalitet' }); },
  ];

  function generate(areaId, level, avoid) {
    const pool = T[areaId][level];
    for (let i = 0; i < 25; i++) {
      const q = P(pool)();
      if (!avoid || !avoid.has(plain(q.text))) { q.area = areaId; q.level = level; return q; }
    }
    const q = P(pool)(); q.area = areaId; q.level = level; return q;
  }

  /* ---------- rättning ---------- */
  function parseNum(raw) {
    let s = String(raw).trim().replace(/[−–]/g, '-').replace(/[\s ]/g, '').replace(/[a-zA-ZåäöÅÄÖ°%²³]+\.?$/, '').replace(',', '.');
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null;
    return Number(s);
  }
  function parseFrac(raw) {
    const s = String(raw).trim().replace(/[−–]/g, '-').replace(',', '.');
    let m = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (m) { const w = +m[1], n = +m[2], d = +m[3]; if (!d) return null; return { value: w + n / d, n: w * d + n, d }; }
    m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
    if (m) { const n = +m[1], d = +m[2]; if (!d) return null; return { value: n / d, n, d }; }
    const v = parseNum(s); return v === null ? null : { value: v, n: null, d: null };
  }
  function check(q, raw) {
    if (raw === null || raw === undefined || String(raw).trim() === '') return false;
    if (q.kind === 'choice') return Number(raw) === q.answer;
    if (q.kind === 'num') { const v = parseNum(raw); return v !== null && Math.abs(v - q.answer) < 1e-9; }
    if (q.kind === 'frac') {
      const f = parseFrac(raw); if (!f) return false;
      const ok = Math.abs(f.value - q.answer.n / q.answer.d) < 1e-9;
      if (!ok) return false;
      if (q.simplest) return f.n !== null && f.n === q.answer.n && f.d === q.answer.d;
      return true;
    }
    if (q.kind === 'time') {
      const m = String(raw).trim().match(/^(\d{1,2})\s*[:.]\s*(\d{2})$/);
      return !!m && (+m[1] % 24) === q.answer.h && +m[2] === q.answer.m;
    }
    return false;
  }
  function answerText(q) {
    if (q.kind === 'choice') return plain(q.choices[q.answer]);
    if (q.kind === 'frac') return q.answer.n + '/' + q.answer.d;
    if (q.kind === 'time') return pad(q.answer.h) + ':' + pad(q.answer.m);
    return fmt(q.answer) + (q.unit ? ' ' + q.unit : '');
  }
  function plain(text) {
    return String(text).replace(/\{([^}]+)\}/g, ' $1 ').replace(/&nbsp;/g, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  }

  /* ---------- adaptiv logik ---------- */
  const MIN_Q = 4, MAX_Q = 5;
  function startLevel(grade) { return Math.max(1, Math.min(5, (Number(grade) || 4) - 2)); }
  function nextLevel(level, ok) { return ok ? Math.min(5, level + 1) : Math.max(1, level - 1); }
  function areaDone(asked) {
    if (asked.length >= MAX_Q) return true;
    if (asked.length < MIN_Q) return false;
    const a = asked[asked.length - 1], b = asked[asked.length - 2];
    return a.ok === b.ok; // två senaste pekar åt samma håll -> klart
  }
  function estimate(asked) {
    if (!asked || !asked.length) return null;
    let best = 0;
    for (let L = 1; L <= 5; L++) {
      const at = asked.filter((x) => x.level === L), c = at.filter((x) => x.ok).length;
      if (c > 0 && c >= at.length - c) best = L;
    }
    const atBest = asked.filter((x) => x.level === best);
    const correct = asked.filter((x) => x.ok).length;
    const ms = asked.filter((x) => x.ms).map((x) => x.ms);
    return {
      level: best,
      label: LEVEL_LABELS[best],
      secure: best > 0 && atBest.every((x) => x.ok),
      correct, total: asked.length,
      avgMs: ms.length ? Math.round(ms.reduce((a, b) => a + b, 0) / ms.length) : null,
    };
  }

  root.KGQ = { AREAS, LEVEL_LABELS, MAX_LEVEL: 6, generate, check, answerText, plain, fmt, startLevel, nextLevel, areaDone, estimate, _T: T };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
   KRISTALLGRUVAN – LÄRARSIDAN
   Visar anonym statistik över vilka uppgifter eleverna gör fel på.
   Statistiken är inte kopplad till några användarnamn.
   ===================================================================== */
(function () {
  'use strict';
  const Q = window.KGQ;
  const $app = document.getElementById('app');
  const cfg = window.CYBER_CONFIG || {};
  const URL_ = String(cfg.supabaseUrl || '').trim().replace(/\/+$/, '');
  const KEY = String(cfg.supabaseKey || '').trim();
  const SPEL = 'kristallgruvan';
  const TKEY = 'cyberdyne.teacher';
  let token = null, days = 30, grade = '', data = null;
  try { token = sessionStorage.getItem(TKEY); } catch (e) { token = null; }

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const areaName = (id) => (Q.AREAS.find((a) => a.id === id) || {}).name || id;
  const pct = (w, a) => (a ? Math.round((w / a) * 100) : 0);
  const fmtN = (n) => Number(n || 0).toLocaleString('sv-SE');
  function view(html) { $app.innerHTML = html; const f = $app.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 30); }

  async function rpc(fn, body) {
    const h = { apikey: KEY, 'Content-Type': 'application/json' };
    if (/^eyJ/.test(KEY)) h.Authorization = 'Bearer ' + KEY;
    let r;
    try { r = await fetch(URL_ + '/rest/v1/rpc/' + fn, { method: 'POST', headers: h, body: JSON.stringify(body) }); }
    catch (e) { throw Object.assign(new Error('offline'), { code: 'offline' }); }
    const t = await r.text();
    if (!r.ok) { const code = ['not_logged_in', 'weak_password', 'not_found'].find((c) => t.indexOf(c) >= 0) || 'server'; throw Object.assign(new Error(t), { code }); }
    return t ? JSON.parse(t) : null;
  }

  /* ---------- inloggning ---------- */
  function showLogin(msg) {
    view(`
<header class="phead"><div><p class="eyebrow">Kristallgruvan</p><h1>Lärarsidan</h1></div><a class="btn ghost" href="./">Till spelet</a></header>
<section class="panel">
  ${URL_ && KEY ? `<p class="muted">Här ser du vilka uppgifter eleverna oftast gör fel på. Statistiken är anonym och inte kopplad till några namn.</p>
  <form id="tform" class="row" autocomplete="on">
    <input type="text" name="username" value="lärare" autocomplete="username" hidden>
    <label class="fld"><span>Lärarlösenord</span><input id="tpw" type="password" required autocomplete="current-password" autofocus></label>
    <button class="btn" type="submit">Logga in</button>
  </form>
  <p id="err" class="small errtxt" ${msg ? '' : 'hidden'}>${esc(msg || '')}</p>` : '<p>Lärarsidan behöver Supabase. Fyll i <code>konto/config.js</code> först (se README).</p>'}
</section>
<section class="panel">
  <h2>Lärarhandledning</h2>
  <p class="muted">Om spelet och matematiken, hur du tolkar statistiken, integritet och tips för klassrummet. Du behöver inte logga in för att läsa den.</p>
  <div class="row"><a class="btn ghost" href="lararhandledning.pdf" target="_blank" rel="noopener">Öppna lärarhandledningen (PDF)</a></div>
</section>`);
    const f = document.getElementById('tform');
    if (f) f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = f.querySelector('button'); b.disabled = true;
      try {
        const r = await rpc('teacher_login', { p_password: document.getElementById('tpw').value });
        if (r && r.token) { token = r.token; try { sessionStorage.setItem(TKEY, token); } catch (x) { /* */ } load(); return; }
        const m = { wrong_login: 'Fel lösenord.', locked: 'För många försök. Vänta 15 minuter och försök igen.', no_teacher_password: 'Inget lärarlösenord är satt än. Kör set_teacher_password i Supabase (se README).' }[r && r.error] || 'Kunde inte logga in.';
        showLogin(m);
      } catch (err) { showLogin('Kunde inte nå servern. Försök igen om en stund.'); }
    });
  }

  /* ---------- statistik ---------- */
  async function load() {
    view('<p class="muted" style="padding-top:20vh;text-align:center">Hämtar statistik…</p>');
    try {
      data = await rpc('teacher_stats', { p_token: token, p_spel: SPEL, p_days: days, p_grade: grade ? Number(grade) : null });
      render();
    } catch (e) {
      if (e.code === 'not_logged_in') { token = null; try { sessionStorage.removeItem(TKEY); } catch (x) { /* */ } showLogin('Du har blivit utloggad. Logga in igen.'); }
      else showLogin('Kunde inte hämta statistiken. Försök igen om en stund.');
    }
  }

  function bars(rows, labelFn) {
    // en serie (felprocent) -> en färg, värdet skrivs ut vid varje stapel
    const max = Math.max(10, ...rows.map((r) => pct(r.wrong, r.attempts)));
    return `<div class="hbars" role="list">${rows.map((r) => {
      const p = pct(r.wrong, r.attempts);
      return `<div class="hbar${r.attempts < 10 ? ' few' : ''}" role="listitem" tabindex="0" title="${esc(labelFn(r))}: ${p} % fel (${fmtN(r.wrong)} av ${fmtN(r.attempts)} svar)">
        <span class="hb-l">${esc(labelFn(r))}</span>
        <span class="hb-track"><span class="hb-fill" style="width:${Math.max(1, (p / max) * 100)}%"></span></span>
        <span class="hb-v">${p} %</span>
        <span class="hb-n">${fmtN(r.attempts)} svar${r.attempts < 10 ? ' · för få svar för att säga något' : ''}</span></div>`;
    }).join('')}</div>`;
  }

  function render() {
    const d = data || {}, t = d.totals || { attempts: 0, wrong: 0 };
    const areas = (d.areas || []).slice().sort((a, b) => pct(b.wrong, b.attempts) - pct(a.wrong, a.attempts));
    const levels = d.levels || [];
    const skills = d.skills || [];
    const activeDays = (d.days || []).filter((x) => x.attempts > 0).length;
    view(`
<div class="parent">
<header class="phead">
  <div><p class="eyebrow">Kristallgruvan</p><h1>Lärarsidan</h1></div>
  <div class="row"><a class="btn ghost" href="./">Till spelet</a><button class="btn ghost" data-t="logout">Logga ut</button></div>
</header>
<section class="panel filters">
  <label class="fld inline"><span>Period</span><select id="fdays">${[[7, 'Senaste 7 dagarna'], [30, 'Senaste 30 dagarna'], [90, 'Senaste 90 dagarna'], [365, 'Senaste året']].map(([v, n]) => `<option value="${v}" ${v === days ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
  <label class="fld inline"><span>Årskurs</span><select id="fgrade"><option value="">Alla</option>${[3, 4, 5, 6].map((g) => `<option value="${g}" ${String(g) === grade ? 'selected' : ''}>åk ${g}</option>`).join('')}</select></label>
</section>
<section class="panel">
  <div class="sumgrid">
    <div><p class="eyebrow">Svar</p><p class="big-v">${fmtN(t.attempts)}</p></div>
    <div><p class="eyebrow">Andel fel</p><p class="big-v">${pct(t.wrong, t.attempts)} %</p><p class="muted small">${fmtN(t.wrong)} felaktiga svar</p></div>
    <div><p class="eyebrow">Dagar med spel</p><p class="big-v">${activeDays}</p><p class="muted small">sedan ${esc(d.since || '')}</p></div>
  </div>
  ${t.attempts < 50 ? '<p class="muted small">Det finns lite data än, så siffrorna kan svänga mycket.</p>' : ''}
</section>
${t.attempts ? `
<section class="panel">
  <h2>Andel fel per område</h2>
  ${bars(areas, (r) => areaName(r.area))}
  <details><summary>Visa som tabell</summary><div class="tablewrap"><table><thead><tr><th>Område</th><th class="num">Svar</th><th class="num">Fel</th><th class="num">Andel fel</th></tr></thead><tbody>
    ${areas.map((r) => `<tr><td>${esc(areaName(r.area))}</td><td class="num">${fmtN(r.attempts)}</td><td class="num">${fmtN(r.wrong)}</td><td class="num">${pct(r.wrong, r.attempts)} %</td></tr>`).join('')}
  </tbody></table></div></details>
</section>
<section class="panel">
  <h2>Andel fel per svårighetsnivå</h2>
  ${bars(levels, (r) => Q.LEVEL_LABELS[r.level] || 'nivå ' + r.level)}
  <p class="muted small">Spelet anpassar nivån efter varje elev, så ungefär en tredjedel fel är normalt. Mycket högre än så kan betyda att nivån är för svår.</p>
</section>
<section class="panel">
  <h2>Vanligaste felen</h2>
  <p class="muted small">Färdigheter med högst andel fel (minst 5 svar). Exemplen är de senaste felaktiga svaren.</p>
  ${skills.length ? skills.map((s) => `
  <details class="skill">
    <summary><span class="sk-name">${esc(s.skill || 'övrigt')}</span> <span class="muted">· ${esc(areaName(s.area))}</span><span class="sk-p">${pct(s.wrong, s.attempts)} % fel</span><span class="muted small sk-n">${fmtN(s.wrong)} av ${fmtN(s.attempts)}</span></summary>
    ${(s.common_given || []).length ? `<p class="small">Vanliga felsvar: ${s.common_given.map((c) => `<span class="pill none">${esc(c.given)} · ${c.n} st</span>`).join(' ')}</p>` : ''}
    ${s.dunno ? `<p class="small muted">"Vet inte": ${fmtN(s.dunno)} gånger</p>` : ''}
    ${(s.examples || []).length ? `<div class="tablewrap"><table class="ans"><thead><tr><th>Nivå</th><th>Uppgift</th><th>Elevens svar</th><th>Rätt svar</th></tr></thead><tbody>
      ${s.examples.map((x) => `<tr class="miss"><td>${esc(Q.LEVEL_LABELS[x.level] || '')}</td><td>${esc(x.question)}</td><td><span class="mark">✗</span> ${esc(x.given)}</td><td>${esc(x.correct)}</td></tr>`).join('')}
    </tbody></table></div>` : ''}
  </details>`).join('') : '<p class="muted">Inga fel med tillräckligt många svar än.</p>'}
</section>` : '<section class="panel"><p class="muted">Inga svar under den här perioden.</p></section>'}
<section class="panel">
  <h2>Ge en elev ett nytt lösenord</h2>
  <p class="muted small">Om en elev har glömt sitt lösenord. Lösenordet gäller kontot i alla spel, och eleven loggas ut från alla enheter.</p>
  <form id="rform" class="row" autocomplete="off">
    <label class="fld"><span>Elevens smeknamn</span><input id="rname" required maxlength="16"></label>
    <label class="fld"><span>Nytt lösenord (minst 4 tecken)</span><input id="rpw" required minlength="4" maxlength="64"></label>
    <button class="btn" type="submit">Spara</button>
  </form>
  <p id="rmsg" class="small" hidden></p>
</section>
</div>`);
    document.getElementById('fdays').addEventListener('change', (e) => { days = Number(e.target.value); load(); });
    document.getElementById('fgrade').addEventListener('change', (e) => { grade = e.target.value; load(); });
    const rf = document.getElementById('rform');
    rf.addEventListener('submit', async (e) => {
      e.preventDefault();
      const m = document.getElementById('rmsg'); m.hidden = false;
      try {
        await rpc('teacher_reset_password', { p_token: token, p_name: document.getElementById('rname').value.trim(), p_new: document.getElementById('rpw').value });
        m.className = 'small okmsg'; m.textContent = 'Klart. Eleven kan logga in med det nya lösenordet.'; rf.reset();
      } catch (err) {
        m.className = 'small errtxt';
        m.textContent = { not_found: 'Hittade ingen elev med det smeknamnet.', weak_password: 'Lösenordet ska ha minst 4 tecken.', not_logged_in: 'Du har blivit utloggad. Ladda om sidan.' }[err.code] || 'Det gick inte att spara. Försök igen.';
      }
    });
  }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    if (b.dataset.t === 'logout') {
      try { await rpc('teacher_logout', { p_token: token }); } catch (x) { /* */ }
      token = null; try { sessionStorage.removeItem(TKEY); } catch (x) { /* */ }
      showLogin();
    }
  });

  if (token) load(); else showLogin();
})();

</script>
